<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>احسب توفيرك | FixIt</title>
  <link rel="canonical" href="https://fixitauto.parts/savings.html">
  <meta property="og:image" content="https://fixitauto.parts/assets/fixit-logo-square.png">
  <meta name="twitter:card" content="summary">
  <meta name="description" content="ارفع فاتورة أو مقايسة قطع غيار واعرف كنت هتوفّر كام مع FixIt — البوت بيقرأها ويقارن الأسعار.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#101828">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .sav-hero { text-align: center; padding: 8px 0 4px; }
    .sav-hero h1 { font-size: clamp(24px, 5vw, 40px); margin-bottom: 8px; }
    .sav-hero p { color: var(--muted); max-width: 640px; margin: 0 auto; }
    .sav-card { max-width: 760px; margin: 20px auto; background: var(--card, #fff); border: 1px solid var(--border, #e4e7ec); border-radius: 18px; padding: 22px; box-shadow: 0 10px 30px rgba(16,24,40,.06); }
    .sav-steps { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
    .sav-steps .st { font-size: 12px; color: var(--muted); background: var(--bg,#f9fafb); border: 1px solid var(--border,#eef0f3); border-radius: 999px; padding: 5px 12px; }
    .sav-steps .st.on { background: var(--accent-dark,#c2410c); color: #fff; border-color: transparent; }
    .reg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .reg-grid .full { grid-column: 1/-1; }
    .reg-grid label { display:block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .reg-grid input { width: 100%; }
    .mode-toggle { display:flex; gap:8px; margin: 4px 0 14px; }
    .mode-toggle button { flex:1; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border,#d0d5dd); background: var(--bg,#fff); font-weight: 800; cursor: pointer; font-size: 14px; }
    .mode-toggle button.on { border-color: var(--accent-dark,#c2410c); background: rgba(242,102,0,.06); color: var(--accent-dark,#c2410c); }
    .mode-hint { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
    .drop { border: 2px dashed var(--border, #d0d5dd); border-radius: 14px; padding: 26px 16px; text-align: center; cursor: pointer; transition: .15s; }
    .drop:hover, .drop.drag { border-color: var(--accent-dark, #c2410c); background: rgba(242,102,0,.04); }
    .drop .big { font-size: 38px; }
    .drop .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .previews { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; justify-content: center; }
    .previews .thumb { position: relative; width: 84px; height: 84px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border,#e4e7ec); }
    .previews .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .previews .thumb button { position: absolute; top: 2px; inset-inline-end: 2px; background: rgba(0,0,0,.6); color: #fff; border: 0; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 14px; line-height: 1; }
    .sav-actions { text-align: center; margin-top: 16px; }
    .sav-loading { text-align: center; padding: 24px; color: var(--muted); }
    .sav-hero-num { text-align: center; margin: 6px 0 18px; }
    .sav-hero-num .amount { font-size: clamp(34px, 8vw, 60px); font-weight: 900; color: #067647; line-height: 1; }
    .sav-hero-num .pct { display: inline-block; margin-top: 8px; background: #ecfdf3; color: #067647; font-weight: 800; padding: 4px 14px; border-radius: 999px; }
    .totals-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 12px 0 4px; }
    .totals-row .tbox { flex: 1; min-width: 150px; text-align: center; background: var(--bg, #f9fafb); border: 1px solid var(--border,#eef0f3); border-radius: 12px; padding: 12px; }
    .totals-row .tbox .lbl { font-size: 12px; color: var(--muted); }
    .totals-row .tbox .val { font-size: 20px; font-weight: 800; margin-top: 4px; }
    .sav-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    .sav-table th, .sav-table td { padding: 9px 8px; border-bottom: 1px solid var(--border,#eef0f3); text-align: start; }
    .sav-table th { color: var(--muted); font-weight: 700; font-size: 12px; }
    .sav-table .num { text-align: end; white-space: nowrap; }
    .sav-table .save-pos { color: #067647; font-weight: 800; }
    .sav-part { display: flex; align-items: center; gap: 8px; }
    .sav-part img { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; border: 1px solid var(--border,#eef0f3); }
    .sav-section-h { font-size: 15px; font-weight: 800; margin-top: 20px; display:flex; align-items:center; gap:6px; }
    .staff-box { margin-top: 8px; border: 1px solid #fed7aa; background: #fff7ed; border-radius: 12px; padding: 12px 14px; }
    .staff-box .staff-note { color: #9a3412; font-weight: 700; font-size: 13px; margin-bottom: 6px; }
    .staff-box ul { margin: 0; padding-inline-start: 18px; color: #7c2d12; font-size: 13.5px; }
    .sav-cta { text-align: center; margin-top: 22px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .sav-err { text-align: center; color: var(--red,#d92d20); padding: 14px; }
    .mode-toggle { flex-wrap: wrap; }
    .mode-toggle button { min-width: 150px; }
    .car-box { background: var(--bg,#f5f7fc); border: 1px solid var(--line,#e4e8f2); border-radius: 12px; padding: 12px; }
    .mb-h { font-weight: 800; font-size: 14px; margin-bottom: 8px; }
    .car-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 2fr; gap: 8px; }
    .mi-head, .mi-row { display: grid; grid-template-columns: 2.2fr 1.6fr .7fr 1.3fr 34px; gap: 6px; align-items: center; }
    .mi-head { font-size: 11.5px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
    .mi-row { margin-bottom: 6px; }
    .mi-row input { padding: 9px 10px; font-size: 14px; }
    .mi-row .rm { border: 0; background: #fee4e2; color: #b42318; border-radius: 8px; height: 38px; font-size: 18px; }
    @media (max-width: 640px){
      .car-grid { grid-template-columns: 1fr 1fr; }
      .mi-head { display: none; }
      .mi-row { grid-template-columns: 1fr 1fr 34px; padding: 8px; border: 1px solid var(--line,#e4e8f2); border-radius: 10px; }
      .mi-row { grid-template-columns: 70px 1fr 38px; }
      .mi-row .n, .mi-row .c { grid-column: 1 / -1; }
    }
    .opt-group { margin-top: 10px; border: 1px solid var(--line,#e4e8f2); border-radius: 12px; padding: 10px; }
    .opt-q { font-weight: 800; font-size: 14px; margin-bottom: 8px; }
    .opt-q small { color: var(--muted); font-weight: 600; }
    .opt-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .opt { border: 1px solid var(--line,#e4e8f2); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; background: #fff; }
    .opt-img { aspect-ratio: 1; border-radius: 8px; background: var(--bg,#f5f7fc); display: grid; place-items: center; font-size: 28px; overflow: hidden; }
    .opt-img img { width: 100%; height: 100%; object-fit: cover; }
    .opt-name { font-size: 12.5px; font-weight: 700; line-height: 1.35; flex: 1; }
    .opt-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .opt-foot b { color: #067647; font-size: 14px; flex: 1; }
    .opt-save { font-size: 11px; background: #ecfdf3; color: #067647; padding: 1px 6px; border-radius: 999px; font-weight: 800; }
    .opt { position: relative; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .opt:hover { border-color: var(--accent,#2f33bf); }
    .opt.on { border: 2px solid var(--accent,#2f33bf); box-shadow: 0 0 0 4px rgba(47,51,191,.12); }
    .opt-check { position: absolute; top: 6px; inset-inline-start: 6px; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid var(--line,#d0d5dd); display: grid; place-items: center; font-weight: 900; color: #fff; z-index: 1; }
    .opt.on .opt-check { background: var(--accent,#2f33bf); border-color: var(--accent,#2f33bf); }
    .opt-btn { text-align: center; font-size: 13px; font-weight: 800; padding: 7px; border-radius: 8px; background: var(--accent-soft,#eef0ff); color: var(--accent-dark,#23279c); }
    .opt.on .opt-btn { background: var(--accent,#2f33bf); color: #fff; }
    .opt-q { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .opt-q .exact { font-size: 11.5px; background: #ecfdf3; color: #067647; padding: 2px 8px; border-radius: 999px; margin-inline-start: 6px; }
    .line-x { border: 1px solid #fecdca; background: #fff; color: #b42318; border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
    .opt-group.removed { opacity: .55; background: var(--bg,#f5f7fc); }
    .opt-group.removed .opt-q span { text-decoration: line-through; }
    .opt-group.removed .line-x { color: var(--accent-dark,#23279c); border-color: var(--line,#d0d5dd); opacity: 1; }
    .opt-group.picked { border-color: #a6f4c5; }
    .pick-hint { margin-top: 8px; font-size: 12.5px; color: #b54708; font-weight: 700; }
    .inv-empty { margin-top: 18px; text-align: center; padding: 16px; border: 2px dashed var(--line,#d0d5dd); border-radius: 14px; color: var(--muted); font-weight: 700; }
    .inv { margin-top: 14px; border: 1px solid var(--line,#e4e8f2); border-radius: 16px; padding: 14px; background: #fff; box-shadow: 0 10px 30px rgba(16,24,40,.06); }
    .inv-h { font-weight: 900; font-size: 17px; margin-bottom: 8px; }
    .inv-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line,#e4e8f2); font-size: 14px; }
    .inv-n { white-space: nowrap; display: flex; gap: 8px; align-items: baseline; }
    .inv-n s { color: var(--muted); font-size: 12.5px; }
    .inv-sub { color: var(--muted); }
    .inv-total { font-size: 17px; font-weight: 900; border-bottom: 0; }
    .inv-save { background: #ecfdf3; color: #067647; border-radius: 10px; padding: 9px 10px; border: 0; font-weight: 800; }
    .inv-save b { font-size: 18px; }
    .inv-warn { margin-top: 8px; font-size: 13px; color: #b54708; font-weight: 700; }
    .inv-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .inv-actions .btn { flex: 1; min-width: 200px; text-align: center; justify-content: center; }
    @media (max-width: 600px){
      .opt-list { grid-template-columns: 1fr 1fr; gap: 6px; }
      .opt { padding: 6px; gap: 4px; }
      .opt-name { font-size: 11.5px; }
      .opt-foot b { font-size: 13px; }
      .opt-btn { font-size: 12px; padding: 5px; }
      .sav-card { padding: 14px; }
    }
    @media (max-width: 520px){ .reg-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container">
      <div class="sav-hero">
        <h1 data-i18n="sav_title">كنت هتوفّر كام مع فيكس إت؟</h1>
        <p data-i18n="sav_sub">سجّل بياناتك وارفع فاتورتك أو مقايستك، والبوت هيقرأها ويقارن الأسعار بأسعارنا ويقولك التوفير.</p>
      </div>

      <div class="sav-card">
        <div class="sav-steps">
          <span class="st on" id="step1">1 · <span data-i18n="sav_step_reg">بياناتك</span></span>
          <span class="st" id="step2">2 · <span data-i18n="sav_step_upload">ارفع</span></span>
          <span class="st" id="step3">3 · <span data-i18n="sav_step_result">النتيجة</span></span>
        </div>

        <!-- مرحلة 1: التسجيل -->
        <div id="stage-reg">
          <div class="reg-grid">
            <div class="full"><label data-i18n="sav_name">الاسم</label><input id="c-name" data-i18n-ph="sav_name_ph" placeholder="اسمك بالكامل"></div>
            <div><label data-i18n="sav_phone">رقم الموبايل</label><input id="c-phone" type="tel" dir="ltr" style="text-align:start;" placeholder="01xxxxxxxxx"></div>
            <div><label data-i18n="sav_car">نوع العربية</label><input id="c-car" data-i18n-ph="sav_car_ph" placeholder="مثال: BMW F30 2016"></div>
          </div>
          <div class="sav-err" id="reg-err" style="display:none;"></div>
          <div class="sav-actions"><button class="btn" id="reg-next" data-i18n="sav_continue">التالي ←</button></div>
        </div>

        <!-- مرحلة 2: الرفع -->
        <div id="stage-upload" style="display:none;">
          <div class="mode-toggle">
            <button id="mode-invoice" class="on" data-mode="invoice" data-i18n="sav_mode_invoice">🧾 عندي فاتورة</button>
            <button id="mode-quote" data-mode="quote" data-i18n="sav_mode_quote">📋 عندي مقايسة أسعار</button>
            <button id="mode-manual" data-mode="manual">✍️ <span class="ar-en" data-ar="هكتب القطع بإيدي" data-en="Type my parts"></span></button>
          </div>
          <div class="mode-hint" id="mode-hint"></div>
          <!-- ✍️ كتابة القطع بند بند -->
          <div id="manual-box" style="display:none;">
            <div class="car-box">
              <div class="mb-h">🚗 <span class="ar-en" data-ar="تفاصيل العربية (اختياري — بتساعدنا نحدد القطعة الصح)" data-en="Car details (optional — helps us find the exact part)"></span></div>
              <div class="car-grid">
                <input id="cd-model" class="ph" data-ar="الموديل/الشاسيه (مثال: F30 320i)" data-en="Model / chassis (e.g. F30 320i)">
                <input id="cd-year" class="ph" inputmode="numeric" maxlength="4" data-ar="سنة الصنع" data-en="Year">
                <input id="cd-engine" class="ph" data-ar="المحرك (مثال: N20)" data-en="Engine (e.g. N20)">
                <input id="cd-vin" class="ph" dir="ltr" maxlength="17" data-ar="رقم الشاسيه VIN (١٧ حرف)" data-en="VIN (17 chars)">
              </div>
            </div>
            <div class="mb-h" style="margin-top:14px;">🔧 <span class="ar-en" data-ar="القطع المطلوبة" data-en="Parts"></span></div>
            <div class="mi-head"><span class="ar-en" data-ar="اسم القطعة *" data-en="Part name *"></span><span class="ar-en" data-ar="رقم القطعة (اختياري)" data-en="Part no. (optional)"></span><span class="ar-en" data-ar="الكمية" data-en="Qty"></span><span class="ar-en" data-ar="السعر اللي اتقالك (اختياري)" data-en="Price you were quoted (optional)"></span><span></span></div>
            <div id="mi-rows"></div>
            <button type="button" class="btn btn-outline btn-sm" id="mi-add" style="margin-top:8px;">＋ <span class="ar-en" data-ar="ضيف قطعة" data-en="Add part"></span></button>
          </div>

          <label class="drop" id="drop">
            <div class="big">🧾</div>
            <div><b data-i18n="sav_upload">📷 ارفع الصورة</b></div>
            <div class="hint" data-i18n="sav_upload_hint">صورة واضحة (JPG/PNG) — لحد ٤ صور لو من كذا صفحة.</div>
            <input type="file" id="file" accept="image/*" multiple capture="environment" hidden>
          </label>
          <div class="previews" id="previews"></div>
          <div class="sav-actions">
            <button class="btn btn-outline btn-sm" id="reg-back" data-i18n="sav_back">→ رجوع</button>
            <button class="btn" id="go" disabled data-i18n="sav_analyze">حلّل دلوقتي</button>
          </div>
        </div>

        <!-- التحميل -->
        <div class="sav-loading" id="sav-loading" style="display:none;">
          <div style="font-size:34px;">⏳</div>
          <p data-i18n="sav_analyzing">⏳ بنقرأ الصورة ونقارن الأسعار...</p>
        </div>

        <!-- مرحلة 3: النتيجة -->
        <div id="sav-result" style="display:none;"></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script>
    renderLayout('savings');
    document.title = t('sav_title') + ' | ' + (SITE.name || 'FixIt');

    const $ = (id) => document.getElementById(id);
    let mode = 'invoice';
    let images = [];
    let customer = {};

    // استرجاع بيانات العميل لو سجّل قبل كده
    try {
      const saved = JSON.parse(localStorage.getItem('sav_customer') || '{}');
      if (saved.name) $('c-name').value = saved.name;
      if (saved.phone) $('c-phone').value = saved.phone;
      if (saved.car) $('c-car').value = saved.car;
    } catch {}

    // نصوص عربي/إنجليزي للجزء الجديد
    document.querySelectorAll('.ar-en').forEach((e) => { e.textContent = LANG === 'en' ? e.dataset.en : e.dataset.ar; });
    document.querySelectorAll('input.ph').forEach((e) => { e.placeholder = LANG === 'en' ? e.dataset.en : e.dataset.ar; });
    const L = (ar, en) => (LANG === 'en' ? en : ar);

    // ✍️ صفوف القطع اليدوية
    function addRow(v = {}) {
      const r = document.createElement('div'); r.className = 'mi-row';
      r.innerHTML = `<input class="n" placeholder="${L('مثال: تيل فرامل أمامي', 'e.g. Front brake pads')}" value="${esc(v.name || '')}">
        <input class="c" dir="ltr" placeholder="${L('مثال: 34116850568', 'e.g. 34116850568')}" value="${esc(v.code || '')}">
        <input class="q" type="number" min="1" value="${v.qty || 1}">
        <input class="p" type="number" min="0" placeholder="${L('ج.م', 'EGP')}" value="${v.price || ''}">
        <button type="button" class="rm" title="${L('حذف', 'Remove')}">×</button>`;
      r.querySelector('.rm').addEventListener('click', () => { r.remove(); if (!$('mi-rows').children.length) addRow(); syncBtn(); });
      r.querySelectorAll('input').forEach((i) => i.addEventListener('input', syncBtn));
      $('mi-rows').appendChild(r);
    }
    $('mi-add').addEventListener('click', () => { if ($('mi-rows').children.length >= 30) return; addRow(); $('mi-rows').lastChild.querySelector('.n').focus(); });
    addRow(); addRow();
    function manualItems() {
      return [...$('mi-rows').children].map((r) => ({
        name: r.querySelector('.n').value.trim(),
        code: r.querySelector('.c').value.trim(),
        qty: Math.max(1, Number(r.querySelector('.q').value) || 1),
        unit_price: Number(r.querySelector('.p').value) || 0,
      })).filter((i) => i.name || i.code);
    }

    function setStep(n) {
      [1, 2, 3].forEach((i) => $('step' + i).classList.toggle('on', i <= n));
    }
    function updateModeHint() {
      $('mode-hint').textContent = mode === 'manual'
        ? L('اكتب كل قطعة في سطر — رقم القطعة اختياري، ولو اتقالك سعر في مكان تاني اكتبه ونقولك هتوفّر كام.', 'One part per line — part number is optional. Add the price you were quoted elsewhere and we\'ll show your savings.')
        : mode === 'quote' ? t('sav_mode_quote_hint') : t('sav_mode_invoice_hint');
      $('manual-box').style.display = mode === 'manual' ? '' : 'none';
      $('drop').style.display = mode === 'manual' ? 'none' : '';
      $('previews').style.display = mode === 'manual' ? 'none' : '';
      syncBtn();
      $('drop').querySelector('.hint').textContent = t('sav_upload_hint');
    }

    // مرحلة 1 → 2
    $('reg-next').addEventListener('click', () => {
      const name = $('c-name').value.trim();
      const phone = $('c-phone').value.trim();
      const car = $('c-car').value.trim();
      const err = $('reg-err');
      if (!name) return showRegErr(t('sav_err_name'));
      if (!/^01\d{9}$/.test(phone.replace(/[\s-]/g, ''))) return showRegErr(t('sav_err_phone'));
      if (!car) return showRegErr(t('sav_err_car'));
      err.style.display = 'none';
      customer = { name, phone, car };
      try { localStorage.setItem('sav_customer', JSON.stringify(customer)); } catch {}
      $('stage-reg').style.display = 'none';
      $('stage-upload').style.display = '';
      setStep(2);
      updateModeHint();
    });
    function showRegErr(m) { const e = $('reg-err'); e.textContent = m; e.style.display = ''; }

    $('reg-back').addEventListener('click', () => {
      $('stage-upload').style.display = 'none';
      $('stage-reg').style.display = '';
      setStep(1);
    });

    // اختيار الوضع
    ['invoice', 'quote', 'manual'].forEach((m) => $('mode-' + m).addEventListener('click', () => {
      mode = m;
      ['invoice', 'quote', 'manual'].forEach((x) => $('mode-' + x).classList.toggle('on', x === m));
      updateModeHint();
    }));

    // ضغط الصور قبل الرفع
    function compress(file) {
      return new Promise((resolve) => {
        const img = new Image(); const fr = new FileReader();
        fr.onload = () => { img.src = fr.result; };
        img.onload = () => {
          const max = 1600; let { width: w, height: h } = img;
          if (w > max || h > max) { const r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = () => resolve(null);
        fr.readAsDataURL(file);
      });
    }
    function renderPreviews() {
      $('previews').innerHTML = images.map((src, i) => `
        <div class="thumb"><img src="${src}" alt=""><button data-rm="${i}" title="حذف">×</button></div>`).join('');
      $('previews').querySelectorAll('[data-rm]').forEach((b) =>
        b.addEventListener('click', () => { images.splice(Number(b.dataset.rm), 1); renderPreviews(); syncBtn(); }));
    }
    function syncBtn() { $('go').disabled = mode === 'manual' ? !manualItems().some((i) => i.name || i.code) : images.length === 0; }
    async function addFiles(files) {
      for (const f of Array.from(files).slice(0, 4 - images.length)) {
        if (!f.type.startsWith('image/')) continue;
        const d = await compress(f); if (d) images.push(d);
      }
      images = images.slice(0, 4); renderPreviews(); syncBtn();
    }
    $('file').addEventListener('change', (e) => addFiles(e.target.files));
    const drop = $('drop');
    ['dragover', 'dragenter'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('drag'); }));
    drop.addEventListener('drop', (e) => { if (e.dataTransfer?.files) addFiles(e.dataTransfer.files); });

    $('go').addEventListener('click', analyze);

    async function analyze() {
      if (mode === 'manual' && manualItems().some((i) => !i.name && i.code.length < 4)) return toast(L('اكتب اسم القطعة أو رقمها', 'Enter a part name or number'));
      $('stage-upload').style.display = 'none';
      $('sav-result').style.display = 'none';
      $('sav-loading').style.display = '';
      setStep(3);
      try {
        const data = await api('/savings', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(mode === 'manual'
            ? { mode, customer: { ...customer, carDetails: { model: $('cd-model').value.trim(), year: $('cd-year').value.trim(), engine: $('cd-engine').value.trim(), vin: $('cd-vin').value.trim() } }, items: manualItems() }
            : { mode, customer, images }),
        });
        trackEvent('savings_lead');
        renderResult(data);
      } catch (e) {
        $('sav-result').innerHTML = `<div class="sav-err">${esc(e.message) || t('sav_err')}</div>` + backBtn();
        $('sav-loading').style.display = 'none'; $('sav-result').style.display = '';
        wireBack();
      }
    }
    function backBtn() { return `<div class="sav-cta"><button class="btn btn-outline" id="again" data-i18n="sav_again">${t('sav_again')}</button></div>`; }
    function wireBack() { const b = $('again'); if (b) b.addEventListener('click', () => location.reload()); }

    function partCell(m) {
      const p = m.product || {};
      const img = p.image ? `<img src="${esc(p.image)}" alt="">` : '';
      const link = p.id ? productUrl(p) : '#';
      return `<div class="sav-part">${img}<div><a href="${link}">${esc(m.name || p.name)}</a>${p.sku ? `<div style="font-size:11px;color:var(--muted);" dir="ltr">${esc(p.sku)}</div>` : ''}</div></div>`;
    }

    function renderResult(data) {
      $('sav-loading').style.display = 'none';
      $('sav-result').style.display = '';
      const L2 = (ar, en) => (LANG === 'en' ? en : ar);
      const conf = data.confident || [];
      const withOpts = (data.unsure || []).filter((u) => (u.options || []).length);
      const staff = [...(data.unsure || []).filter((u) => !(u.options || []).length).map((u) => ({ ...u, why: t('sav_why_unsure') })),
                     ...(data.unmatched || []).map((u) => ({ ...u, why: t('sav_why_missing') }))];
      if (!conf.length && !withOpts.length && !staff.length) {
        $('sav-result').innerHTML = `<div class="sav-err">${t('sav_none')}</div>` + backBtn();
        wireBack(); return;
      }

      // 🧾 كل بند: اختيارات + المختار + محذوف ولا لأ
      const lines = [
        ...conf.map((m) => ({ name: m.name, qty: m.qty || 1, theirUnit: m.theirUnit || 0, options: [m.product], pick: m.product.id, exact: true })),
        ...withOpts.map((u) => ({ name: u.name, qty: u.qty || 1, theirUnit: u.theirUnit || 0, options: u.options.filter((o) => o.price > 0).length ? u.options : u.options, pick: null })),
      ].map((l, i) => ({ ...l, i, removed: false }));

      const optCard = (l, o) => `<div class="opt ${l.pick === o.id ? 'on' : ''}" data-line="${l.i}" data-pick="${esc(o.id)}" role="button" tabindex="0">
          <span class="opt-check">${l.pick === o.id ? '✓' : ''}</span>
          <div class="opt-img">${o.image ? `<img src="${esc(fixMediaUrl(o.image))}" alt="" loading="lazy" onerror="this.remove()">` : '🔧'}</div>
          <a href="${productUrl(o)}" target="_blank" rel="noopener" class="opt-name" data-stop>${esc(o.name)}</a>
          <div class="opt-foot"><b>${o.price ? money(o.price) : L2('السعر عند الطلب', 'Ask for price')}</b>
            ${l.theirUnit && o.price && o.price < l.theirUnit ? `<span class="opt-save">${L2('توفّر', 'Save')} ${money(l.theirUnit - o.price)}</span>` : ''}</div>
          <div class="opt-btn">${l.pick === o.id ? L2('✓ اخترتها', '✓ Selected') : L2('اختار دي', 'Choose')}</div>
        </div>`;

      const lineBox = (l) => `<div class="opt-group ${l.removed ? 'removed' : ''} ${l.pick ? 'picked' : ''}" id="line-${l.i}">
          <div class="opt-q"><span>«${esc(l.name)}»${l.qty > 1 ? ' ×' + l.qty : ''}${l.theirUnit ? ` <small>${L2('اتقالك', 'quoted')} ${money(l.theirUnit)}</small>` : ''}
            ${l.exact ? `<span class="exact">✅ ${L2('نفس رقم القطعة', 'exact part number')}</span>` : ''}</span>
            <button type="button" class="line-x" data-toggle="${l.i}">${l.removed ? L2('↩️ رجّع البند', '↩️ Restore') : L2('✕ شيل البند', '✕ Remove')}</button></div>
          ${l.removed ? '' : `<div class="opt-list">${l.options.map((o) => optCard(l, o)).join('')}</div>
            ${!l.exact && !l.pick ? `<div class="pick-hint">👆 ${L2('اختار القطعة المناسبة لعربيتك', 'Pick the right one for your car')}</div>` : ''}`}
        </div>`;

      function summaryHtml() {
        const chosen = lines.filter((l) => !l.removed && l.pick).map((l) => ({ ...l, p: l.options.find((o) => o.id === l.pick) }));
        const pending = lines.filter((l) => !l.removed && !l.pick).length;
        const ours = chosen.reduce((s, l) => s + (l.p.price || 0) * l.qty, 0);
        const cmp = chosen.filter((l) => l.theirUnit > 0);
        const theirs = cmp.reduce((s, l) => s + l.theirUnit * l.qty, 0);
        const oursCmp = cmp.reduce((s, l) => s + (l.p.price || 0) * l.qty, 0);
        const save = theirs - oursCmp;
        if (!chosen.length) return `<div class="inv-empty">🧾 ${L2('اختار القطع اللي عاوزها من فوق وهتظهرلك فاتورتك والتوفير هنا', 'Choose your parts above and your invoice and savings will show here')}${pending ? ` · ${L2('فاضل', 'left')} ${pending}` : ''}</div>`;
        return `
          ${theirs > 0 && save > 0 ? `<div class="sav-hero-num"><div style="color:var(--muted);font-weight:700;">${t('sav_result_save')}</div>
            <div class="amount">${money(save)}</div><div class="pct">${t('sav_result_pct')} ${Math.round(save / theirs * 100)}%</div></div>` : ''}
          <div class="inv">
            <div class="inv-h">🧾 ${L2('فاتورتك مع فيكس إت', 'Your FixIt invoice')}</div>
            ${chosen.map((l) => `<div class="inv-row"><span>${esc(l.p.name)}${l.qty > 1 ? ` <small>×${l.qty}</small>` : ''}</span>
              <span class="inv-n">${l.theirUnit ? `<s>${money(l.theirUnit * l.qty)}</s>` : ''}<b>${l.p.price ? money(l.p.price * l.qty) : L2('عند الطلب', 'on request')}</b></span></div>`).join('')}
            ${theirs > 0 ? `<div class="inv-row inv-sub"><span>${t('sav_their_total')}</span><span class="inv-n"><s>${money(theirs)}</s></span></div>` : ''}
            <div class="inv-row inv-total"><span>${L2('الإجمالي عندنا', 'Our total')}</span><span class="inv-n"><b>${money(ours)}</b></span></div>
            ${theirs > 0 ? `<div class="inv-row inv-save"><span>💰 ${L2('وفّرت', 'You save')}</span><span class="inv-n"><b>${money(Math.max(0, save))}</b></span></div>` : ''}
            ${pending ? `<div class="inv-warn">⚠️ ${L2(`لسه فيه ${pending} بند ماخترتش ليه قطعة`, `${pending} line(s) still need a choice`)}</div>` : ''}
            <div class="inv-actions">
              <button class="btn" id="inv-cart">🛒 ${L2('أضف المختار للسلة وكمّل الطلب', 'Add selected to cart & checkout')}</button>
              <a class="btn btn-green" target="_blank" rel="noopener" id="inv-wa">💬 ${L2('ابعت الفاتورة واتساب', 'Send on WhatsApp')}</a>
            </div>
          </div>`;
      }

      function draw() {
        let html = '';
        if (lines.length) {
          html += `<div class="sav-section-h">🔎 ${L2('القطع اللي لقيناها — اختار، بدّل أو شيل أي بند', 'Parts we found — choose, swap or remove any line')} (${lines.filter((l) => !l.removed).length})</div>`
            + lines.map(lineBox).join('')
            + `<div style="font-size:12.5px;color:var(--muted);margin-top:6px;">${L2('مش متأكد أنهي تركب؟ ابعتلنا رقم الشاسيه على واتساب ونحددهالك.', 'Not sure which fits? Send us your VIN on WhatsApp.')}</div>`;
        }
        if (staff.length) {
          html += `<div class="sav-section-h">📞 ${t('sav_staff_title')} (${staff.length})</div>
            <div class="staff-box"><div class="staff-note">${t('sav_staff_note')}</div>
              <ul>${staff.map((u) => `<li>${esc(u.name || u.code || '—')} — <span style="opacity:.8">${esc(u.why)}</span></li>`).join('')}</ul></div>`;
        }
        html += `<div id="inv-box">${summaryHtml()}</div>` + backBtn();
        const y = window.scrollY;
        $('sav-result').innerHTML = html;
        window.scrollTo(0, y);
        wire();
      }

      function wire() {
        $('sav-result').querySelectorAll('[data-stop]').forEach((a) => a.addEventListener('click', (e) => e.stopPropagation()));
        $('sav-result').querySelectorAll('.opt[data-pick]').forEach((c) => {
          const go = () => {
            const l = lines[Number(c.dataset.line)];
            if (l.exact) return;
            l.pick = l.pick === c.dataset.pick ? null : c.dataset.pick;
            draw();
          };
          c.addEventListener('click', go);
          c.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
        });
        $('sav-result').querySelectorAll('[data-toggle]').forEach((b) => b.addEventListener('click', () => {
          const l = lines[Number(b.dataset.toggle)]; l.removed = !l.removed; draw();
        }));
        const cartBtn = $('inv-cart');
        if (cartBtn) cartBtn.addEventListener('click', () => {
          const chosen = lines.filter((l) => !l.removed && l.pick);
          const cart = getCart();
          chosen.forEach((l) => { const p = l.options.find((o) => o.id === l.pick); if (p && p.price) cart[p.id] = (cart[p.id] || 0) + l.qty; });
          setCart(cart);
          trackEvent('add_cart', { pid: 'savings', n: chosen.length });
          location.href = '/cart.html';
        });
        const wa = $('inv-wa');
        if (wa) {
          const chosen = lines.filter((l) => !l.removed && l.pick).map((l) => ({ l, p: l.options.find((o) => o.id === l.pick) }));
          const total = chosen.reduce((s, x) => s + (x.p.price || 0) * x.l.qty, 0);
          wa.href = waLink(L2('عاوز أطلب القطع دي من حاسبة التوفير 🧾', 'I want to order these parts 🧾') + '\n' +
            chosen.map((x) => `• ${x.p.name}${x.p.sku ? ' (' + x.p.sku + ')' : ''} ×${x.l.qty} — ${x.p.price || '?'}`).join('\n') +
            '\n' + L2('الإجمالي', 'Total') + ': ' + total + (customer && customer.car ? '\n🚗 ' + customer.car : ''));
        }
        wireBack();
      }
      draw();
    }
  </script>
</body>
</html>
