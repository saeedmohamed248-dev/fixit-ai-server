<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 data-i18n="as_title"></h1>
        <p style="color: var(--muted);" data-i18n="as_sub"></p>
      </div>
      <div class="chat-box">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input">
          <input id="chat-input" data-i18n-ph="as_ph" autocomplete="off">
          <button class="btn" id="chat-send" data-i18n="send"></button>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script>
    renderLayout('assistant');
    document.title = t('title_assistant');

    const messagesBox = document.getElementById('chat-messages');
    const input = document.getElementById('chat-input');
    const sendBtn = document.getElementById('chat-send');

    const history = [{
      role: 'system',
      content: 'أنت خبير قطع غيار سيارات BMW وMINI Cooper في متجر "FixIt" بمصر. مهمتك مساعدة العميل في تشخيص المشكلة وتحديد اسم القطعة المطلوبة بالعربي والإنجليزي، وبرقم OEM لو أمكن. اسأل عن الموديل والسنة لو مش واضحين. رد بنفس لغة العميل (عربي مصري بسيط أو إنجليزي). ردودك مختصرة، وفي نهاية كل تشخيص اقترح على العميل يدور على القطعة في المتجر أو يتواصل واتساب لو مش لاقيها. You are the FixIt BMW & MINI parts expert in Egypt — reply in the same language the customer writes in.',
    }];

    function addMsg(text, who) {
      const div = document.createElement('div');
      div.className = 'msg msg-' + who;
      div.textContent = text;
      messagesBox.appendChild(div);
      messagesBox.scrollTop = messagesBox.scrollHeight;
      return div;
    }

    addMsg(t('as_greeting'), 'bot');

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMsg(text, 'user');
      history.push({ role: 'user', content: text });
      const thinking = addMsg(t('thinking'), 'bot');
      sendBtn.disabled = true;
      try {
        const res = await fetch('/api/diagnose', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content;
        if (!reply) throw new Error(data.error?.message || data.error || t('as_error'));
        thinking.textContent = reply;
        history.push({ role: 'assistant', content: reply });
      } catch (e) {
        thinking.textContent = '⚠️ ' + e.message + ' — ' + t('as_fallback');
      }
      sendBtn.disabled = false;
      input.focus();
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
