<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اسأل الخبير | بافاريا بارتس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1>اسأل خبير قطع الغيار 🤖</h1>
        <p style="color: var(--muted);">مش عارف اسم القطعة؟ عندك صوت غريب في العربية؟ اوصف المشكلة وهنساعدك تعرف القطعة المطلوبة.</p>
      </div>
      <div class="chat-box">
        <div class="chat-messages" id="chat-messages">
          <div class="msg msg-bot">أهلاً بيك 👋 أنا خبير قطع غيار BMW و MINI. قولي نوع عربيتك وسنة الموديل والمشكلة اللي عندك، وهساعدك تحدد القطعة اللي محتاجها.</div>
        </div>
        <div class="chat-input">
          <input id="chat-input" placeholder="مثال: عندي BMW F30 موديل 2015 وفيه صوت طقطقة في العفشة..." autocomplete="off">
          <button class="btn" id="chat-send">إرسال</button>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script>
    renderLayout('assistant');

    const messagesBox = document.getElementById('chat-messages');
    const input = document.getElementById('chat-input');
    const sendBtn = document.getElementById('chat-send');

    const history = [{
      role: 'system',
      content: 'أنت خبير قطع غيار سيارات BMW وMINI Cooper في متجر "بافاريا بارتس" بمصر. مهمتك مساعدة العميل في تشخيص المشكلة وتحديد اسم القطعة المطلوبة بالعربي والإنجليزي، وبرقم OEM لو أمكن. اسأل عن الموديل والسنة لو مش واضحين. ردودك مختصرة وباللهجة المصرية البسيطة، وفي نهاية كل تشخيص اقترح على العميل يدور على القطعة في قسم المتجر أو يتواصل واتساب لو مش لاقيها.',
    }];

    function addMsg(text, who) {
      const div = document.createElement('div');
      div.className = 'msg msg-' + who;
      div.textContent = text;
      messagesBox.appendChild(div);
      messagesBox.scrollTop = messagesBox.scrollHeight;
      return div;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMsg(text, 'user');
      history.push({ role: 'user', content: text });
      const thinking = addMsg('... بفكر', 'bot');
      sendBtn.disabled = true;
      try {
        const res = await fetch('/api/diagnose', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content;
        if (!reply) throw new Error(data.error?.message || data.error || 'الخدمة غير متاحة حالياً');
        thinking.textContent = reply;
        history.push({ role: 'assistant', content: reply });
      } catch (e) {
        thinking.textContent = '⚠️ ' + e.message + ' — تقدر تتواصل معانا واتساب مباشرة.';
      }
      sendBtn.disabled = false;
      input.focus();
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
