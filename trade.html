<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="canonical" href="https://fixitauto.parts/trade.html">
  <meta property="og:image" content="https://fixitauto.parts/assets/fixit-logo-square.png">
  <meta name="twitter:card" content="summary">
  <meta name="description" content="FixIt Trade — wholesale export of BMW & MINI parts from the UAE. Tiered trade pricing, worldwide shipping, genuine supply. تصدير جملة قطع غيار BMW وميني من الإمارات لكل العالم.">
  <meta property="og:title" content="FixIt Trade — BMW & MINI Wholesale">
  <meta property="og:description" content="Tiered wholesale pricing, worldwide shipping, genuine supply — for traders, workshops and distributors.">

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#08090c">
  <!-- هذه المنصة هي فرع الجملة — نضبط الوضع مبكراً عشان السكين الداكن يتطبّق من غير وميض -->
  <script>try { localStorage.setItem('mode', 'wholesale'); } catch (e) {}</script>

<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container" id="trade-root">
      <div class="spinner" data-i18n="loading">جاري التحميل...</div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js?v=20261128c"></script>
  <script src="/js/i18n.js?v=20261128c"></script>
  <script src="/js/app.js?v=20261128c"></script>
  <script>
    renderLayout('trade');
    document.title = (wsConf().brandEn || 'FixIt Trade') + ' — ' + (LANG === 'en' ? 'Wholesale Export' : 'تصدير جملة');
    const root = document.getElementById('trade-root');
    const user = () => { const b = wsBuyer(); return b && b.phone ? b : null; };
    let CATALOG = [];
    let SHIPMENTS = [];

    /* ---------- 🆕 وصل حديثاً ---------- */
    function newArrivalsHtml() {
      if (wsLocked()) return '';
      const fresh = newArrivals(CATALOG, 8);
      if (!fresh.length) return '';
      return `
      <section id="new-arrivals" style="margin-top:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 4px;">
          <h2 style="margin:0;">${t('na_title')}</h2>
          <a href="/shop.html?sort=newest" style="color:var(--accent);font-weight:700;">${t('ws_view_catalog')} →</a>
        </div>
        <div class="panel-sub" style="color:var(--muted);margin-bottom:14px;">${t('na_sub')}</div>
        <div class="products-grid na-grid">${fresh.map(productCard).join('')}</div>
      </section>`;
    }

    /* ---------- 🔔 اشتراك تنبيهات الوصولات ---------- */
    function alertBoxHtml() {
      const u = user();
      return `
      <section class="trade-panel alert-box" id="alerts">
        <h2>${t('alert_title')}</h2>
        <div class="panel-sub">${t('alert_sub')}</div>
        <div class="trade-grid">
          <div class="form-stack">
            <div><label>${t('rfq_name')}</label><input id="al-name" value="${u ? esc(u.name) : ''}"></div>
            <div><label>${t('phone').replace(' *', '')}</label><input id="al-phone" type="tel" dir="ltr" style="text-align:start;" placeholder="9715xxxxxxxx" value="${u ? esc(u.phone) : ''}"></div>
          </div>
          <div class="form-stack">
            <div><label>${t('alert_interest')}</label><textarea id="al-interest" rows="3" placeholder="${esc(t('alert_interest_ph'))}"></textarea></div>
          </div>
        </div>
        <div style="margin-top:12px;"><button class="btn" id="al-go">${t('alert_subscribe')}</button>
          <span id="al-msg" style="margin-inline-start:10px;font-size:14px;"></span></div>
      </section>`;
    }
    function wireAlerts() {
      const go = document.getElementById('al-go');
      if (!go) return;
      go.addEventListener('click', async () => {
        const msg = document.getElementById('al-msg');
        const name = document.getElementById('al-name').value.trim();
        const phone = document.getElementById('al-phone').value.trim();
        const interest = document.getElementById('al-interest').value.trim();
        if (!name || !phone) { msg.style.color = 'var(--red)'; msg.textContent = t('fill_required'); return; }
        go.disabled = true; go.textContent = t('sending');
        try {
          await api('/alerts', { method: 'POST', body: JSON.stringify({ name, phone, interest }) });
          trackEvent('trade_alert');
          msg.style.color = '#4ade80'; msg.textContent = t('alert_done');
          go.textContent = '✓';
        } catch (e) { msg.style.color = 'var(--red)'; msg.textContent = e.message; go.disabled = false; go.textContent = t('alert_subscribe'); }
      });
    }

    /* ---------- ✏️ أيقونات خطية (نفس ستايل المتجر) ---------- */
    const TX = {
      box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
      globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
      ship: '<path d="M3 17h18l-2 4H5z"/><path d="M5 17V9h14v8M9 9V5h6v4"/>',
      star: '<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
      recycle: '<path d="M7 19H4l3-5M17 19h3l-3-5M12 4l-2 3h4z"/><path d="M7 14 10 7M17 14l-3-7M7 19h10"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      bank: '<path d="M3 10 12 4l9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>',
      hash: '<path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"/>',
      shield: '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
      doc: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
      card: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h3"/>',
    };
    const txIc = (k) => `<svg class="tx-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${TX[k] || TX.box}</svg>`;

    /* ---------- شريط المصداقية ---------- */
    function statsBar() {
      const stats = wsConf().stats || [];
      if (!stats.length) return '';
      return `<div class="stats-bar">${stats.map((s, i) => `
        <div class="stat-cell">
          <div class="stat-ic">${txIc(['box', 'globe', 'ship', 'star'][i] || 'box')}</div>
          <div class="stat-val">${esc(s.value)}</div>
          <div class="stat-lbl">${esc(LANG === 'en' ? s.labelEn : s.labelAr)}</div>
        </div>`).join('')}</div>`;
    }

    /* ---------- إزاي نشتغل (خطوات) ---------- */
    function processSteps() {
      const steps = [1, 2, 3, 4].map((n) => ({ t: t(`proc_${n}_t`), d: t(`proc_${n}_d`) }));
      const icons = [txIc('doc'), txIc('card'), txIc('ship'), txIc('box')];
      return `
      <section style="margin-top:8px;">
        <h2 style="margin:8px 0 2px;">${t('proc_title')}</h2>
        <div class="panel-sub" style="color:var(--muted);margin-bottom:16px;">${t('proc_sub')}</div>
        <div class="proc-grid">
          ${steps.map((s, i) => `
            <div class="proc-step">
              <div class="proc-num">${i + 1}</div>
              <div class="proc-ic">${icons[i]}</div>
              <h4>${esc(s.t)}</h4>
              <p>${esc(s.d)}</p>
            </div>`).join('')}
        </div>
      </section>`;
    }

    /* ---------- الأسئلة الشائعة ---------- */
    function faqSection() {
      const faq = wsConf().faq || [];
      if (!faq.length) return '';
      return `
      <section class="trade-panel" id="faq">
        <h2>${t('faq_title')}</h2>
        <div class="faq-list">
          ${faq.map((f, i) => `
            <details class="faq-item" ${i === 0 ? 'open' : ''}>
              <summary>${esc(LANG === 'en' ? f.qEn : f.qAr)}</summary>
              <p>${esc(LANG === 'en' ? f.aEn : f.aAr)}</p>
            </details>`).join('')}
        </div>
      </section>`;
    }

    /* ---------- لوحة الثقة الدولية ---------- */
    function trustGrid() {
      const tr = wsConf().trust || {};
      const L = (a, e) => (LANG === 'en' ? e : a);
      const cells = [
        { ic: txIc('recycle'), lbl: t('trust_condition'), val: L(tr.conditionAr, tr.conditionEn) },
        { ic: txIc('globe'), lbl: t('trust_countries'), val: L(tr.countriesAr, tr.countriesEn) },
        { ic: txIc('ship'), lbl: t('trust_ship_ws'), val: L(tr.shippingAr, tr.shippingEn) },
        { ic: txIc('clock'), lbl: t('trust_lead'), val: L(tr.leadTimeAr, tr.leadTimeEn) },
        { ic: txIc('bank'), lbl: t('trust_pay'), val: L(tr.paymentAr, tr.paymentEn) },
        { ic: txIc('box'), lbl: t('trust_carton'), val: L(tr.cartonAr, tr.cartonEn) },
        { ic: txIc('hash'), lbl: t('trust_moq'), val: t('trust_moq_val', { n: wsMOQ() }) },
        { ic: txIc('shield'), lbl: t('trust_warranty'), val: L(tr.warrantyAr, tr.warrantyEn) },
      ];
      return `
      <h2 style="margin: 8px 0 14px;">${t('trust_title')}</h2>
      <div class="trust-grid">
        ${cells.map((c) => `
          <div class="trust-card">
            <span class="ic">${c.ic}</span>
            <div class="lbl">${esc(c.lbl)}</div>
            <div class="val">${esc(c.val)}</div>
          </div>`).join('')}
      </div>`;
    }

    /* ---------- الهيرو ---------- */
    function heroHtml() {
      const u = user();
      const EN = LANG === 'en';
      return `
      <section class="trade-hero tx-hero">
        <div class="tx-copy">
          <span class="kicker">${t('trade_hero_kicker')}</span>
          <h1>${t('trade_hero_title')}</h1>
          <p class="sub">${t('trade_hero_sub')}</p>
          <div class="tx-finder">
            <div class="hx-tabs" role="tablist">
              <button type="button" class="on" data-tx="part">${EN ? 'Part / OEM' : 'قطعة / OEM'}</button>
              <button type="button" data-tx="list">${EN ? 'Paste a list' : 'الصق قائمة'}</button>
              <button type="button" data-tx="wa">${EN ? 'Price list' : 'قائمة الأسعار'}</button>
            </div>
            <form class="hx-pane on" data-txp="part" action="/shop.html" method="get">
              <input type="search" name="q" placeholder="${EN ? 'e.g. N20 turbo or 11657636757' : 'مثال: تيربو N20 أو 11657636757'}">
              <button class="btn" type="submit">${t('search_btn')}</button>
            </form>
            <div class="hx-pane" data-txp="list">
              <a class="btn" href="#order-pad" style="flex:1;">${EN ? 'Open Quick Order Pad →' : 'افتح الطلب السريع بالـ SKU ←'}</a>
            </div>
            <div class="hx-pane" data-txp="wa">
              <a class="btn btn-green" data-wa-pricelist target="_blank" rel="noopener" style="flex:1;" href="${waLink(t('trade_wa_pricelist_msg'))}">${t('trade_wa_pricelist')}</a>
            </div>
          </div>
          <div class="hero-cta">
            <a class="btn btn-outline" href="/shop.html">${t('trade_cta_browse')} →</a>
            <a class="btn btn-ghost" href="#rfq">${t('trade_cta_quote')}</a>
          </div>
          ${u ? `<div class="signed">✓ ${t('trade_signedin')}: ${esc(u.name)}${u.company ? ' — ' + esc(u.company) : ''}</div>` : ''}
        </div>
        <div class="tx-art" aria-hidden="true">
          <svg viewBox="0 0 420 300">
            <defs><linearGradient id="txG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2b53c"/><stop offset="1" stop-color="#b98413"/></linearGradient></defs>
            <path d="M20 250h380" stroke="#2a3140" stroke-width="2"/>
            <g transform="translate(40 150)"><rect width="340" height="100" rx="6" fill="url(#txG)"/>
              ${[...Array(16)].map((_, i) => `<rect x="${12 + i * 20}" y="12" width="10" height="76" rx="3" fill="#0c0e12" opacity=".18"/>`).join('')}
              <rect x="10" y="-8" width="320" height="10" rx="3" fill="#d99e1e"/></g>
            <g transform="translate(90 60)"><rect width="240" height="88" rx="6" fill="#1d222b" stroke="#f2b53c" stroke-width="2"/>
              ${[...Array(11)].map((_, i) => `<rect x="${12 + i * 20}" y="12" width="10" height="64" rx="3" fill="#f2b53c" opacity=".14"/>`).join('')}
              <text x="120" y="52" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="16" font-weight="800" fill="#f2b53c">FIXIT · TRADE</text></g>
            <path d="M210 20v38" stroke="#98a2b6" stroke-width="2" stroke-dasharray="4 4"/>
          </svg>
          <div class="tx-chip tx-c1"><b>40HC</b><span>${EN ? 'Full container' : 'حاوية كاملة'}</span></div>
          <div class="tx-chip tx-c2"><b>LCL</b><span>${EN ? 'Shared freight' : 'شحن مجمّع'}</span></div>
        </div>
      </section>`;
    }

    /* ---------- Quick Order Pad ---------- */
    function orderPadHtml() {
      if (wsLocked()) {
        return `
        <section class="trade-panel" id="order-pad">
          <h2>${t('op_title')}</h2>
          <div class="panel-sub">${t('op_login_first')}</div>
          <a class="btn" href="/account.html?mode=register">${t('ws_login_cta')}</a>
          <a class="btn btn-green" data-wa-pricelist target="_blank" rel="noopener" href="${waLink(t('trade_wa_pricelist_msg'))}">💬 ${t('trade_wa_pricelist')}</a>
        </section>`;
      }
      return `
      <section class="trade-panel" id="order-pad">
        <h2>${t('op_title')}</h2>
        <div class="panel-sub">${t('op_sub')}</div>
        <textarea id="op-input" class="op-textarea" placeholder="${esc(t('op_ph'))}"></textarea>
        <div style="margin-top: 12px;"><button class="btn" id="op-go">${t('op_resolve')}</button></div>
        <div id="op-result" class="op-result"></div>
      </section>`;
    }

    /* ---------- RFQ ---------- */
    function rfqHtml() {
      const u = user();
      return `
      <section class="trade-panel" id="rfq">
        <h2>${t('rfq_title')}</h2>
        <div class="panel-sub">${t('rfq_sub')}</div>
        <div class="trade-grid">
          <div class="form-stack">
            <div><label>${t('rfq_company')}</label><input id="rfq-company" value="${u && u.company ? esc(u.company) : ''}"></div>
            <div><label>${t('rfq_name')}</label><input id="rfq-name" value="${u ? esc(u.name) : ''}"></div>
            <div><label>${t('rfq_country')}</label><input id="rfq-country" value="${u && u.country ? esc(u.country) : ''}" placeholder="${LANG === 'en' ? 'UAE, Egypt, Russia...' : 'الإمارات، مصر، روسيا...'}"></div>
          </div>
          <div class="form-stack">
            <div><label>${t('phone').replace(' *', '')}</label><input id="rfq-phone" type="tel" dir="ltr" style="text-align:start;" placeholder="9715xxxxxxxx" value="${u ? esc(u.phone) : ''}"></div>
            <div><label>${t('email_label')}</label><input id="rfq-email" type="email" dir="ltr" value="${u && u.email ? esc(u.email) : ''}"></div>
          </div>
        </div>
        <div style="margin-top: 12px;"><label>${t('rfq_items')}</label>
          <textarea id="rfq-items" rows="4" placeholder="${esc(t('rfq_items_ph'))}"></textarea></div>
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; align-items:center;">
          <button class="btn" id="rfq-send">${t('rfq_send')}</button>
          <button class="btn btn-outline" id="rfq-wa">💬 ${t('rfq_also_wa')}</button>
        </div>
        <div id="rfq-msg" style="margin-top:12px; font-size:14px;"></div>
      </section>`;
    }

    function catalogTeaserHtml() {
      if (!CATALOG.length) return '';
      const best = [...CATALOG].sort((a, b) => (b.sold || 0) - (a.sold || 0)).slice(0, 8);
      return `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin: 8px 0 14px;">
        <h2 style="margin:0;">${t('nav_catalog')}</h2>
        <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
          ${wsLocked() ? '' : `<a href="#" id="dl-pl" style="color:var(--accent); font-weight:700;">${t('dl_pricelist')}</a>`}
          <a href="/shop.html" style="color:var(--accent); font-weight:700;">${t('ws_view_catalog')} →</a>
        </div>
      </div>
      <div class="products-grid">${best.map(productCard).join('')}</div>`;
    }

    // ⬇️ تحميل قائمة الأسعار (CSV يفتح في Excel) — للتجار المسجّلين فقط
    function downloadPriceList() {
      const cols = ['SKU', 'الصنف', 'Item (EN)', 'Brand', 'Models', 'Condition', 'Wholesale AED', 'Wholesale USD', 'CBM', 'Weight kg', 'Stock'];
      const esc2 = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
      const cbmOf = (p) => (p.lengthCm && p.widthCm && p.heightCm) ? (p.lengthCm * p.widthCm * p.heightCm / 1e6).toFixed(4) : (p.cbm || '');
      const rows = CATALOG.filter((p) => Number(p.stock) > 0).map((p) => {
        const aed = wsBaseAED(p);
        return [
          p.sku || '', p.name || '', p.nameEn || '', p.brand || '', (p.models || []).join(' / '),
          p.condition === 'new' ? 'New' : 'Used',
          aed > 0 ? aed : 'On request', aed > 0 ? (aed / usdRate()).toFixed(2) : 'On request',
          cbmOf(p), p.weightKg || '', p.stock || 0,
        ].map(esc2).join(',');
      });
      const csv = '﻿' + [cols.map(esc2).join(','), ...rows].join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'FixIt-Trade-PriceList-' + new Date().toISOString().slice(0, 10) + '.csv';
      a.click();
      URL.revokeObjectURL(a.href);
      trackEvent('pricelist_dl');
    }

    /* ---------- 🧩 Share a Container ---------- */
    function shareHtml() {
      const open = SHIPMENTS.filter((s) => ['open', 'filling', 'full'].includes(s.status));
      const body = !open.length
        ? `<div class="panel-sub">${t('share_none')}</div>`
        : `<div class="ship-list">${open.map(shipCard).join('')}</div>`;
      return `
      <section class="trade-panel" id="share">
        <h2>${t('share_title')}</h2>
        <div class="panel-sub">${t('share_sub')}</div>
        ${body}
      </section>`;
    }
    function shipCard(s) {
      const pct = Math.min(100, Math.round(s.bookedCbm / s.capacityCbm * 100));
      const remaining = Math.round((s.capacityCbm - s.bookedCbm) * 100) / 100;
      const full = s.status === 'full' || remaining <= 0;
      const perCbm = s.baseFreightUsd / s.capacityCbm;
      return `
      <div class="ship-card ${full ? 'full' : ''}">
        <div class="sc-top">
          <div>
            <div class="sc-route">🚢 ${esc(s.port || s.laneCode)} · ${esc(s.containerName || s.containerCode)}</div>
            <div class="sc-meta">${esc(s.ref)} ${s.etd ? '· ' + t('share_etd') + ' ' + esc(s.etd) : ''} ${s.cutoffDate ? '· ' + t('share_closes') + ' ' + esc(s.cutoffDate) : ''}</div>
          </div>
          <div class="sc-meta" style="text-align:end;">$ ${new Intl.NumberFormat('en-US').format(Math.round(perCbm))}/${t('cbm_unit')}</div>
        </div>
        <div class="share-track">
          <div class="used" style="width:${pct}%;">${pct >= 12 ? pct + '%' : ''}</div>
        </div>
        <div class="share-scale">
          <span>${s.bookedCbm} / ${s.capacityCbm} ${t('cbm_unit')} · ${t('share_fill')} ${pct}%</span>
          <span>${full ? t('share_full') : remaining + ' ' + t('cbm_unit') + ' ' + t('share_left')}</span>
        </div>
        ${full ? '' : (wsLocked()
          ? `<div class="share-actions"><a class="btn btn-sm" href="/account.html">${t('share_login')}</a></div>`
          : `<div class="share-actions">
              <input type="number" min="0.5" max="${remaining}" step="0.5" placeholder="${t('cbm_unit')}" data-cbm="${esc(s.id)}">
              <span class="sc-meta" data-cost="${esc(s.id)}"></span>
              <button class="btn btn-sm" data-book="${esc(s.id)}">${t('share_book')}</button>
            </div>
            <div class="sc-meta" data-msg="${esc(s.id)}" style="margin-top:6px;"></div>`)}
      </div>`;
    }
    function wireShare() {
      document.querySelectorAll('[data-cbm]').forEach((inp) => {
        const id = inp.dataset.cbm;
        const s = SHIPMENTS.find((x) => x.id === id);
        const costEl = document.querySelector(`[data-cost="${id}"]`);
        inp.addEventListener('input', () => {
          const cbm = Number(inp.value) || 0;
          const share = s.baseFreightUsd * (cbm / s.capacityCbm);
          costEl.textContent = cbm > 0 ? `${t('share_your_cost')}: $ ${new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(share)}` : '';
        });
      });
      document.querySelectorAll('[data-book]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.book;
          const u = user();
          const cbm = Number(document.querySelector(`[data-cbm="${id}"]`).value) || 0;
          const msg = document.querySelector(`[data-msg="${id}"]`);
          if (cbm <= 0) { msg.style.color = 'var(--red)'; msg.textContent = t('cbm_unit'); return; }
          btn.disabled = true; btn.textContent = t('sending');
          try {
            const r = await api('/containers', { method: 'POST', headers: userHeaders(), body: JSON.stringify({
              action: 'book', shipmentId: id, cbm,
            }) });
            trackEvent('container_book');
            const idx = SHIPMENTS.findIndex((x) => x.id === id);
            if (idx >= 0) SHIPMENTS[idx] = { ...SHIPMENTS[idx], ...r.shipment };
            toast(t('share_booked'));
            render();
          } catch (e) {
            msg.style.color = 'var(--red)'; msg.textContent = e.message;
            btn.disabled = false; btn.textContent = t('share_book');
          }
        });
      });
    }

    function render() {
      root.innerHTML = heroHtml() + statsBar() + newArrivalsHtml() + trustGrid() + processSteps() +
        orderPadHtml() + shareHtml() + rfqHtml() + alertBoxHtml() + faqSection() +
        `<div id="catalog-teaser"></div>`;
      root.querySelectorAll('[data-tx]').forEach((b) => b.addEventListener('click', () => {
        root.querySelectorAll('[data-tx]').forEach((x) => x.classList.toggle('on', x === b));
        root.querySelectorAll('[data-txp]').forEach((p) => p.classList.toggle('on', p.dataset.txp === b.dataset.tx));
      }));
      root.querySelectorAll('[data-wa-pricelist]').forEach((a) => a.addEventListener('click', () => trackEvent('wa_click', { via: 'trade_pricelist' })));
      wireOrderPad();
      wireShare();
      wireRfq();
      wireAlerts();
      const teaser = document.getElementById('catalog-teaser');
      teaser.innerHTML = catalogTeaserHtml();
      // نظهر كل الكروت فوراً (مش بالسكرول) عشان مايبقاش فيه فراغ
      root.querySelectorAll('.card').forEach((c) => c.classList.add('shown'));
      document.getElementById('dl-pl')?.addEventListener('click', (e) => { e.preventDefault(); downloadPriceList(); });
      if (location.hash) {
        const el = document.querySelector(location.hash);
        if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth' }), 200);
      }
    }

    /* ---------- منطق الطلب السريع ---------- */
    function parseOrderLines(text) {
      return text.split('\n').map((raw) => raw.trim()).filter(Boolean).map((line) => {
        const m = line.split(/[,;\t ]+/).filter(Boolean);
        const qty = Number(m[m.length - 1]);
        if (m.length >= 2 && Number.isFinite(qty) && qty > 0) {
          return { sku: m.slice(0, -1).join(' '), qty: Math.round(qty) };
        }
        return { sku: line, qty: 1 };
      });
    }
    function findBySku(sku) {
      const s = sku.toLowerCase();
      return CATALOG.find((p) => (p.sku || '').toLowerCase() === s) ||
             CATALOG.find((p) => (p.oem || '').toLowerCase() === s) ||
             CATALOG.find((p) => (p.sku || '').toLowerCase().includes(s) && s.length >= 4);
    }
    function wireOrderPad() {
      const go = document.getElementById('op-go');
      if (!go) return;
      go.addEventListener('click', () => {
        const box = document.getElementById('op-result');
        const lines = parseOrderLines(document.getElementById('op-input').value);
        if (!lines.length) { box.innerHTML = `<div class="op-line bad">${t('op_empty')}</div>`; return; }
        const matched = [], missing = [];
        lines.forEach((l) => {
          const p = findBySku(l.sku);
          if (p) { const want = Math.max(wsMOQ(), l.qty); matched.push({ p, qty: Math.min(want, Number(p.stock) || 0), want }); } else missing.push(l);
        });
        box.innerHTML = `
          ${matched.length ? `<h4 style="margin:6px 0;">${t('op_matched')} (${matched.length})</h4>` : ''}
          ${matched.map((m) => {
            const unit = tierUnit(m.p, m.qty);
            return `<div class="op-line">
              <span><span class="op-sku">${esc(m.p.sku)}</span> — ${esc(pname(m.p))}</span>
              <span>${unit === null ? t('price_request') : money(unit)} × ${m.qty}${m.qty < m.want ? ` <small style="color:var(--amber);">(${LANG === 'en' ? `only ${m.qty} in stock of ${m.want}` : `المتاح ${m.qty} بس من ${m.want}`})</small>` : ''}</span>
            </div>`;
          }).join('')}
          ${missing.map((l) => `<div class="op-line bad"><span class="op-sku">${esc(l.sku)}</span><span>${t('op_notfound')}</span></div>`).join('')}
          ${matched.length ? `<div style="margin-top:14px;"><button class="btn" id="op-add">${t('op_addall')}</button></div>` : ''}`;
        const add = document.getElementById('op-add');
        if (add) add.addEventListener('click', () => {
          matched.filter((m) => m.qty > 0).forEach((m) => addToCart(m.p.id, m.qty));
          toast(t('op_added'));
        });
      });
    }

    /* ---------- منطق الـ RFQ ---------- */
    function rfqPayload() {
      return {
        wholesale: true,
        company: document.getElementById('rfq-company').value.trim(),
        name: document.getElementById('rfq-name').value.trim(),
        country: document.getElementById('rfq-country').value.trim(),
        phone: document.getElementById('rfq-phone').value.trim(),
        email: document.getElementById('rfq-email').value.trim(),
        partName: document.getElementById('rfq-items').value.trim(),
        notes: '',
      };
    }
    function wireRfq() {
      const send = document.getElementById('rfq-send');
      const msg = document.getElementById('rfq-msg');
      send.addEventListener('click', async () => {
        const body = rfqPayload();
        if (!body.name || !body.phone || !body.partName) {
          msg.style.color = 'var(--red)';
          msg.textContent = t('fill_required');
          return;
        }
        send.disabled = true; send.textContent = t('sending');
        try {
          const r = await api('/requests', { method: 'POST', body: JSON.stringify(body) });
          trackEvent('rfq');
          msg.style.color = '#4ade80';
          msg.textContent = t('rfq_sent', { n: r.number });
          ['rfq-items'].forEach((id) => document.getElementById(id).value = '');
        } catch (e) {
          msg.style.color = 'var(--red)';
          msg.textContent = e.message;
        } finally {
          send.disabled = false; send.textContent = t('rfq_send');
        }
      });
      document.getElementById('rfq-wa').addEventListener('click', () => {
        const b = rfqPayload();
        const txt = [`${t('rfq_title')} 🌐`,
          b.company && `${t('rfq_company')}: ${b.company}`,
          b.name && `${t('rfq_name')}: ${b.name}`,
          b.country && `${t('rfq_country')}: ${b.country}`,
          b.phone && `${t('phone')}: ${b.phone}`,
          '', b.partName].filter(Boolean).join('\n');
        window.open(waLink(txt), '_blank');
      });
    }

    // نجيب الكتالوج والحاويات المفتوحة
    Promise.all([
      api('/products').then((l) => { CATALOG = wsCatalogFilter(l); }).catch(() => {}),
      api('/containers').then((l) => { SHIPMENTS = l; }).catch(() => {}),
    ]).then(render);
  </script>
</body>
</html>
