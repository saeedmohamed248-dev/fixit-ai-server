<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حسابي | بافاريا بارتس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container" id="account-container" style="max-width: 720px;">
      <div class="spinner">جاري التحميل...</div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script>
    renderLayout('account');
    const container = document.getElementById('account-container');
    const STATUS_AR = { new: 'جديد — في انتظار التأكيد', confirmed: 'مؤكد ✓', shipped: 'في الشحن 🚚', delivered: 'تم التسليم 📦', cancelled: 'ملغي' };

    function showAuth(mode = 'login') {
      container.innerHTML = `
      <div class="login-box" style="max-width: 440px; text-align: right;">
        <h2 style="text-align: center;">👤 ${mode === 'login' ? 'تسجيل الدخول' : 'حساب جديد'}</h2>
        <div class="auth-tabs">
          <button class="${mode === 'login' ? 'active' : ''}" data-mode="login">دخول</button>
          <button class="${mode === 'register' ? 'active' : ''}" data-mode="register">حساب جديد</button>
        </div>
        <div class="form-stack">
          ${mode === 'register' ? '<div><label>الاسم بالكامل</label><input id="a-name"></div>' : ''}
          <div><label>رقم الموبايل</label><input id="a-phone" type="tel" dir="ltr" style="text-align: right;" placeholder="01xxxxxxxxx"></div>
          ${mode === 'register' ? '<div><label>الإيميل (اختياري)</label><input id="a-email" type="email" dir="ltr"></div>' : ''}
          <div><label>كلمة السر</label><input id="a-pass" type="password"></div>
          <button class="btn" id="a-submit">${mode === 'login' ? 'دخول' : 'إنشاء الحساب'}</button>
          <div id="a-error" style="color: var(--red); font-size: 14px;"></div>
        </div>
      </div>`;
      container.querySelectorAll('[data-mode]').forEach((b) =>
        b.addEventListener('click', () => showAuth(b.dataset.mode)));
      document.getElementById('a-submit').addEventListener('click', async () => {
        const err = document.getElementById('a-error');
        err.textContent = '';
        try {
          const body = {
            action: mode,
            phone: document.getElementById('a-phone').value.trim(),
            password: document.getElementById('a-pass').value,
          };
          if (mode === 'register') {
            body.name = document.getElementById('a-name').value.trim();
            body.email = document.getElementById('a-email').value.trim();
          }
          const data = await api('/auth', { method: 'POST', body: JSON.stringify(body) });
          setSession(data.token, data.user);
          toast('أهلاً بيك ' + data.user.name + ' 👋');
          showAccount();
          renderLayout('account');
        } catch (e) { err.textContent = e.message; }
      });
    }

    async function showAccount() {
      const user = currentUser();
      container.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;">
        <h1>أهلاً، ${esc(user.name)} 👋</h1>
        <button class="btn btn-outline btn-sm" id="logout">تسجيل خروج</button>
      </div>
      <div style="color: var(--muted); font-size: 14px; margin-bottom: 24px;">
        📱 <span dir="ltr">${esc(user.phone)}</span> ${user.email ? ' &nbsp;|&nbsp; ✉️ ' + esc(user.email) : ''}
      </div>
      <h2 style="margin-bottom: 14px;">طلباتي</h2>
      <div id="my-orders"><div class="spinner">جاري التحميل...</div></div>`;

      document.getElementById('logout').addEventListener('click', () => {
        clearSession();
        renderLayout('account');
        showAuth();
      });

      const box = document.getElementById('my-orders');
      try {
        const orders = await api('/orders?mine=1', { headers: userHeaders() });
        box.innerHTML = orders.length ? orders.map((o) => `
          <div class="order-card">
            <div class="head">
              <b>${esc(o.number)}</b>
              <span class="status-pill st-${esc(o.status)}">${STATUS_AR[o.status] || o.status}</span>
            </div>
            <div style="color: var(--muted); font-size: 13px;">${new Date(o.createdAt).toLocaleDateString('ar-EG', { dateStyle: 'long' })}</div>
            <div style="font-size: 14px; margin: 8px 0;">${o.items.map((i) => `${esc(i.name)} ×${i.qty}`).join(' • ')}</div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <b>${money(o.total)}</b>
              <a href="/track.html?number=${esc(o.number)}&phone=${esc(o.customer.phone)}" style="color: var(--blue2); font-size: 14px;">تتبع الطلب ←</a>
            </div>
          </div>`).join('')
          : '<div class="empty-state"><span class="icon">📭</span>لسه معملتش أي طلب<br><br><a class="btn" href="/shop.html">ابدأ التسوق</a></div>';
      } catch (e) {
        if (e.message.includes('دخول')) { clearSession(); return showAuth(); }
        box.innerHTML = `<div class="note">${esc(e.message)}</div>`;
      }
    }

    if (currentUser() && userToken()) showAccount();
    else showAuth();
  </script>
</body>
</html>
