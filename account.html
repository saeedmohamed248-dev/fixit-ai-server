<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حسابي | FixIt</title>
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#101828">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container" id="account-container" style="max-width: 720px;">
      <div class="spinner" data-i18n="loading"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script>
    renderLayout('account');
    document.title = t('title_account');
    const container = document.getElementById('account-container');

    // الزائر الجديد للجملة يفتح على "تسجيل" على طول (مش "دخول")
    const defaultMode = () => (new URLSearchParams(location.search).get('mode') === 'register' ? 'register' : 'login');
    function showAuth(mode = defaultMode()) {
      container.innerHTML = `
      <div class="login-box" style="max-width: 440px; text-align: start;">
        <h2 style="text-align: center;">👤 ${mode === 'login' ? t('login_title') : t('register_title')}</h2>
        <div class="auth-tabs">
          <button class="${mode === 'login' ? 'active' : ''}" data-mode="login">${t('tab_login')}</button>
          <button class="${mode === 'register' ? 'active' : ''}" data-mode="register">${t('tab_register')}</button>
        </div>
        ${isWholesale() ? `<div class="note" style="text-align:start;">🇦🇪 <b>${t('ws_account_title')}</b><br><small>${t('ws_account_sub')}</small></div>` : ''}
        <div class="form-stack">
          ${mode === 'register' && !isWholesale() ? `<div><label>${t('name_label')}</label><input id="a-name"></div>` : ''}
          <div><label>${t('phone').replace(' *', '')}</label><input id="a-phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" style="text-align: start;" placeholder="${isWholesale() ? '2010xxxxxxxx' : '01xxxxxxxxx'}">
            ${isWholesale() ? `<small class="muted" style="display:block;margin-top:4px;">${t('ws_phone_hint')}</small>` : ''}</div>
          ${mode === 'register' && !isWholesale() ? `<div><label>${t('email_label')}</label><input id="a-email" type="email" dir="ltr"></div>` : ''}
          <div><label>${t('password')}</label><input id="a-pass" type="password"></div>
          ${mode === 'register' && isWholesale() ? `<div><label>${t('ws_kind')}</label><select id="a-kind">
            <option value="trader">${t('ws_kind_trader')}</option>
            <option value="workshop">${t('ws_kind_workshop')}</option>
            <option value="personal">${t('ws_kind_personal')}</option></select></div>` : ''}
          <button class="btn" id="a-submit">${mode === 'login' ? t('btn_login') : t('btn_register')}</button>
          <div id="a-error" style="color: var(--red); font-size: 14px;"></div>
        </div>
      </div>`;
      container.querySelectorAll('[data-mode]').forEach((b) =>
        b.addEventListener('click', () => showAuth(b.dataset.mode)));
      container.querySelectorAll('input').forEach((i) => i.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('a-submit').click(); }));
      document.getElementById('a-submit').addEventListener('click', async () => {
        const err = document.getElementById('a-error');
        err.textContent = '';
        try {
          const body = {
            action: mode,
            phone: document.getElementById('a-phone').value.trim(),
            password: document.getElementById('a-pass').value,
          };
          if (mode === 'register') {
            if (isWholesale()) {
              body.account = 'wholesale';
              body.kind = document.getElementById('a-kind')?.value || 'trader';
            } else {
              body.name = document.getElementById('a-name').value.trim();
              body.email = document.getElementById('a-email').value.trim();
            }
          }
          const data = await api('/auth', { method: 'POST', body: JSON.stringify(body) });
          setSession(data.token, data.user);
          toast((LANG === 'en' ? 'Welcome ' : 'أهلاً بيك ') + data.user.name + ' 👋');
          const back = new URLSearchParams(location.search).get('next');
          if (back && /^\/[^/]/.test(back)) { location.href = back; return; }
          showAccount();
          renderLayout('account');
        } catch (e) { err.textContent = e.message; }
      });
    }

    async function showAccount() {
      const user = currentUser();
      // لوحة التاجر حسب نوع الحساب نفسه — مش حسب وضع الموقع (عميل قطاعي فتح مكتب التجارة كان بيشوف لوحة تاجر فاضية ومش بيلاقي طلباته)
      const isTrader = user.account === 'wholesale';
      container.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;">
        <h1>${t('welcome')} ${esc(user.name)} 👋</h1>
        <button class="btn btn-outline btn-sm" id="logout">${t('logout')}</button>
      </div>
      <div style="color: var(--muted); font-size: 14px; margin-bottom: 12px;">
        📱 <span dir="ltr">${esc(user.phone)}</span> ${user.email ? ' &nbsp;|&nbsp; ✉️ ' + esc(user.email) : ''}
        ${user.account === 'wholesale' ? ` &nbsp;|&nbsp; <span class="badge badge-brand">🇦🇪 ${t('ws_account_title')}</span>` : ''}
        ${user.company ? '<br>🏢 ' + esc(user.company) : ''}${user.country ? ' &nbsp;|&nbsp; 🌍 ' + esc(user.country) : ''}
      </div>
      <details class="order-card" id="profile-box" style="margin-bottom:16px;">
        <summary style="cursor:pointer;font-weight:700;">✏️ ${LANG === 'en' ? 'Edit profile / change password' : 'تعديل بياناتي / تغيير كلمة السر'}</summary>
        <div class="form-stack" style="margin-top:12px;max-width:440px;">
          <div><label>${t('name_label')}</label><input id="p-name" value="${esc(user.name)}"></div>
          <div><label>${t('email_label')}</label><input id="p-email" type="email" dir="ltr" value="${esc(user.email || '')}"></div>
          ${isTrader ? `<div><label>${t('trader_company')}</label><input id="p-company" value="${esc(user.company || '')}"></div>
          <div><label>${t('trader_country')}</label><input id="p-country" value="${esc(user.country || '')}"></div>` : ''}
          <div><label>${LANG === 'en' ? 'Current password (only to change it)' : 'كلمة السر الحالية (لو هتغيّرها بس)'}</label><input id="p-cur" type="password" autocomplete="current-password"></div>
          <div><label>${LANG === 'en' ? 'New password' : 'كلمة السر الجديدة'}</label><input id="p-new" type="password" autocomplete="new-password"></div>
          <button class="btn btn-sm" id="p-save">💾 ${LANG === 'en' ? 'Save' : 'حفظ'}</button>
          <div id="p-msg" style="font-size:14px;"></div>
        </div>
      </details>
      ${isTrader ? `
      <div class="trader-actions">
        <a class="btn btn-sm" href="/shop.html">🛍️ ${t('nav_catalog')}</a>
        <a class="btn btn-sm btn-outline" href="/trade.html#rfq">📝 ${t('nav_rfq')}</a>
        <a class="btn btn-sm btn-outline" href="/trade.html#share">🧩 ${t('share_title')}</a>
        <a class="btn btn-sm btn-outline" href="/trade-terms.html">📜 ${t('nav_terms')}</a>
      </div>
      <h2 style="margin: 22px 0 12px;">📝 ${t('td_my_rfqs')}</h2>
      <div id="my-rfqs"><div class="spinner">${t('loading')}</div></div>
      <h2 style="margin: 24px 0 12px;">🧩 ${t('td_my_bookings')}</h2>
      <div id="my-bookings"><div class="spinner">${t('loading')}</div></div>
      <h2 style="margin: 24px 0 12px;">${t('my_orders')}</h2>
      <div id="my-orders"><div class="spinner">${t('loading')}</div></div>
      ` : `
      <div class="note" id="points-box" style="display: none;"></div>
      <div class="note" id="credit-box" style="display: none; background: #ecfdf3; border-color: #a6f4c5; color: #067647;"></div>

      <h2 style="margin: 6px 0 14px;">${t('maint_title')}</h2>
      <div id="my-maint"><div class="spinner">${t('loading')}</div></div>

      <h2 style="margin: 22px 0 14px;">${t('my_orders')} / ${t('my_invoices')}</h2>
      <div id="my-orders"><div class="spinner">${t('loading')}</div></div>`}`;

      document.getElementById('logout').addEventListener('click', () => {
        clearSession();
        renderLayout('account');
        showAuth();
      });

      // ✏️ حفظ البيانات / كلمة السر
      document.getElementById('p-save').addEventListener('click', async () => {
        const msg = document.getElementById('p-msg');
        const body = { name: document.getElementById('p-name').value, email: document.getElementById('p-email').value };
        if (isTrader) { body.company = document.getElementById('p-company').value; body.country = document.getElementById('p-country').value; }
        const np = document.getElementById('p-new').value;
        if (np) { body.newPassword = np; body.currentPassword = document.getElementById('p-cur').value; }
        try {
          const u = await api('/auth', { method: 'PUT', headers: userHeaders(), body: JSON.stringify(body) });
          setSession(userToken(), u);
          toast(LANG === 'en' ? 'Saved ✓' : 'اتحفظ ✓');
          showAccount(); renderLayout('account');
        } catch (e) { msg.style.color = 'var(--red)'; msg.textContent = e.message; }
      });

      // 🇦🇪 لوحة التاجر: عروض الأسعار والحجوزات (+ طلباته تحت)
      if (isTrader) { loadMyRfqs(); loadMyBookings(); }

      // ⭐ رصيد النقاط و💳 رصيد الاستبدال
      if (!isTrader) api('/auth', { headers: userHeaders() }).then((me) => {
        setSession(userToken(), me); // نحدّث الاسم/النقاط المحفوظة محلياً
        const pb = document.getElementById('points-box');
        if (pb && me.points > 0) {
          pb.style.display = '';
          pb.innerHTML = `${t('points_balance', { n: me.points, v: moneyEGP(me.points) })}<br><small>${t('points_hint')}</small>`;
        }
        const cb = document.getElementById('credit-box');
        if (cb && me.credit > 0) {
          cb.style.display = '';
          cb.innerHTML = `${t('credit_balance', { v: moneyEGP(me.credit) })}<br><small>${t('credit_hint')}</small>`;
        }
      }).catch(() => {});

      // 🔧 مواعيد الصيانة
      const maintBox = document.getElementById('my-maint');
      if (maintBox) api('/maintenance?mine=1', { headers: userHeaders() }).then((list) => {
        const upcoming = list.filter((m) => !m.done);
        if (!upcoming.length) { maintBox.innerHTML = `<p style="color: var(--muted);">${t('maint_none')}</p>`; return; }
        const today = new Date().toISOString().slice(0, 10);
        maintBox.innerHTML = upcoming.map((m) => {
          const over = m.dueDate < today;
          const soon = !over && m.dueDate < new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10);
          const badge = over ? `<span class="status-pill st-cancelled">${t('maint_over')}</span>` : soon ? `<span class="status-pill st-shipped">${t('maint_soon')}</span>` : '';
          return `<div class="order-card">
            <div class="head"><b>${esc(m.title)}</b>${badge}</div>
            <div style="color: var(--muted); font-size: 13px;">${t('maint_due')} ${new Date(m.dueDate).toLocaleDateString(LANG === 'en' ? 'en-GB' : 'ar-EG', { dateStyle: 'long' })}</div>
            ${m.note ? `<div style="font-size: 13px; margin-top: 4px;">${esc(m.note)}</div>` : ''}
            <a href="${waLink((LANG === 'en' ? 'Book service: ' : 'حجز صيانة: ') + m.title)}" target="_blank" rel="noopener" style="color: var(--accent-dark); font-size: 14px;">${t('maint_book')} 💬</a>
          </div>`;
        }).join('');
      }).catch(() => { maintBox.innerHTML = ''; });

      const box = document.getElementById('my-orders');
      try {
        const orders = await api('/orders?mine=1', { headers: userHeaders() });
        box.innerHTML = orders.length ? orders.map((o) => `
          <div class="order-card">
            <div class="head">
              <b>${esc(o.number)}</b>
              <span class="status-pill st-${esc(o.status)}">${t('st_' + o.status)}</span>
            </div>
            <div style="color: var(--muted); font-size: 13px;">${new Date(o.createdAt).toLocaleDateString(LANG === 'en' ? 'en-GB' : 'ar-EG', { dateStyle: 'long' })}</div>
            <div style="font-size: 14px; margin: 8px 0;">${o.items.map((i) => `${esc(i.name)} ×${i.qty}`).join(' • ')}</div>
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
              <b>${moneyEGP(o.total)}</b>
              <span>
                ${o.returnRequest ? `<span class="status-pill st-cancelled">${t('return_requested')}</span>` : (o.status === 'delivered' || o.status === 'shipped') ? `<button class="btn btn-outline btn-sm" data-return="${esc(o.number)}" data-phone="${esc(o.customer.phone)}">${t('return_btn')}</button>` : ''}
                <button class="btn btn-sm" data-reorder="${esc(o.id)}">🔁 ${LANG === 'en' ? 'Order again' : 'اطلب تاني'}</button>
                <a href="/track.html?number=${encodeURIComponent(o.number)}&phone=${encodeURIComponent(o.customer.phone)}" style="color: var(--accent-dark); font-size: 14px;">${t('track_link')}</a>
              </span>
            </div>
          </div>`).join('')
          : `<div class="empty-state"><span class="icon">📭</span>${t('no_orders')}<br><br><a class="btn" href="/shop.html">${t('start_shopping')}</a></div>`;
        // 🔁 اطلب تاني — نضيف القطع المتاحة حالياً للسلة
        box.querySelectorAll('[data-reorder]').forEach((btn) => btn.addEventListener('click', async () => {
          const o = orders.find((x) => x.id === btn.dataset.reorder);
          btn.disabled = true;
          try {
            const prods = await api('/products');
            let added = 0, missing = 0;
            o.items.forEach((i) => {
              const p = prods.find((x) => x.id === i.id);
              if (p && p.stock > 0) { addToCart(p.id, Math.min(i.qty, p.stock)); added++; } else missing++;
            });
            if (added) location.href = '/cart.html';
            else toast(LANG === 'en' ? 'These parts are out of stock now' : 'القطع دي مش متوفرة دلوقتي');
            if (missing && added) toast(LANG === 'en' ? `${missing} item(s) are out of stock` : `${missing} قطعة مش متوفرة دلوقتي`);
          } catch (e) { toast('⚠️ ' + e.message); }
          btn.disabled = false;
        }));
        // ↩️ طلب إرجاع
        box.querySelectorAll('[data-return]').forEach((btn) =>
          btn.addEventListener('click', async () => {
            const reason = prompt(t('return_reason'));
            if (reason === null) return;
            try {
              await api('/orders', {
                method: 'POST',
                body: JSON.stringify({ action: 'return_request', number: btn.dataset.return, phone: btn.dataset.phone, reason }),
              });
              toast(t('return_sent'));
              showAccount();
            } catch (ex) { toast('⚠️ ' + ex.message); }
          }));
      } catch (e) {
        // نطلّع العميل بس لو الجلسة فعلاً انتهت — مش مع أي خطأ شبكة
        if (e.status === 401) { clearSession(); renderLayout('account'); return showAuth(); }
        box.innerHTML = `<div class="note">⚠️ ${esc(e.message)} <button class="btn btn-sm" onclick="showAccount()">${LANG === 'en' ? 'Retry' : 'حاول تاني'}</button></div>`;
      }
    }

    /* ---------- 🇦🇪 لوحة التاجر: عروض الأسعار والحجوزات ---------- */
    const RFQ_ST = { open: { t: t('rfq_st_open'), c: 'var(--amber)' }, sourced: { t: t('rfq_st_sourced'), c: 'var(--blue)' }, done: { t: t('rfq_st_done'), c: 'var(--green)' } };
    async function loadMyRfqs() {
      const box = document.getElementById('my-rfqs');
      try {
        const list = await api('/requests?mine=1', { headers: userHeaders() });
        if (!list.length) { box.innerHTML = `<p style="color:var(--muted);">${t('td_no_rfqs')} <a href="/trade.html#rfq" style="color:var(--accent);">${t('nav_rfq')}</a></p>`; return; }
        box.innerHTML = list.map((r) => {
          const st = RFQ_ST[r.status] || RFQ_ST.open;
          return `<div class="td-card">
            <div class="td-top"><b>${esc(r.number)}</b><span class="badge" style="background:${st.c};color:#fff;">${st.t}</span></div>
            <div class="td-body">${esc(r.partName)}</div>
            <div class="td-meta">${new Date(r.createdAt).toLocaleDateString(LANG === 'en' ? 'en-GB' : 'ar-EG')}${r.country ? ' · 🌍 ' + esc(r.country) : ''}</div>
          </div>`;
        }).join('');
      } catch (e) { box.innerHTML = `<p style="color:var(--muted);">${esc(e.message)}</p>`; }
    }
    async function loadMyBookings() {
      const box = document.getElementById('my-bookings');
      try {
        const list = await api('/containers?mine=1', { headers: userHeaders() });
        if (!list.length) { box.innerHTML = `<p style="color:var(--muted);">${t('td_no_bookings')} <a href="/trade.html#share" style="color:var(--accent);">${t('share_title')}</a></p>`; return; }
        box.innerHTML = list.map((bk) => `<div class="td-card">
          <div class="td-top"><b>🚢 ${esc(bk.ref)}</b><span style="color:var(--accent);font-weight:700;">$ ${new Intl.NumberFormat('en-US').format(bk.shareUsd)}</span></div>
          <div class="td-body">${esc(bk.port || '')} · ${esc(bk.containerName || '')} — ${bk.cbm} ${t('cbm_unit')}</div>
          <div class="td-meta">${bk.etd ? t('share_etd') + ': ' + esc(bk.etd) : ''} · ${esc(bk.shipStatus || bk.status || '')}</div>
        </div>`).join('');
      } catch (e) { box.innerHTML = `<p style="color:var(--muted);">${esc(e.message)}</p>`; }
    }

    if (currentUser() && userToken()) showAccount();
    else showAuth();
  </script>
</body>
</html>
