<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixIt | قطع غيار BMW & MINI استيراد جديد ومستعمل</title>
  <meta name="description" content="FixIt — قطع غيار BMW وميني كوبر أصلية، استيراد جديد ومستعمل وارد أوروبا وأمريكا. فحص وضمان وشحن لجميع المحافظات. BMW & MINI parts, new and used import.">
  <meta property="og:title" content="FixIt | BMW & MINI Parts — قطع غيار بي إم دبليو وميني">
  <meta property="og:description" content="قطع غيار BMW وميني كوبر — جديد ومستعمل وارد بضمان. New & used BMW/MINI parts with warranty.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://fixitauto.parts/">
  <meta property="og:site_name" content="FixIt">
  <link rel="canonical" href="https://fixitauto.parts/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#101828">
  <!-- 🇦🇪 تجار الجملة يروحوا مباشرة لمكتب التجارة (شكل B2B) بدل الصفحة القطاعية -->
  <script>try{if(localStorage.getItem('mode')==='wholesale')location.replace('/trade.html');}catch(e){}</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <!-- الهيرو -->
    <section class="hero">
      <div class="container">
        <h1 data-i18n="hero_title"></h1>
        <p data-i18n="hero_sub"></p>
        <form class="search-box" action="/shop.html" method="get">
          <input type="search" name="q" data-i18n-ph="hero_search_ph">
          <button class="btn" type="submit" data-i18n="search_btn"></button>
        </form>
        <div class="brand-chips">
          <a class="chip" href="/shop.html?brand=BMW">BMW</a>
          <a class="chip" href="/shop.html?brand=MINI">MINI Cooper</a>
          <a class="chip" href="/shop.html?condition=new" data-i18n="chip_new"></a>
          <a class="chip" href="/shop.html?condition=used" data-i18n="chip_used"></a>
        </div>
        <div class="hero-stats">
          <span data-i18n="stat1"></span>
          <span data-i18n="stat2"></span>
          <span data-i18n="stat3"></span>
        </div>
      </div>
    </section>

    <!-- شريط الثقة -->
    <div class="trust-strip">
      <div class="container trust-strip-inner">
        <span class="ts-item">🚚 <b data-i18n="trust_ship"></b></span>
        <span class="ts-item">✅ <b data-i18n="trust_genuine"></b></span>
        <span class="ts-item">💵 <b data-i18n="trust_cod"></b></span>
        <span class="ts-item">🔍 <b data-i18n="trust_inspect"></b></span>
        <span class="ts-item">💬 <b data-i18n="trust_support"></b></span>
      </div>
    </div>

    <!-- دوّر بعربيتك -->
    <section class="section">
      <div class="container">
        <div class="sbc-card">
          <div class="sbc-head">
            <span class="sbc-ic">🚗</span>
            <div><h2 data-i18n="sbc_title"></h2><p data-i18n="sbc_sub"></p></div>
          </div>
          <div class="sbc-form">
            <select id="sbc-brand"><option value="BMW">BMW</option><option value="MINI">MINI</option></select>
            <select id="sbc-model"></select>
            <button class="btn" id="sbc-go" data-i18n="sbc_go"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- الفئات -->
    <section class="section" style="padding-top: 0;">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="sec_cats"></h2>
          <a href="/shop.html" data-i18n="view_all"></a>
        </div>
        <div class="cats-grid" id="cats-grid"></div>
      </div>
    </section>

    <!-- عرض اليوم (عدّاد تنازلي) -->
    <section class="section" style="padding-top: 0; display: none;" id="flash-section">
      <div class="container">
        <div class="flash-band" id="flash-band"></div>
      </div>
    </section>

    <!-- عروض وخصومات -->
    <section class="section" style="padding-top: 0; display: none;" id="deals-section">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="sec_deals"></h2>
          <a href="/shop.html" data-i18n="view_all"></a>
        </div>
        <div class="hscroll" id="deals-grid"></div>
      </div>
    </section>

    <!-- وصل حديثاً -->
    <section class="section" style="padding-top: 0; display: none;" id="new-section">
      <div class="container">
        <div class="section-head">
          <h2>🆕 <span data-i18n="na_title"></span></h2>
          <a href="/shop.html?sort=newest" data-i18n="view_all"></a>
        </div>
        <div class="hscroll" id="new-grid"></div>
      </div>
    </section>

    <!-- الأكثر مبيعاً -->
    <section class="section" style="padding-top: 0;">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="sec_best"></h2>
          <a href="/shop.html" data-i18n="view_all"></a>
        </div>
        <div class="products-grid" id="featured-grid"></div>
      </div>
    </section>

    <!-- آراء العملاء -->
    <section class="section" style="padding-top: 0; display: none;" id="reviews-section">
      <div class="container">
        <div class="section-head"><h2>⭐ <span data-i18n="sec_reviews"></span></h2></div>
        <div class="reviews-grid" id="reviews-grid"></div>
      </div>
    </section>

    <!-- شاهدتها مؤخراً -->
    <section class="section" style="padding-top: 0; display: none;" id="recent-section">
      <div class="container">
        <div class="section-head"><h2 data-i18n="sec_recent"></h2></div>
        <div class="hscroll" id="recent-grid"></div>
      </div>
    </section>

    <!-- المميزات -->
    <section class="section" style="padding-top: 0;">
      <div class="container">
        <div class="features-grid">
          <div class="feature"><span class="icon">✅</span><div><h3 data-i18n="feat1_t"></h3><p data-i18n="feat1_d"></p></div></div>
          <div class="feature"><span class="icon">🚢</span><div><h3 data-i18n="feat2_t"></h3><p data-i18n="feat2_d"></p></div></div>
          <div class="feature"><span class="icon">🚚</span><div><h3 data-i18n="feat3_t"></h3><p data-i18n="feat3_d"></p></div></div>
          <div class="feature"><span class="icon">🤖</span><div><h3 data-i18n="feat4_t"></h3><p data-i18n="feat4_d"></p></div></div>
        </div>
      </div>
    </section>

    <!-- CTA -->
    <section class="section" style="padding-top: 0;">
      <div class="container">
        <div class="cta-band">
          <div>
            <h2 data-i18n="cta_title"></h2>
            <p data-i18n="cta_sub"></p>
          </div>
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <a class="btn" href="/request.html" data-i18n="cta_request" style="background: #fff; color: var(--accent-dark);"></a>
            <a class="btn btn-green" id="cta-wa" target="_blank" rel="noopener" data-i18n="cta_btn"></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script>
    renderLayout('home');
    document.title = t('title_home');
    document.getElementById('cta-wa').href = waLink(t('wa_part'));
    document.getElementById('featured-grid').innerHTML = skeletonCards(8);

    // 🚗 دوّر بعربيتك — موديلات حسب الماركة
    const MODELS_BY_BRAND = {
      BMW: ['E46', 'E60', 'E90', 'E92', 'F10', 'F30', 'F32', 'G20', 'G30', 'X1', 'X3', 'X5', 'X6'],
      MINI: ['R56', 'R55', 'R60', 'F54', 'F55', 'F56'],
    };
    function fillModels() {
      const brand = document.getElementById('sbc-brand').value;
      document.getElementById('sbc-model').innerHTML =
        `<option value="">${LANG === 'en' ? 'All models' : 'كل الموديلات'}</option>` +
        (MODELS_BY_BRAND[brand] || []).map((m) => `<option>${m}</option>`).join('');
    }
    document.getElementById('sbc-brand').addEventListener('change', fillModels);
    fillModels();
    // استرجاع آخر اختيار (لمسة شخصية)
    try {
      const g = getGarage();
      if (g && g.model) { for (const [br, ms] of Object.entries(MODELS_BY_BRAND)) if (ms.includes(g.model)) { document.getElementById('sbc-brand').value = br; fillModels(); document.getElementById('sbc-model').value = g.model; } }
    } catch {}
    document.getElementById('sbc-go').addEventListener('click', () => {
      const brand = document.getElementById('sbc-brand').value;
      const model = document.getElementById('sbc-model').value;
      location.href = '/shop.html?brand=' + encodeURIComponent(brand) + (model ? '&model=' + encodeURIComponent(model) : '');
    });

    // ⭐ آراء العملاء
    (function renderReviews() {
      const list = (window.SITE && SITE.reviews) || [];
      if (!list.length) return;
      document.getElementById('reviews-section').style.display = '';
      document.getElementById('reviews-grid').innerHTML = list.map((r) => `
        <div class="review-card">
          <div class="review-stars">${'★'.repeat(Math.max(1, Math.min(5, r.stars || 5)))}</div>
          <p class="review-text">"${esc(r.text)}"</p>
          <div class="review-by"><b>${esc(r.name)}</b>${r.car ? ` · <span>${esc(r.car)}</span>` : ''}</div>
        </div>`).join('');
    })();

    const CATS = ['فرامل', 'فلاتر وصيانة', 'عفشة وتعليق', 'كهرباء وإشعال', 'تبريد', 'وقود', 'هيكل وإكسسوارات'];
    document.getElementById('cats-grid').innerHTML = CATS.map((c) => `
      <a class="cat-card" href="/shop.html?category=${encodeURIComponent(c)}">
        <span class="icon">${categoryIcon(c)}</span>
        <span class="name">${catName(c)}</span>
      </a>`).join('');

    api('/products').then((products) => {
      // الأكثر مبيعاً (أو الأحدث لو لسه مفيش مبيعات)
      const best = [...products].sort((a, b) => (b.sold || 0) - (a.sold || 0)).slice(0, 8);
      document.getElementById('featured-grid').innerHTML =
        best.map(productCard).join('') || `<div class="spinner">${t('no_products')}</div>`;

      // 🆕 وصل حديثاً
      const fresh = newArrivals(products, 10);
      if (fresh.length) {
        document.getElementById('new-section').style.display = '';
        document.getElementById('new-grid').innerHTML = fresh.map(productCard).join('');
      }

      // العروض: اللي عليها خصم
      const deals = products.filter((p) => p.oldPrice > p.price);
      if (deals.length) {
        document.getElementById('deals-section').style.display = '';
        document.getElementById('deals-grid').innerHTML = deals.map(productCard).join('');

        // 🔥 عرض اليوم: أكبر خصم + عدّاد تنازلي لنهاية اليوم (إلحاح يرجّع العميل)
        const top = [...deals].sort((a, b) => (1 - a.price / a.oldPrice) - (1 - b.price / b.oldPrice)).pop();
        const off = Math.round((1 - top.price / top.oldPrice) * 100);
        document.getElementById('flash-section').style.display = '';
        document.getElementById('flash-band').innerHTML = `
          <div class="flash-left">
            <span class="flash-tag">🔥 ${t('deal_today')} · -${off}%</span>
            <h3>${esc(pname(top))}</h3>
            <div class="flash-price"><span class="old-price">${money(top.oldPrice)}</span> <span class="price">${money(top.price)}</span></div>
            <div class="flash-timer">${t('deal_ends')} <span id="flash-clock">--:--:--</span></div>
            <a class="btn" href="/product.html?id=${esc(top.id)}">${t('deal_grab')} →</a>
          </div>
          <div class="flash-img">${productImage(top, 'flash-thumb')}</div>`;
        const endOfDay = new Date(); endOfDay.setHours(23, 59, 59, 999);
        const clock = document.getElementById('flash-clock');
        const tick = () => {
          let s = Math.max(0, Math.floor((endOfDay - Date.now()) / 1000));
          const h = String(Math.floor(s / 3600)).padStart(2, '0');
          const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
          const ss = String(s % 60).padStart(2, '0');
          if (clock) clock.textContent = `${h}:${m}:${ss}`;
        };
        tick(); setInterval(tick, 1000);
      }

      // شاهدتها مؤخراً
      const recentIds = getRecent();
      const recent = recentIds.map((rid) => products.find((p) => p.id === rid)).filter(Boolean);
      if (recent.length) {
        document.getElementById('recent-section').style.display = '';
        document.getElementById('recent-grid').innerHTML = recent.map(productCard).join('');
      }

      // نظهر كل الكروت فوراً عشان الصفحة تبان مليانة (بدل انتظار السكرول)
      document.querySelectorAll('.card, .cat-card').forEach((c) => c.classList.add('shown'));
    }).catch((e) => {
      document.getElementById('featured-grid').innerHTML = `<div class="spinner">${esc(e.message)}</div>`;
    });
  </script>
</body>
</html>
