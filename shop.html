<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المتجر | FixIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#101828">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container">
      <div class="shop-layout">
        <!-- الفلاتر -->
        <aside class="filters">
          <h3 data-i18n="filters"></h3>
          <div>
            <label data-i18n="f_search"></label>
            <input type="search" id="f-q" data-i18n-ph="f_search_ph">
          </div>
          <div>
            <label data-i18n="f_brand"></label>
            <select id="f-brand">
              <option value="" data-i18n="all"></option>
              <option value="BMW">BMW</option>
              <option value="MINI">MINI Cooper</option>
              <option value="OTHER" data-i18n="f_other_makes"></option>
            </select>
          </div>
          <div>
            <label data-i18n="f_model"></label>
            <select id="f-model"><option value="" data-i18n="all"></option></select>
          </div>
          <div>
            <label data-i18n="f_cat"></label>
            <select id="f-category"><option value="" data-i18n="all"></option></select>
          </div>
          <div>
            <label data-i18n="f_cond"></label>
            <select id="f-condition">
              <option value="" data-i18n="all"></option>
              <option value="new" data-i18n="cond_new"></option>
              <option value="used" data-i18n="cond_used"></option>
            </select>
          </div>
          <button class="btn btn-outline btn-sm" id="f-reset" data-i18n="clear_filters"></button>
        </aside>

        <!-- النتائج -->
        <div>
          <div class="shop-toolbar">
            <span class="count" id="results-count"></span>
            <select id="f-sort">
              <option value="" data-i18n="sort_new"></option>
              <option value="newest" data-i18n="sort_newest"></option>
              <option value="best" data-i18n="sort_best"></option>
              <option value="rating" data-i18n="sort_rating"></option>
              <option value="price_asc" data-i18n="sort_asc"></option>
              <option value="price_desc" data-i18n="sort_desc"></option>
            </select>
          </div>
          <div class="products-grid" id="products-grid"></div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script>
    renderLayout('shop');
    document.title = t('title_shop');

    // 🇦🇪 في الجملة كله مستعمل (وارد) — نخفي فلتر الحالة
    if (isWholesale()) {
      const cond = document.getElementById('f-condition');
      if (cond) { cond.value = ''; cond.closest('div').style.display = 'none'; }
    }

    const grid = document.getElementById('products-grid');
    const fields = ['q', 'brand', 'model', 'category', 'condition', 'sort'];

    // تعبئة الفلاتر من رابط الصفحة
    const params = new URLSearchParams(location.search);
    fields.forEach((f) => {
      const el = document.getElementById('f-' + f);
      if (params.get(f)) el.value = params.get(f);
    });

    const PER_PAGE = 12;
    let currentPage = 1;
    let lastResults = [];

    function renderPage() {
      const pages = Math.max(1, Math.ceil(lastResults.length / PER_PAGE));
      currentPage = Math.min(currentPage, pages);
      const slice = lastResults.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE);
      const currentQ = document.getElementById('f-q').value.trim();
      const near = lastResults.length && lastResults[0]._near;
      const AR = LANG !== 'en';
      // 📩 "مش لاقي اللي بتدور عليه؟ اطلبها" — بدل ما الزبون يمشي، ناخد رقمه ونوفّرهاله
      const reqBox = (title) => `<form class="miss-form" style="grid-column:1/-1;max-width:520px;width:100%;margin:6px auto 14px;text-align:start;background:var(--card,#fff);border:2px solid var(--brand,#f5a524);border-radius:14px;padding:16px;">
          <b style="display:block;font-size:17px;margin-bottom:4px;">${title}</b>
          <small style="color:var(--muted);display:block;margin-bottom:12px;">${AR ? 'سيب رقمك واسم القطعة وهنوفّرهالك ونكلمك واتساب — من غير أي التزام.' : 'Leave your number and the part — we\'ll source it and WhatsApp you. No obligation.'}</small>
          <input name="part" value="${esc(currentQ)}" placeholder="${AR ? 'اسم القطعة' : 'Part name'}" required style="margin-bottom:8px;">
          <input name="car" placeholder="${AR ? 'عربيتك وسنتها (مثلاً F30 2016)' : 'Car & year (e.g. F30 2016)'}" style="margin-bottom:8px;">
          <input name="name" placeholder="${AR ? 'اسمك' : 'Your name'}" value="${esc(currentUser()?.name || '')}" required style="margin-bottom:8px;">
          <input name="phone" type="tel" inputmode="tel" dir="ltr" placeholder="${isWholesale() ? '2010xxxxxxxx' : '01xxxxxxxxx'}" value="${esc(currentUser()?.phone || '')}" required style="margin-bottom:10px;text-align:start;">
          <button class="btn" type="submit" style="width:100%;">📩 ${AR ? 'اطلبها — هنوفّرهالك' : 'Request it — we\'ll find it'}</button>
          <a class="btn btn-green" target="_blank" rel="noopener" style="width:100%;margin-top:8px;text-align:center;" data-wa-req href="${waLink((AR ? 'محتاج قطعة: ' : 'I need a part: ') + currentQ)}">💬 ${AR ? 'أو اطلبها على واتساب' : 'Or ask on WhatsApp'}</a>
          <div class="miss-msg" style="font-size:13px;margin-top:8px;"></div>
        </form>`;
      grid.innerHTML = slice.length
        ? (near && currentQ ? `<div class="note" style="grid-column:1/-1;">🔎 ${AR ? `مفيش تطابق كامل لـ "<b>${esc(currentQ)}</b>" — دي أقرب نتايج. مش هي؟ اطلبها تحت 👇` : `No exact match for "<b>${esc(currentQ)}</b>" — closest results. Not it? Request it below 👇`}</div>` : '')
          + slice.map(productCard).join('')
          + (near && currentQ && currentPage === pages ? reqBox(AR ? '🙋 مش لاقي اللي بتدور عليه؟ اطلبها' : '🙋 Can\'t find it? Request it') : '')
        : (currentQ ? reqBox(AR ? `🙋 مش لاقي "${esc(currentQ)}"؟ اطلبها وهنوفّرهالك` : `🙋 Can't find "${esc(currentQ)}"? Request it`) : '')
          + `<div class="empty-state" style="grid-column: 1/-1;"><span class="icon">🔍</span>${t('no_results')} <a href="/assistant.html" style="color: var(--accent-dark);">${t('ask_expert')}</a></div>`;
      grid.querySelectorAll('[data-wa-req]').forEach((a) => a.addEventListener('click', () => trackEvent('part_request', { via: 'wa' })));
      grid.querySelectorAll('.miss-form').forEach((f) => f.addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = f.querySelector('.miss-msg'), btn = f.querySelector('button');
        btn.disabled = true; msg.textContent = '';
        try {
          await api('/requests', { method: 'POST', body: JSON.stringify({
            name: f.name.value.trim(), phone: f.phone.value.trim(), car: f.car.value.trim(),
            partName: f.part.value.trim() || currentQ, source: 'search',
            notes: (AR ? '🔎 من البحث — ' : 'From search — ') + (near ? (AR ? 'أقرب نتايج مش مناسبة' : 'near results not suitable') : (AR ? 'مالقاش نتيجة' : 'no results')) + ` ("${currentQ}")`,
          }) });
          trackEvent('part_request');
          f.innerHTML = `<div style="color:var(--green);font-weight:700;text-align:center;">${AR ? '✅ تمام! هنكلمك أول ما نوفّرها.' : '✅ Got it! We\'ll contact you soon.'}</div>`;
        } catch (err) { msg.style.color = 'var(--red)'; msg.textContent = err.message; btn.disabled = false; }
      }));
      const pag = document.getElementById('pagination');
      pag.innerHTML = pages > 1
        ? Array.from({ length: pages }, (_, i) =>
            `<button class="${i + 1 === currentPage ? 'active' : ''}" data-page="${i + 1}">${i + 1}</button>`).join('')
        : '';
      pag.querySelectorAll('button').forEach((b) =>
        b.addEventListener('click', () => {
          currentPage = Number(b.dataset.page);
          renderPage();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }));
    }

    // 🚗 شريط "عربيتك" فوق النتايج
    function renderGarageBar() {
      let bar = document.getElementById('garage-bar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'garage-bar';
        const lay = document.querySelector('.shop-layout');
        lay.parentNode.insertBefore(bar, lay);
      }
      if (isWholesale()) { bar.innerHTML = ''; return; }
      const g = getGarage();
      const mSel = document.getElementById('f-model');
      if (!g) {
        bar.className = 'garage-bar';
        bar.innerHTML = `<span>🚗 ${LANG === 'en' ? 'Pick your car to see the parts that fit it' : 'اختار عربيتك ونوريك القطع اللي بتركب عليها بس'}</span>
          <button class="btn btn-sm" type="button" onclick="openGarageModal()">${LANG === 'en' ? 'Pick my car' : 'اختار عربيتك'}</button>`;
        return;
      }
      const on = mSel.value === g.model;
      bar.className = 'garage-bar has-car';
      bar.innerHTML = `<span>${t('garage_banner', { m: esc(garageLabel(g)) })}</span>
        <label class="gb-toggle"><input type="checkbox" id="gb-only" ${on ? 'checked' : ''}> ${t('garage_only')}</label>
        <button class="btn btn-outline btn-sm" type="button" onclick="openGarageModal()">${t('garage_change')}</button>`;
      bar.querySelector('#gb-only').addEventListener('change', (e) => {
        if (e.target.checked && ![...mSel.options].some((o) => o.value === g.model)) mSel.add(new Option(g.model, g.model));
        mSel.value = e.target.checked ? g.model : '';
        load();
      });
    }
    window.onGarageChange = () => { renderLayout('shop'); const g = getGarage(); const mSel = document.getElementById('f-model'); if (g) { if (![...mSel.options].some((o) => o.value === g.model)) mSel.add(new Option(g.model, g.model)); mSel.value = g.model; } else mSel.value = ''; load(); };

    async function load() {
      grid.innerHTML = skeletonCards(9);
      const qs = new URLSearchParams();
      fields.forEach((f) => {
        const v = document.getElementById('f-' + f).value.trim();
        if (v) qs.set(f, v);
      });
      history.replaceState(null, '', qs.toString() ? '?' + qs : location.pathname);
      try {
        // 🚫 المتجر بيعرض المتاح في المخزون بس — أي منتج مخزونه صفر مابيظهرش للعميل.
        //    (الـ API بيفلتر stock>0 تلقائياً لما مانبعتش all=1).
        lastResults = wsCatalogFilter(await api('/products' + (qs.toString() ? '?' + qs : '')));
        if (document.getElementById('f-sort').value === 'newest') lastResults = [...lastResults].sort(byNewest);
        // 🚗 لو العميل مسجّل عربيته: القطع اللي بتركب عليها تطلع الأول
        if (getGarage() && !/^price/.test(document.getElementById('f-sort').value)) {
          const rank = (p) => (fitsCar(p) === true ? 0 : fitsCar(p) === null ? 1 : 2);
          lastResults = [...lastResults].sort((a, b) => rank(a) - rank(b));
        }
        renderGarageBar();
        currentPage = 1;
        {
          // عنوان واضح للقسم المفتوح (وصل حديثاً / BMW / MINI / ماركات تانية) عشان العميل يعرف هو فين
          const sv = document.getElementById('f-sort').value, bv = document.getElementById('f-brand').value;
          const label = sv === 'newest' ? '🆕 ' + t('nav_new_arrivals') : bv === 'OTHER' ? t('f_other_makes') : bv ? '⭐ ' + bv : '';
          document.getElementById('results-count').innerHTML = (label ? `<b style="color:var(--brand);">${esc(label)}</b> • ` : '') + `${lastResults.length} ${t('n_products')}`;
        }
        // 📱 على الموبايل الفلاتر فوق النتايج — لو البحث مالقاش، ننزّل الزبون لخانة "اطلبها" على طول
        if (qs.get('q') && (!lastResults.length || lastResults[0]._near) && innerWidth < 900)
          setTimeout(() => document.querySelector(lastResults.length ? '#results-count' : '.miss-form')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
        if (qs.get('q')) trackSearch(qs.get('q'), lastResults[0] && lastResults[0]._near ? 0 : lastResults.length); // 📈 يظهر في "بحث بدون نتائج" لو مفيش
        renderPage();
      } catch (e) {
        grid.innerHTML = `<div class="spinner">${esc(e.message)}</div>`;
      }
    }

    // قوائم الموديلات والفئات من المتاح في المخزون بس — عشان الفلاتر مايظهروش
    // موديل/فئة نتيجتها فاضية (كل قطعها مخزونها صفر ومخفية عن العميل).
    api('/products').then((all) => {
      const products = wsCatalogFilter(all);
      const models = [...new Set(products.flatMap((p) => p.fits || []))].sort();
      const cats = [...new Set(products.map((p) => p.category))];
      const mSel = document.getElementById('f-model');
      const cSel = document.getElementById('f-category');
      mSel.innerHTML += models.map((m) => `<option>${esc(m)}</option>`).join('');
      cSel.innerHTML += cats.map((c) => `<option value="${esc(c)}">${catName(c)}</option>`).join('');
      if (params.get('model')) mSel.value = params.get('model');
      if (params.get('category')) cSel.value = params.get('category');
      load();
    });

    fields.forEach((f) => {
      const el = document.getElementById('f-' + f);
      el.addEventListener(f === 'q' ? 'input' : 'change', () => {
        clearTimeout(window._ft);
        window._ft = setTimeout(load, f === 'q' ? 400 : 0);
      });
    });
    document.getElementById('f-reset').addEventListener('click', () => {
      fields.forEach((f) => (document.getElementById('f-' + f).value = ''));
      load();
    });
  </script>
</body>
</html>
