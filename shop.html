<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المتجر | بافاريا بارتس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container">
      <div class="shop-layout">
        <!-- الفلاتر -->
        <aside class="filters">
          <h3>تصفية النتائج</h3>
          <div>
            <label>بحث</label>
            <input type="search" id="f-q" placeholder="اسم القطعة أو OEM...">
          </div>
          <div>
            <label>الماركة</label>
            <select id="f-brand">
              <option value="">الكل</option>
              <option value="BMW">BMW</option>
              <option value="MINI">MINI Cooper</option>
            </select>
          </div>
          <div>
            <label>الموديل</label>
            <select id="f-model"><option value="">الكل</option></select>
          </div>
          <div>
            <label>الفئة</label>
            <select id="f-category"><option value="">الكل</option></select>
          </div>
          <div>
            <label>الحالة</label>
            <select id="f-condition">
              <option value="">الكل</option>
              <option value="new">جديد</option>
              <option value="used">مستعمل وارد</option>
            </select>
          </div>
          <button class="btn btn-outline btn-sm" id="f-reset">مسح الفلاتر</button>
        </aside>

        <!-- النتائج -->
        <div>
          <div class="shop-toolbar">
            <span class="count" id="results-count"></span>
            <select id="f-sort">
              <option value="">الأحدث</option>
              <option value="price_asc">السعر: من الأقل</option>
              <option value="price_desc">السعر: من الأعلى</option>
            </select>
          </div>
          <div class="products-grid" id="products-grid">
            <div class="spinner">جاري التحميل...</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script>
    renderLayout('shop');

    const grid = document.getElementById('products-grid');
    const fields = ['q', 'brand', 'model', 'category', 'condition', 'sort'];
    let allProducts = [];

    // تعبئة الفلاتر من رابط الصفحة
    const params = new URLSearchParams(location.search);
    fields.forEach((f) => {
      const el = document.getElementById('f-' + f);
      if (params.get(f)) el.value = params.get(f);
    });

    async function load() {
      grid.innerHTML = '<div class="spinner">جاري التحميل...</div>';
      const qs = new URLSearchParams();
      fields.forEach((f) => {
        const v = document.getElementById('f-' + f).value.trim();
        if (v) qs.set(f, v);
      });
      history.replaceState(null, '', qs.toString() ? '?' + qs : location.pathname);
      try {
        const products = await api('/products?' + qs);
        document.getElementById('results-count').textContent = `${products.length} منتج`;
        grid.innerHTML = products.map(productCard).join('') ||
          '<div class="empty-state" style="grid-column: 1/-1;"><span class="icon">🔍</span>لا توجد نتائج مطابقة — جرّب تعدل الفلاتر أو <a href="/assistant.html" style="color: var(--blue2);">اسأل الخبير</a></div>';
      } catch (e) {
        grid.innerHTML = `<div class="spinner">${esc(e.message)}</div>`;
      }
    }

    // قوائم الموديلات والفئات من البيانات نفسها
    api('/products').then((products) => {
      allProducts = products;
      const models = [...new Set(products.flatMap((p) => p.models))].sort();
      const cats = [...new Set(products.map((p) => p.category))];
      const mSel = document.getElementById('f-model');
      const cSel = document.getElementById('f-category');
      mSel.innerHTML += models.map((m) => `<option>${esc(m)}</option>`).join('');
      cSel.innerHTML += cats.map((c) => `<option>${esc(c)}</option>`).join('');
      if (params.get('model')) mSel.value = params.get('model');
      if (params.get('category')) cSel.value = params.get('category');
      load();
    });

    fields.forEach((f) => {
      const el = document.getElementById('f-' + f);
      el.addEventListener(f === 'q' ? 'input' : 'change', () => {
        clearTimeout(window._ft);
        window._ft = setTimeout(load, f === 'q' ? 400 : 0);
      });
    });
    document.getElementById('f-reset').addEventListener('click', () => {
      fields.forEach((f) => (document.getElementById('f-' + f).value = ''));
      load();
    });
  </script>
</body>
</html>
