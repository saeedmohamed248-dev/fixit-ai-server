<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المتجر — قطع غيار BMW وميني كوبر جديد ومستعمل | FixIt</title>
  <meta property="og:image" content="https://fixitauto.parts/assets/fixit-logo-square.png">
  <meta name="twitter:card" content="summary">
  <meta name="description" content="تصفّح كل قطع غيار BMW وميني كوبر المتاحة: محرك، فرامل، عفشة، كهرباء، بودي — جديد ومستعمل وارد بضمان وشحن لكل محافظات مصر.">
  <link rel="canonical" href="https://fixitauto.parts/shop.html">
  <meta property="og:title" content="المتجر — قطع غيار BMW وميني كوبر جديد ومستعمل | FixIt">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FixIt">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#101828">
  <link rel="stylesheet" href="/css/style.css?v=20261128f">
</head>
<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container">
      <div class="sx-head">
        <nav class="breadcrumbs"><a href="/index.html" data-i18n="nav_home">الرئيسية</a><span>←</span><span id="sx-crumb" data-i18n="nav_shop">كل القطع</span></nav>
        <h1 id="sx-title" data-i18n="nav_shop">كل القطع</h1>
      </div>
      <div id="wa-top" style="display:grid;"></div>
      <div class="shop-layout">
        <!-- الفلاتر -->
        <aside class="filters" id="filters">
          <h3 data-i18n="filters">تصفية النتائج</h3>
          <button type="button" class="filters-close" aria-label="close" onclick="document.body.classList.remove('filters-open')">×</button>
          <div>
            <label data-i18n="f_search">بحث</label>
            <input type="search" id="f-q" data-i18n-ph="f_search_ph" placeholder="اسم القطعة أو OEM...">
          </div>
          <div>
            <label data-i18n="f_brand">الماركة</label>
            <select id="f-brand">
              <option value="" data-i18n="all">الكل</option>
              <option value="BMW">BMW</option>
              <option value="MINI">MINI Cooper</option>
              <option value="OTHER" data-i18n="f_other_makes">🚙 ماركات تانية</option>
            </select>
          </div>
          <div>
            <label data-i18n="f_model">الموديل</label>
            <select id="f-model"><option value="" data-i18n="all">الكل</option></select>
          </div>
          <div>
            <label data-i18n="f_cat">الفئة</label>
            <select id="f-category"><option value="" data-i18n="all">الكل</option></select>
          </div>
          <div>
            <label data-i18n="f_cond">الحالة</label>
            <select id="f-condition">
              <option value="" data-i18n="all">الكل</option>
              <option value="new" data-i18n="cond_new">جديد</option>
              <option value="used" data-i18n="cond_used">مستعمل وارد</option>
            </select>
          </div>
          <button class="btn btn-outline btn-sm" id="f-reset" data-i18n="clear_filters">مسح الفلاتر</button>
          <button type="button" class="btn filters-apply" onclick="document.body.classList.remove('filters-open');scrollTo({top:0,behavior:'smooth'})" data-i18n="show_results">عرض النتائج</button>
        </aside>

        <!-- النتائج -->
        <div>
          <div class="quick-chips" id="quick-chips">
            <button type="button" data-f="brand" data-v="BMW">BMW</button>
            <button type="button" data-f="brand" data-v="MINI">MINI</button>
            <button type="button" data-f="condition" data-v="new" data-i18n="cond_new">جديد</button>
            <button type="button" data-f="condition" data-v="used" data-i18n="cond_used">مستعمل وارد</button>
          </div>
          <div class="shop-toolbar">
            <button type="button" class="btn btn-outline btn-sm filters-toggle" onclick="document.body.classList.add('filters-open')"><svg class="ui-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg> <span data-i18n="filters">تصفية النتائج</span></button>
            <span class="count" id="results-count"></span>
            <select id="f-sort">
              <option value="" data-i18n="sort_new">الأحدث</option>
              <option value="newest" data-i18n="sort_newest">الأحدث وصولاً</option>
              <option value="best" data-i18n="sort_best">الأكثر مبيعاً</option>
              <option value="rating" data-i18n="sort_rating">الأعلى تقييماً</option>
              <option value="price_asc" data-i18n="sort_asc">السعر: من الأقل</option>
              <option value="price_desc" data-i18n="sort_desc">السعر: من الأعلى</option>
            </select>
          </div>
          <div class="products-grid" id="products-grid"></div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js?v=20261128f"></script>
  <script src="/js/i18n.js?v=20261128f"></script>
  <script src="/js/app.js?v=20261128f"></script>
  <script>
    renderLayout('shop');
    document.title = t('title_shop');

    // 🇦🇪 في الجملة كله مستعمل (وارد) — نخفي فلتر الحالة
    if (isWholesale()) {
      const cond = document.getElementById('f-condition');
      if (cond) { cond.value = ''; cond.closest('div').style.display = 'none'; }
    }

    const grid = document.getElementById('products-grid');
    const fields = ['q', 'brand', 'model', 'category', 'condition', 'sort'];

    // تعبئة الفلاتر من رابط الصفحة
    const params = new URLSearchParams(location.search);
    fields.forEach((f) => {
      const el = document.getElementById('f-' + f);
      if (params.get(f)) el.value = params.get(f);
    });

    const PER_PAGE = 12;
    let currentPage = 1;
    let lastResults = [];
    let oosHits = []; // 📦 قطع في الكتالوج بتطابق البحث بس خلصت مؤقتاً

    function renderPage() {
      const pages = Math.max(1, Math.ceil(lastResults.length / PER_PAGE));
      currentPage = Math.min(currentPage, pages);
      const slice = lastResults.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE);
      const currentQ = document.getElementById('f-q').value.trim();
      const near = lastResults.length && lastResults[0]._near;
      const AR = LANG !== 'en';
      // 📩 "مش لاقي اللي بتدور عليه؟ اطلبها" — بدل ما الزبون يمشي، ناخد رقمه ونوفّرهاله
      const reqBox = (title) => `<form class="miss-form" style="grid-column:1/-1;max-width:520px;width:100%;margin:6px auto 14px;text-align:start;background:var(--card,#fff);border:2px solid var(--brand,#f5a524);border-radius:14px;padding:16px;">
          <b style="display:block;font-size:17px;margin-bottom:4px;">${title}</b>
          <small style="color:var(--muted);display:block;margin-bottom:12px;">${AR ? 'سيب رقمك واسم القطعة وهنوفّرهالك ونكلمك واتساب — من غير أي التزام.' : 'Leave your number and the part — we\'ll source it and WhatsApp you. No obligation.'}</small>
          ${oosHits.length ? `<div class="oos-hits" style="background:var(--bg,#f6f7f9);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;">
            <b style="display:block;margin-bottom:6px;">📦 ${AR ? 'بنتعامل فيها — بس خلصت مؤقتاً:' : 'We carry it — temporarily out of stock:'}</b>
            ${oosHits.map((h) => `<div style="display:flex;justify-content:space-between;gap:8px;padding:3px 0;"><span>${esc(AR ? h.name : (h.nameEn || h.name))}</span>${h.price ? `<span style="white-space:nowrap;color:var(--muted);">${AR ? 'آخر سعر' : 'Last price'} <span dir="ltr">${money(h.price)}</span></span>` : ''}</div>`).join('')}
          </div>` : ''}
          <input name="part" value="${esc(oosHits.length && !near ? (AR ? oosHits[0].name : (oosHits[0].nameEn || oosHits[0].name)) : currentQ)}" placeholder="${AR ? 'اسم القطعة' : 'Part name'}" required style="margin-bottom:8px;">
          <input name="car" placeholder="${AR ? 'عربيتك وسنتها (مثلاً F30 2016)' : 'Car & year (e.g. F30 2016)'}" style="margin-bottom:8px;">
          <input name="name" placeholder="${AR ? 'اسمك' : 'Your name'}" value="${esc(currentUser()?.name || '')}" required style="margin-bottom:8px;">
          <input name="phone" type="tel" inputmode="tel" dir="ltr" placeholder="${isWholesale() ? '2010xxxxxxxx' : '01xxxxxxxxx'}" value="${esc(currentUser()?.phone || '')}" required style="margin-bottom:10px;text-align:start;">
          <button class="btn" type="submit" style="width:100%;">📩 ${AR ? 'اطلبها — هنوفّرهالك' : 'Request it — we\'ll find it'}</button>
          <a class="btn btn-green" target="_blank" rel="noopener" style="width:100%;margin-top:8px;text-align:center;" data-wa-req href="${waLink((AR ? 'محتاج قطعة: ' : 'I need a part: ') + currentQ)}">💬 ${AR ? 'أو اطلبها على واتساب' : 'Or ask on WhatsApp'}</a>
          <div class="miss-msg" style="font-size:13px;margin-top:8px;"></div>
        </form>`;
      // 📲 زرار واتساب واضح فوق صفحة «مفيش نتائج» — رسالة جاهزة فيها كلمة البحث + طلب رقم الشاسيه
      const waMsg = AR
        ? `أهلاً FixIt 👋\nبدوّر على: ${currentQ}\nومالقيتهاش على الموقع.\nرقم الشاسيه (VIN): `
        : `Hi FixIt 👋\nI'm looking for: ${currentQ}\nCouldn't find it on the website.\nChassis number (VIN): `;
      const waBig = `<a class="btn btn-green" data-wa-req target="_blank" rel="noopener" href="${waLink(waMsg)}"
          style="grid-column:1/-1;max-width:520px;width:100%;margin:6px auto 4px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;padding:16px 14px;border-radius:14px;text-align:center;line-height:1.4;">
          <span style="font-size:24px;">💬</span><span>${AR ? 'ابعت اسم القطعة أو رقم الشاسيه على واتساب' : 'Send the part name or chassis number on WhatsApp'}<small style="display:block;font-weight:500;opacity:.9;font-size:13px;">${AR ? 'بنرد في دقايق ونوفّرهالك' : 'We reply in minutes and source it'}</small></span></a>`;
      grid.innerHTML = slice.length
        ? (near && currentQ ? `<div class="note" style="grid-column:1/-1;">🔎 ${AR ? `مفيش تطابق كامل لـ "<b>${esc(currentQ)}</b>" — دي أقرب نتايج. مش هي؟ اطلبها تحت 👇` : `No exact match for "<b>${esc(currentQ)}</b>" — closest results. Not it? Request it below 👇`}</div>` : '')
          + slice.map(productCard).join('')
          + (near && currentQ && currentPage === pages ? reqBox(AR ? '🙋 مش لاقي اللي بتدور عليه؟ اطلبها' : '🙋 Can\'t find it? Request it') : '')
        : (currentQ ? waBig + reqBox(AR ? `🙋 مش لاقي "${esc(currentQ)}"؟ اطلبها وهنوفّرهالك` : `🙋 Can't find "${esc(currentQ)}"? Request it`) : '')
          + `<div class="empty-state" style="grid-column: 1/-1;"><span class="icon">🔍</span>${t('no_results')} <a href="/assistant.html" style="color: var(--accent-dark);">${t('ask_expert')}</a></div>`;
      // على الموبايل الفلاتر بتيجي قبل النتايج — فبنحط نفس الزرار فوقها عشان يبان من غير سكرول
      const waTop = document.getElementById('wa-top');
      if (waTop) waTop.innerHTML = (!slice.length && currentQ && innerWidth < 900) ? waBig : '';
      waTop?.querySelectorAll('[data-wa-req]').forEach((a) => a.addEventListener('click', () => trackEvent('part_request', { via: 'wa_noresult' })));
      grid.querySelectorAll('[data-wa-req]').forEach((a) => a.addEventListener('click', () => trackEvent('part_request', { via: 'wa' })));
      grid.querySelectorAll('.miss-form').forEach((f) => f.addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = f.querySelector('.miss-msg'), btn = f.querySelector('button');
        btn.disabled = true; msg.textContent = '';
        try {
          await api('/requests', { method: 'POST', body: JSON.stringify({
            name: f.name.value.trim(), phone: f.phone.value.trim(), car: f.car.value.trim(),
            partName: f.part.value.trim() || currentQ, source: 'search',
            notes: (AR ? '🔎 من البحث — ' : 'From search — ') + (near ? (AR ? 'أقرب نتايج مش مناسبة' : 'near results not suitable') : (AR ? 'مالقاش نتيجة' : 'no results')) + ` ("${currentQ}")`,
          }) });
          trackEvent('part_request');
          f.innerHTML = `<div style="color:var(--green);font-weight:700;text-align:center;">${AR ? '✅ تمام! هنكلمك أول ما نوفّرها.' : '✅ Got it! We\'ll contact you soon.'}</div>`;
        } catch (err) { msg.style.color = 'var(--red)'; msg.textContent = err.message; btn.disabled = false; }
      }));
      const pag = document.getElementById('pagination');
      pag.innerHTML = pages > 1
        ? Array.from({ length: pages }, (_, i) =>
            `<button class="${i + 1 === currentPage ? 'active' : ''}" data-page="${i + 1}">${i + 1}</button>`).join('')
        : '';
      pag.querySelectorAll('button').forEach((b) =>
        b.addEventListener('click', () => {
          currentPage = Number(b.dataset.page);
          renderPage();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }));
    }

    // 🚗 شريط "عربيتك" فوق النتايج
    function renderGarageBar() {
      let bar = document.getElementById('garage-bar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'garage-bar';
        const lay = document.querySelector('.shop-layout');
        lay.parentNode.insertBefore(bar, lay);
      }
      if (isWholesale()) { bar.innerHTML = ''; return; }
      const g = getGarage();
      const mSel = document.getElementById('f-model');
      if (!g) {
        bar.className = 'garage-bar';
        bar.innerHTML = `<span>${uiIc('car')}${LANG === 'en' ? 'Pick your car to see the parts that fit it' : 'اختار عربيتك ونوريك القطع اللي بتركب عليها بس'}</span>
          <button class="btn btn-sm" type="button" onclick="openGarageModal()">${LANG === 'en' ? 'Pick my car' : 'اختار عربيتك'}</button>`;
        return;
      }
      const on = mSel.value === g.model;
      bar.className = 'garage-bar has-car';
      bar.innerHTML = `<span>${t('garage_banner', { m: esc(garageLabel(g)) })}</span>
        <label class="gb-toggle"><input type="checkbox" id="gb-only" ${on ? 'checked' : ''}> ${t('garage_only')}</label>
        <button class="btn btn-outline btn-sm" type="button" onclick="openGarageModal()">${t('garage_change')}</button>`;
      bar.querySelector('#gb-only').addEventListener('change', (e) => {
        if (e.target.checked && ![...mSel.options].some((o) => o.value === g.model)) mSel.add(new Option(g.model, g.model));
        mSel.value = e.target.checked ? g.model : '';
        load();
      });
    }
    window.onGarageChange = () => { renderLayout('shop'); const g = getGarage(); const mSel = document.getElementById('f-model'); if (g) { if (![...mSel.options].some((o) => o.value === g.model)) mSel.add(new Option(g.model, g.model)); mSel.value = g.model; } else mSel.value = ''; load(); };

    async function load() {
      grid.innerHTML = skeletonCards(9);
      const qs = new URLSearchParams();
      fields.forEach((f) => {
        const v = document.getElementById('f-' + f).value.trim();
        if (v) qs.set(f, v);
      });
      history.replaceState(null, '', qs.toString() ? '?' + qs : location.pathname);
      try {
        // 🚫 المتجر بيعرض المتاح في المخزون بس — أي منتج مخزونه صفر مابيظهرش للعميل.
        //    (الـ API بيفلتر stock>0 تلقائياً لما مانبعتش all=1).
        lastResults = wsCatalogFilter(await api('/products' + (qs.toString() ? '?' + qs : '')));
        if (document.getElementById('f-sort').value === 'newest') lastResults = [...lastResults].sort(byNewest);
        // 🚗 لو العميل مسجّل عربيته: القطع اللي بتركب عليها تطلع الأول
        if (getGarage() && !/^price/.test(document.getElementById('f-sort').value)) {
          const rank = (p) => (fitsCar(p) === true ? 0 : fitsCar(p) === null ? 1 : 2);
          lastResults = [...lastResults].sort((a, b) => rank(a) - rank(b));
        }
        // 📦 البحث مالقاش حاجة متاحة؟ نشوف لو القطعة في كتالوجنا وخلصت — نعرضها في خانة "اطلبها"
        oosHits = [];
        if (qs.get('q') && (!lastResults.length || lastResults[0]._near) && !isWholesale()) {
          try { oosHits = wsCatalogFilter(await api('/products?oos=1&q=' + encodeURIComponent(qs.get('q')))).slice(0, 5); } catch (_) { oosHits = []; } // 🇪🇬/🇦🇪 نفس فلتر الفرع
        }
        renderGarageBar();
        currentPage = 1;
        {
          // عنوان واضح للقسم المفتوح (وصل حديثاً / BMW / MINI / ماركات تانية) عشان العميل يعرف هو فين
          const sv = document.getElementById('f-sort').value, bv = document.getElementById('f-brand').value;
          const cv = document.getElementById('f-category').value, qv = qs.get('q'), mv = document.getElementById('f-model').value;
          const label = qv ? (LANG === 'en' ? `Results for “${qv}”` : `نتايج «${qv}»`)
            : cv ? catName(cv) : sv === 'newest' ? t('nav_new_arrivals') : bv === 'OTHER' ? t('f_other_makes').replace(/^\S+\s/, '') : bv ? (LANG === 'en' ? `${bv} parts` : `قطع ${bv}`) : t('nav_shop');
          document.getElementById('sx-title').textContent = label + (mv ? ' · ' + mv : '');
          document.getElementById('sx-crumb').textContent = label;
          document.getElementById('results-count').textContent = `${lastResults.length} ${t('n_products')}`;
        }
        // 📱 على الموبايل الفلاتر فوق النتايج — لو البحث مالقاش، ننزّل الزبون لخانة "اطلبها" على طول
        if (qs.get('q') && (!lastResults.length || lastResults[0]._near) && innerWidth < 900)
          setTimeout(() => document.querySelector(lastResults.length ? '#results-count' : '.miss-form')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
        if (qs.get('q')) trackSearch(qs.get('q'), lastResults[0] && lastResults[0]._near ? 0 : lastResults.length); // 📈 يظهر في "بحث بدون نتائج" لو مفيش
        renderPage();
      } catch (e) {
        grid.innerHTML = `<div class="spinner">${esc(e.message)}</div>`;
      }
    }

    // قوائم الموديلات والفئات من المتاح في المخزون بس — عشان الفلاتر مايظهروش
    // موديل/فئة نتيجتها فاضية (كل قطعها مخزونها صفر ومخفية عن العميل).
    api('/products').then((all) => {
      const products = wsCatalogFilter(all);
      const models = [...new Set(products.flatMap((p) => p.fits || []))].sort();
      const cats = [...new Set(products.map((p) => p.category))];
      const mSel = document.getElementById('f-model');
      const cSel = document.getElementById('f-category');
      mSel.innerHTML += models.map((m) => `<option>${esc(m)}</option>`).join('');
      cSel.innerHTML += cats.map((c) => `<option value="${esc(c)}">${catName(c)}</option>`).join('');
      if (params.get('model')) mSel.value = params.get('model');
      if (params.get('category')) cSel.value = params.get('category');
      load();
    });

    fields.forEach((f) => {
      const el = document.getElementById('f-' + f);
      el.addEventListener(f === 'q' ? 'input' : 'change', () => {
        clearTimeout(window._ft);
        window._ft = setTimeout(load, f === 'q' ? 400 : 0);
      });
    });
    // ⚡ فلاتر سريعة فوق النتايج (زي المتاجر الكبيرة) — بتغيّر نفس الـ select وبتشغّل نفس الفلترة
    const syncChips = () => document.querySelectorAll('#quick-chips [data-f]').forEach((b) =>
      b.classList.toggle('active', document.getElementById('f-' + b.dataset.f).value === b.dataset.v));
    document.querySelectorAll('#quick-chips [data-f]').forEach((b) => b.addEventListener('click', () => {
      const sel = document.getElementById('f-' + b.dataset.f);
      sel.value = sel.value === b.dataset.v ? '' : b.dataset.v;
      sel.dispatchEvent(new Event('change'));
      syncChips();
    }));
    ['f-brand', 'f-condition'].forEach((id) => document.getElementById(id).addEventListener('change', syncChips));
    setTimeout(syncChips, 0);
    document.getElementById('f-reset').addEventListener('click', () => {
      fields.forEach((f) => (document.getElementById('f-' + f).value = ''));
      syncChips();
      load();
    });
    document.addEventListener('cb-offers', () => { try { renderPage(); } catch {} });
  </script>
</body>
</html>
