<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تتبع طلبك | بافاريا بارتس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container" style="max-width: 680px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1>تتبع طلبك 🚚</h1>
        <p style="color: var(--muted);">اكتب رقم الطلب ورقم الموبايل اللي طلبت بيه</p>
      </div>
      <div class="summary" style="margin-bottom: 24px;">
        <div><label>رقم الطلب</label><input id="t-number" dir="ltr" style="text-align: right;" placeholder="ORD-123456"></div>
        <div><label>رقم الموبايل</label><input id="t-phone" type="tel" dir="ltr" style="text-align: right;" placeholder="01xxxxxxxxx"></div>
        <button class="btn" id="t-btn">تتبع الطلب</button>
        <div id="t-error" style="color: var(--red); font-size: 14px;"></div>
      </div>
      <div id="t-result"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script>
    renderLayout('track');
    const STEPS = [
      { key: 'new', label: 'استلمنا الطلب', icon: '📥' },
      { key: 'confirmed', label: 'تم التأكيد', icon: '✅' },
      { key: 'shipped', label: 'في الشحن', icon: '🚚' },
      { key: 'delivered', label: 'تم التسليم', icon: '📦' },
    ];

    async function track() {
      const number = document.getElementById('t-number').value.trim();
      const phone = document.getElementById('t-phone').value.trim();
      const err = document.getElementById('t-error');
      const result = document.getElementById('t-result');
      err.textContent = '';
      result.innerHTML = '';
      if (!number || !phone) { err.textContent = 'اكتب رقم الطلب ورقم الموبايل'; return; }
      try {
        const o = await api(`/orders?track=${encodeURIComponent(number)}&phone=${encodeURIComponent(phone)}`);
        if (o.status === 'cancelled') {
          result.innerHTML = `<div class="note">الطلب ${esc(o.number)} ملغي ❌ — لو ده غلط كلمنا واتساب</div>`;
          return;
        }
        const currentIndex = STEPS.findIndex((s) => s.key === o.status);
        result.innerHTML = `
        <div class="order-card">
          <div class="head">
            <b style="font-size: 18px;">${esc(o.number)}</b>
            <span style="color: var(--muted); font-size: 13px;">${new Date(o.createdAt).toLocaleDateString('ar-EG', { dateStyle: 'long' })}</span>
          </div>
          <div class="timeline">
            ${STEPS.map((s, i) => `
              <div class="tl-step ${i < currentIndex ? 'done' : ''} ${i === currentIndex ? 'current' : ''}">
                <div class="tl-dot">${i < currentIndex ? '✓' : s.icon}</div>
                <small>${s.label}</small>
              </div>`).join('')}
          </div>
          <div style="font-size: 14px; margin-bottom: 8px;">${o.items.map((i) => `${esc(i.name)} ×${i.qty}`).join(' • ')}</div>
          <div style="display: flex; justify-content: space-between;">
            <b>${money(o.total)}</b>
            <span style="color: var(--muted); font-size: 13px;">${o.payment === 'cod' ? '💵 دفع عند الاستلام' : o.payment === 'instapay' ? '🏦 انستاباي' : '📱 محفظة إلكترونية'}</span>
          </div>
        </div>
        <div style="text-align: center; margin-top: 14px;">
          <a class="btn btn-green btn-sm" target="_blank" rel="noopener" href="${waLink('استفسار عن الطلب رقم ' + o.number)}">استفسار عن الطلب واتساب 💬</a>
        </div>`;
      } catch (e) {
        err.textContent = e.message;
      }
    }

    document.getElementById('t-btn').addEventListener('click', track);
    // لو جاي من صفحة حسابي بالرابط
    const params = new URLSearchParams(location.search);
    if (params.get('number')) {
      document.getElementById('t-number').value = params.get('number');
      document.getElementById('t-phone').value = params.get('phone') || '';
      if (params.get('phone')) track();
    }
  </script>
</body>
</html>
