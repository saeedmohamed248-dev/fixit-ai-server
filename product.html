<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قطعة غيار BMW & MINI | FixIt</title>
  <meta name="description" content="تفاصيل قطعة غيار BMW وميني كوبر — جديد ومستعمل وارد بضمان من FixIt.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#101828">
  <link rel="stylesheet" href="/css/style.css?v=20261128d">
</head>
<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container" id="product-container">
      <div class="spinner" data-i18n="loading">جاري التحميل...</div>
    </div>

    <div class="container section" id="reviews-section" style="display: none; padding-bottom: 0;">
      <div class="section-head"><h2 data-i18n="reviews_title">التقييمات والمراجعات ⭐</h2></div>
      <div class="cart-layout">
        <div id="reviews-list"></div>
        <div class="summary">
          <h3 data-i18n="rate_product">قيّم المنتج</h3>
          <div class="star-input" id="star-input" data-value="0">
            <span data-star="1">★</span><span data-star="2">★</span><span data-star="3">★</span><span data-star="4">★</span><span data-star="5">★</span>
          </div>
          <div><label data-i18n="your_name">اسمك</label><input id="rv-name"></div>
          <div><label data-i18n="your_review">رأيك في القطعة (اختياري)</label><textarea id="rv-comment" rows="3"></textarea></div>
          <button class="btn" id="rv-submit" data-i18n="submit_review">إرسال التقييم</button>
          <div id="rv-error" style="color: var(--red); font-size: 14px;"></div>
        </div>
      </div>
    </div>

    <div class="container section" id="qa-section" style="display: none; padding-bottom: 0;">
      <div class="section-head"><h2 data-i18n="qa_title">الأسئلة والأجوبة ❓</h2></div>
      <div class="cart-layout">
        <div id="qa-list"></div>
        <div class="summary">
          <h3 data-i18n="qa_ask">اسأل عن القطعة دي</h3>
          <div><label data-i18n="your_name">اسمك</label><input id="qa-name"></div>
          <div><label data-i18n="qa_ask">اسأل عن القطعة دي</label><textarea id="qa-question" rows="3" data-i18n-ph="qa_ph"></textarea></div>
          <button class="btn" id="qa-submit" data-i18n="qa_send">إرسال السؤال</button>
          <div id="qa-error" style="color: var(--red); font-size: 14px;"></div>
        </div>
      </div>
    </div>

    <div class="container section" id="related-section" style="display: none; padding-bottom: 0;">
      <div class="section-head"><h2 data-i18n="related">قطع مشابهة</h2></div>
      <div class="products-grid" id="related-grid"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js?v=20261128d"></script>
  <script src="/js/i18n.js?v=20261128d"></script>
  <script src="/js/app.js?v=20261128d"></script>
  <script>
    window.SKIP_AUTOVIEW = true; // نسجّل زيارة المنتج بنفسنا مع رقم القطعة
    renderLayout('shop');
    const container = document.getElementById('product-container');
    const id = new URLSearchParams(location.search).get('id') || ((m) => m && decodeURIComponent(m[1]))(location.pathname.match(/\/p\/([^/?#]+)/));
    let product = null;

    // ✏️ أيقونات خطية (نفس ستايل الرئيسية)
    const P_IC = {
      cod: '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
      share: '<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/>',
      shield: '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
      inspect: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.5-4.5"/>',
      return: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
      eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
      wrench: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
    };
    const pIc = (k) => `<svg class="px-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P_IC[k]}</svg>`;
    document.addEventListener('click', (e) => {
      const b = e.target.closest('.px-qty [data-q]'); if (!b) return;
      const q = document.getElementById('qty'); if (!q) return;
      q.value = Math.max(1, Math.min(Number(q.max) || 99, (Number(q.value) || 1) + Number(b.dataset.q)));
    });

    function galleryHtml(p) {
      const images = [p.image, ...(p.images || [])].filter(Boolean).map(fixMediaUrl);
      if (images.length === 0) return `<div class="product-img-box">${productImage(p)}</div>`;
      return `
      <div>
        <div class="product-img-box"><img class="card-img" id="main-img" src="${esc(imgSized(images[0], 900))}" alt="${esc(pname(p))}" fetchpriority="high" decoding="async" onerror="imgFallback(this, '${categoryIcon(p.category)}')"></div>
        ${images.length > 1 ? `<div class="gallery-thumbs">
          ${images.map((src, i) => `<img src="${esc(imgSized(src, 160))}" class="${i === 0 ? 'active' : ''}" data-src="${esc(imgSized(src, 900))}" data-full="${esc(src)}" alt="" loading="lazy" decoding="async" width="64" height="64" onerror="this.remove()">`).join('')}
        </div>` : ''}
      </div>`;
    }

    async function load() {
      if (!id) {
        container.innerHTML = `<div class="empty-state"><span class="icon">❓</span>${t('not_found')}</div>`;
        return;
      }
      try {
        const p = product = await api('/products?id=' + encodeURIComponent(id));
        // 🇦🇪 قطعة فرع الإمارات بتتباع جملة بس — لو اتفتحت من المتجر المصري نوضّح ونحوّل
        if (!isWholesale() && !wsCatalogFilter([p]).length) {
          container.innerHTML = `<div class="empty-state"><span class="icon">🇦🇪</span>
            <b>${esc(pname(p))}</b><br>${LANG === 'en' ? 'This part is sold wholesale from our UAE branch (for traders).' : 'القطعة دي متاحة جملة من فرع الإمارات (للتجار).'}
            <br><br><button class="btn" id="go-ws">${LANG === 'en' ? 'Open in the trade store' : 'افتحها في متجر الجملة'}</button>
            &nbsp;<a class="btn btn-outline" href="/shop.html">${LANG === 'en' ? 'Browse Egypt store' : 'تصفّح متجر مصر'}</a></div>`;
          document.getElementById('go-ws').addEventListener('click', () => { try { localStorage.setItem('mode', 'wholesale'); } catch {} location.reload(); });
          return;
        }
        document.title = pname(p) + ' | FixIt';
        if (!document.querySelector('link[rel=canonical]')) { const c = document.createElement('link'); c.rel = 'canonical'; c.href = location.origin + '/p/' + encodeURIComponent(p.id); document.head.appendChild(c); }
        pushRecent(p.id);
        px('ViewContent', { content_ids: [p.id], content_type: 'product', content_name: pname(p), currency: pxCurrency(), value: Number(dispPrice ? dispPrice(p) : p.price) || 0 });
        trackPageview({ pid: p.id, pname: pname(p), oos: p.stock <= 0 ? 1 : 0, noprice: dispPrice(p) === null ? 1 : 0 }); // 📈 زيارة منتج
        const out = p.stock <= 0;
        const wished = inWishlist(p.id);
        container.innerHTML = `
        <nav class="breadcrumbs">
          <a href="/index.html">${t('nav_home')}</a><span>←</span>
          <a href="/shop.html?category=${encodeURIComponent(p.category)}">${catName(p.category)}</a><span>←</span>
          ${esc(pname(p))}
        </nav>
        <div class="product-layout px-layout">
          ${galleryHtml(p)}
          <div class="product-info">
            <div class="card-badges">${conditionBadge(p)} <span class="badge badge-brand">${esc(p.brand)}</span>
              ${(p.sold || 0) >= 5 ? `<span class="badge badge-new">${t('best_seller')}</span>` : ''}</div>
            <h1>${esc(pname(p))}</h1>
            ${p.ratingCount ? `<div>${starsHtml(p.ratingAvg, p.ratingCount)}</div>` : ''}
            <div class="px-price">
              ${priceBlock(p)}
              ${!isWholesale() && dispOld(p) > p.price ? `<span class="px-save">${LANG === 'en' ? 'Save' : 'وفّر'} ${money(dispOld(p) - p.price)}</span>` : ''}
              ${isWholesale() && !wsLocked() ? `<span class="badge badge-brand" style="margin-inline-start:8px;">${t('ws_badge')}</span>` : ''}
            </div>
            ${wsLocked()
              ? `<div class="note" style="margin:8px 0;">${t('ws_login_required')}<br><a class="btn btn-sm" style="margin-top:8px;" href="/account.html?mode=register&next=${encodeURIComponent(location.pathname + location.search)}">${t('ws_login_cta')}</a></div>`
              : (isWholesale() && wsConf().minOrderNote ? `<div class="note" style="margin:8px 0;">${t('ws_min_note')}</div>` : '')}
            ${deliveryBadge(p)}
            ${!isWholesale() && !out ? cashbackBadge(p, true) : ''}
            ${!isWholesale() && !out ? (() => { const w = deliveryWindow(); return `<div class="eta-box">${uiIc('truck')}<span>${LANG === 'en' ? `Get it <b>${w.label}</b>` : `يوصلك <b>${w.label}</b>`}${w.today ? `<small>${LANG === 'en' ? `Order within ${w.cutoffH ? w.cutoffH + 'h ' : ''}${w.cutoffM}m for same-day delivery` : `اطلب خلال ${w.cutoffH ? w.cutoffH + ' ساعة و' : ''}${w.cutoffM} دقيقة عشان يوصلك في نفس اليوم`}</small>` : `<small>${LANG === 'en' ? 'Same-day delivery on orders before 6 PM' : 'التوصيل في نفس اليوم للطلبات قبل ٦ مساءً'}</small>`}</span></div>`; })() : ''}
            ${tierTableHtml(p)}
            ${isWholesale() ? '' : compatBadge(p)}
            ${!isWholesale() && !getGarage() ? `<button class="btn btn-outline btn-sm" onclick="openGarageModal()" style="margin: 4px 0;">${t('garage_btn')} — ${t('garage_sub').split('—')[0].slice(0, 40)}...</button>` : ''}
            ${out ? `
              <div class="summary" style="margin-top: 16px;">
                <b>${t('notify_title')}</b>
                <div style="display: flex; gap: 8px;">
                  <input id="nt-phone" type="tel" dir="ltr" style="text-align: start;" placeholder="01xxxxxxxxx">
                  <button class="btn btn-sm" id="nt-btn">${t('notify_btn')}</button>
                </div>
                <div id="nt-msg" style="font-size: 13px;"></div>
              </div>
              <a class="btn btn-green" style="margin-top: 10px;" target="_blank" rel="noopener"
                 href="${waLink(t('wa_part') + ': ' + pname(p) + ' (' + p.sku + ')')}">${t('reserve_wa')}</a>
            ` : `
              ${(p.partNumbers && p.partNumbers.length > 1) ? `
              <div class="qty-row" style="flex-direction: column; align-items: stretch; gap: 4px; margin-bottom: 8px;">
                <label style="margin: 0;">🔢 ${t('choose_part_no')}</label>
                <select id="part-no-select" dir="ltr" style="text-align: start; width: 100%;">
                  ${p.partNumbers.map((pn) => `<option value="${esc(pn)}">${esc(pn)}</option>`).join('')}
                </select>
              </div>` : ''}
              <div class="px-buy">
                <div class="px-buy-row">
                  <div class="px-qty">
                    <button type="button" data-q="-1" aria-label="−">−</button>
                    <input type="number" id="qty" value="1" min="1" max="${p.stock}" aria-label="${t('qty')}">
                    <button type="button" data-q="1" aria-label="+">+</button>
                  </div>
                  <button class="btn px-add" id="add-cart">${t('add_cart')}</button>
                </div>
                <a class="btn btn-green px-wa" target="_blank" rel="noopener"
                   href="${waLink(t('wa_part') + ': ' + pname(p) + ' (' + p.sku + ')')}">${t('ask_wa')}</a>
                ${isWholesale() ? '' : `<div class="px-cod">${pIc('cod')}<span>${LANG === 'en' ? '<b>Cash on delivery</b> — inspect the part before you pay' : '<b>الدفع عند الاستلام</b> — عاين القطعة قبل ما تدفع'}</span></div>`}
                <div class="px-mini-actions">
                  <button type="button" class="px-link" id="wish-btn">${wished ? t('wish_in') : t('wish_out')}</button>
                  <button type="button" class="px-link" id="share-btn" title="${t('share')}">${pIc('share')} ${t('share')}</button>
                </div>
              </div>
              ${isWholesale() ? '' : `<div class="guarantee-box px-guar">
                ${warrantyText(p) ? `<div>${pIc('shield')}<b>${LANG === 'en' ? 'Warranty: ' : 'ضمان '}${esc(warrantyText(p))}</b><small>${LANG === 'en' ? 'on this part' : 'على القطعة دي'}</small></div>` : ''}
                <div>${pIc('inspect')}<b>${LANG === 'en' ? 'Inspected' : 'متفحصة'}</b><small>${LANG === 'en' ? 'before sale' : 'قبل البيع'}</small></div>
                <div>${pIc('return')}<b>${LANG === 'en' ? '14-day returns' : 'استرجاع ١٤ يوم'}</b><small>${LANG === 'en' ? 'if not as described' : 'لو مش مطابقة للوصف'}</small></div>
                <div>${pIc('eye')}<b>${LANG === 'en' ? 'Inspect on delivery' : 'عاين وانت بتستلم'}</b><small>${LANG === 'en' ? 'before you pay the rest' : 'قبل ما تدفع الباقي'}</small></div>
                <div>${pIc('wrench')}<b>${LANG === 'en' ? 'Fitment check' : 'نتأكد إنها تركب'}</b><small>${LANG === 'en' ? 'send us your VIN' : 'ابعت رقم الشاسيه'}</small></div>
                <a href="/policies.html">${LANG === 'en' ? 'Details' : 'التفاصيل'} ←</a>
              </div>`}
            `}
            <h3 class="px-h">${LANG === 'en' ? 'Specifications' : 'المواصفات'}</h3>
            <table class="meta-table px-specs">
              <tr><td>${t('sku')}</td><td dir="ltr" style="text-align: start;">${esc(p.sku) || '—'}</td></tr>
              ${(p.partNumbers && p.partNumbers.length > 1) ? `<tr><td>${t('part_no_options')}</td><td dir="ltr" style="text-align: start;">${p.partNumbers.map((pn) => esc(pn)).join('، ')}</td></tr>` : ''}
              <tr><td>${t('oem')}</td><td dir="ltr" style="text-align: start;">${esc(p.oem) || '—'}</td></tr>
              ${p.supplier ? `<tr><td>${t('supplier')}</td><td dir="ltr" style="text-align: start;">${esc(p.supplier)}</td></tr>` : ''}
              ${warrantyText(p) ? `<tr><td>${LANG === 'en' ? 'Warranty' : 'الضمان'}</td><td>🛡️ ${esc(warrantyText(p))}</td></tr>` : ''}
              <tr><td>${t('condition')}</td><td>${p.condition === 'used' ? t('used_checked') : t('cond_new')}</td></tr>
              <tr><td>${t('fits')}</td><td>${p.models.map((m) => `<span class="model-chip">${esc(m)}</span>`).join('')}</td></tr>
              <tr><td>${t('available')}</td><td>${out ? `<span style="color: var(--red);">${t('out_stock')}</span>` : p.stock <= 2 ? `<span style="color: var(--amber);">${t('low_stock', { n: p.stock })}</span>` : p.stock + ' ' + t('pieces')}</td></tr>
              ${isWholesale() && p.cbm ? `<tr><td>${t('spec_cbm')}</td><td dir="ltr" style="text-align:start;">${Number(p.cbm).toFixed(3)} ${t('cbm_unit')}</td></tr>` : ''}
              ${isWholesale() && p.weightKg ? `<tr><td>${t('spec_weight')}</td><td dir="ltr" style="text-align:start;">${p.weightKg} kg</td></tr>` : ''}
              ${isWholesale() && p.lengthCm ? `<tr><td>${t('spec_dims')}</td><td dir="ltr" style="text-align:start;">${p.lengthCm}×${p.widthCm}×${p.heightCm} cm</td></tr>` : ''}
            </table>
            ${pdesc(p) ? `<h3 class="px-h">${LANG === 'en' ? 'Description' : 'الوصف'}</h3><p class="px-desc">${esc(pdesc(p))}</p>` : ''}
          </div>
        </div>`;

        // 📱 شريط شراء ثابت على الموبايل (بيظهر لما زرار «أضف للسلة» يخرج من الشاشة)
        document.getElementById('sticky-buy')?.remove();
        if (!out && !wsLocked() && dispPrice(p) !== null) {
          const bar = document.createElement('div');
          bar.id = 'sticky-buy'; bar.className = 'sticky-buy';
          bar.innerHTML = `<div class="sb-info"><b>${esc(pname(p))}</b>${priceBlock(p)}</div><button class="btn" type="button">${t('add_cart')}</button>`;
          document.body.appendChild(bar);
          bar.querySelector('button').addEventListener('click', () => document.getElementById('add-cart').click());
          const target = document.getElementById('add-cart');
          if (target && 'IntersectionObserver' in window) new IntersectionObserver(([e]) => {
            const on = !e.isIntersecting && e.boundingClientRect.top < 0;
            bar.classList.toggle('show', on); document.body.classList.toggle('sb-on', on);
          }).observe(target);
        }

        // 🔍 تكبير الصورة (لمس/ضغط)
        const mainImg = document.getElementById('main-img');
        if (mainImg) {
          mainImg.style.cursor = 'zoom-in';
          mainImg.addEventListener('click', () => {
            const all = [...container.querySelectorAll('.gallery-thumbs img')].map((x) => x.dataset.src);
            const list = all.length ? all : [mainImg.src];
            let i = Math.max(0, list.indexOf(mainImg.getAttribute('src')));
            const lb = document.createElement('div'); lb.className = 'lightbox';
            const draw = () => { lb.innerHTML = `<button class="lb-x" aria-label="close">×</button>${list.length > 1 ? '<button class="lb-n lb-prev">‹</button><button class="lb-n lb-next">›</button>' : ''}<img src="${esc(list[i])}" alt=""><div class="lb-c">${list.length > 1 ? (i + 1) + ' / ' + list.length : ''}</div>`; };
            draw(); document.body.appendChild(lb); document.body.style.overflow = 'hidden'; document.body.classList.add('lb-open');
            const close = () => { lb.remove(); document.body.style.overflow = ''; document.body.classList.remove('lb-open'); document.removeEventListener('keydown', key); };
            const go = (d) => { i = (i + d + list.length) % list.length; draw(); };
            const key = (e) => { if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') go(1); if (e.key === 'ArrowRight') go(-1); };
            document.addEventListener('keydown', key);
            lb.addEventListener('click', (e) => {
              if (e.target.classList.contains('lb-prev')) return go(-1);
              if (e.target.classList.contains('lb-next')) return go(1);
              if (e.target.tagName === 'IMG') return e.target.classList.toggle('zoomed');
              close();
            });
          });
        }

        // معرض الصور
        container.querySelectorAll('.gallery-thumbs img').forEach((thumb) => {
          thumb.addEventListener('click', () => {
            document.getElementById('main-img').src = thumb.dataset.src;
            container.querySelectorAll('.gallery-thumbs img').forEach((tm) => tm.classList.remove('active'));
            thumb.classList.add('active');
          });
        });

        const addBtn = document.getElementById('add-cart');
        if (addBtn) addBtn.addEventListener('click', () => {
          const qty = Math.max(1, Math.min(p.stock, Number(document.getElementById('qty').value) || 1));
          // 🔢 لو القطعة ليها أكتر من بارت نمبر، نسجّل اللي العميل اختاره
          const sel = document.getElementById('part-no-select');
          if (sel) setPartChoice(p.id, sel.value);
          addToCart(p.id, qty);
        });
        const wishBtn = document.getElementById('wish-btn');
        if (wishBtn) wishBtn.addEventListener('click', () => {
          const nowIn = toggleWishlist(p.id);
          wishBtn.textContent = nowIn ? t('wish_in') : t('wish_out');
        });

        // زرار المشاركة: مشاركة أصلية من الموبايل أو نسخ الرابط
        const shareBtn = document.getElementById('share-btn');
        if (shareBtn) shareBtn.addEventListener('click', async () => {
          const data = { title: pname(p) + ' | ' + SITE.name, url: location.href };
          if (navigator.share) { navigator.share(data).catch(() => {}); }
          else {
            await navigator.clipboard.writeText(location.href).catch(() => {});
            toast(t('link_copied'));
          }
        });

        // بيانات SEO للمنتج (Google Rich Results)
        const ld = document.createElement('script');
        ld.type = 'application/ld+json';
        ld.textContent = JSON.stringify({
          '@context': 'https://schema.org', '@type': 'Product',
          name: pname(p), sku: p.sku, mpn: p.oem, brand: { '@type': 'Brand', name: p.brand },
          description: pdesc(p),
          ...(firstImage(p) ? { image: firstImage(p) } : {}),
          offers: {
            '@type': 'Offer', priceCurrency: 'EGP', price: p.price,
            availability: p.stock > 0 ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock',
            itemCondition: p.condition === 'used' ? 'https://schema.org/UsedCondition' : 'https://schema.org/NewCondition',
          },
          ...(p.ratingCount ? { aggregateRating: { '@type': 'AggregateRating', ratingValue: p.ratingAvg, reviewCount: p.ratingCount } } : {}),
        });
        document.head.appendChild(ld);

        // 🔔 نبهني لما توفر
        const ntBtn = document.getElementById('nt-btn');
        if (ntBtn) ntBtn.addEventListener('click', async () => {
          const msg = document.getElementById('nt-msg');
          try {
            await api('/notify', {
              method: 'POST',
              body: JSON.stringify({ productId: id, phone: document.getElementById('nt-phone').value.trim(), name: currentUser()?.name || '' }),
            });
            trackEvent('notify_stock');
            msg.style.color = 'var(--green)';
            msg.textContent = t('notify_done');
          } catch (ex) {
            msg.style.color = 'var(--red)';
            msg.textContent = ex.message;
          }
        });

        loadReviews();
        loadQA();

        // منتجات مشابهة من نفس الفئة
        const related = wsCatalogFilter(await api('/products?category=' + encodeURIComponent(p.category)))
          .filter((r) => r.id !== p.id).slice(0, 4);
        if (related.length) {
          document.getElementById('related-section').style.display = '';
          document.getElementById('related-grid').innerHTML = related.map(productCard).join('');
        }
      } catch (e) {
        container.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span>${esc(e.message)}</div>`;
      }
    }

    /* ---------- المراجعات ---------- */
    async function loadReviews() {
      document.getElementById('reviews-section').style.display = '';
      if (location.hash === '#reviews-section') setTimeout(() => document.getElementById('reviews-section').scrollIntoView({ behavior: 'smooth' }), 400);
      const list = document.getElementById('reviews-list');
      try {
        const reviews = await api('/reviews?productId=' + encodeURIComponent(id));
        const avg = product.ratingAvg || 0;
        list.innerHTML = (reviews.length ? `
          <div class="rating-summary">
            <span class="big">${avg}</span>
            <div>${starsHtml(avg, reviews.length)}<br><small style="color: var(--muted);">${t('based_on', { n: reviews.length })}</small></div>
          </div>` : `<p style="color: var(--muted); margin-bottom: 14px;">${t('no_reviews')}</p>`)
          + reviews.map((r) => `
          <div class="review-item">
            <div class="review-head">
              <b>${esc(r.name)}</b>
              ${r.verified ? `<span class="verified-badge">${t('verified')}</span>` : ''}
              <span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
              <span class="review-date">${new Date(r.createdAt).toLocaleDateString(LANG === 'en' ? 'en-GB' : 'ar-EG')}</span>
            </div>
            ${r.comment ? `<p>${esc(r.comment)}</p>` : ''}
          </div>`).join('');
      } catch {
        list.innerHTML = '';
      }
    }

    /* ---------- الأسئلة والأجوبة ---------- */
    async function loadQA() {
      document.getElementById('qa-section').style.display = '';
      applyI18n();
      const list = document.getElementById('qa-list');
      try {
        const questions = await api('/questions?productId=' + encodeURIComponent(id));
        list.innerHTML = questions.length ? questions.map((q) => `
          <div class="qa-item">
            <div class="q">س: ${esc(q.question)} <small style="color: var(--muted); font-weight: 400;">— ${esc(q.name)}</small></div>
            ${q.answer
              ? `<div class="a"><b>${t('qa_answer')}</b> ${esc(q.answer)}</div>`
              : `<div class="a" style="border-color: var(--amber);">${t('qa_pending')}</div>`}
          </div>`).join('')
          : `<p style="color: var(--muted);">${t('qa_none')}</p>`;
      } catch { list.innerHTML = ''; }
    }
    if (currentUser()) document.getElementById('qa-name').value = currentUser().name;
    document.getElementById('qa-submit').addEventListener('click', async () => {
      const err = document.getElementById('qa-error');
      err.textContent = '';
      try {
        await api('/questions', {
          method: 'POST',
          body: JSON.stringify({
            productId: id,
            name: document.getElementById('qa-name').value.trim(),
            question: document.getElementById('qa-question').value.trim(),
          }),
        });
        trackEvent('question');
        toast(t('qa_thanks'));
        document.getElementById('qa-question').value = '';
        loadQA();
      } catch (ex) { err.textContent = ex.message; }
    });

    // نجوم الإدخال
    const starInput = document.getElementById('star-input');
    starInput.querySelectorAll('span').forEach((s) => {
      s.addEventListener('click', () => {
        const val = Number(s.dataset.star);
        starInput.dataset.value = val;
        starInput.querySelectorAll('span').forEach((x) =>
          x.classList.toggle('lit', Number(x.dataset.star) <= val));
      });
    });
    // لو العميل مسجّل، حط اسمه تلقائياً
    if (currentUser()) document.getElementById('rv-name').value = currentUser().name;

    document.getElementById('rv-submit').addEventListener('click', async () => {
      const err = document.getElementById('rv-error');
      err.textContent = '';
      try {
        await api('/reviews', {
          method: 'POST',
          headers: userHeaders(),
          body: JSON.stringify({
            productId: id,
            rating: Number(starInput.dataset.value),
            name: document.getElementById('rv-name').value.trim(),
            comment: document.getElementById('rv-comment').value.trim(),
          }),
        });
        toast(t('review_thanks'));
        document.getElementById('rv-comment').value = '';
        starInput.dataset.value = 0;
        starInput.querySelectorAll('span').forEach((x) => x.classList.remove('lit'));
        product = await api('/products?id=' + encodeURIComponent(id));
        loadReviews();
      } catch (e) { err.textContent = e.message; }
    });

    load();
    document.addEventListener("cb-offers", () => { if (product) load(); });
  </script>
</body>
</html>
