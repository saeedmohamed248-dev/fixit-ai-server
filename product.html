<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المنتج | بافاريا بارتس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container" id="product-container">
      <div class="spinner">جاري التحميل...</div>
    </div>

    <div class="container section" id="reviews-section" style="display: none; padding-bottom: 0;">
      <div class="section-head"><h2>التقييمات والمراجعات ⭐</h2></div>
      <div class="cart-layout">
        <div id="reviews-list"></div>
        <div class="summary">
          <h3>قيّم المنتج</h3>
          <div class="star-input" id="star-input" data-value="0">
            <span data-star="1">★</span><span data-star="2">★</span><span data-star="3">★</span><span data-star="4">★</span><span data-star="5">★</span>
          </div>
          <div><label>اسمك</label><input id="rv-name"></div>
          <div><label>رأيك في القطعة (اختياري)</label><textarea id="rv-comment" rows="3"></textarea></div>
          <button class="btn" id="rv-submit">إرسال التقييم</button>
          <div id="rv-error" style="color: var(--red); font-size: 14px;"></div>
        </div>
      </div>
    </div>

    <div class="container section" id="related-section" style="display: none; padding-bottom: 0;">
      <div class="section-head"><h2>قطع مشابهة</h2></div>
      <div class="products-grid" id="related-grid"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script>
    renderLayout('shop');
    const container = document.getElementById('product-container');
    const id = new URLSearchParams(location.search).get('id');
    let product = null;

    function galleryHtml(p) {
      const images = [p.image, ...(p.images || [])].filter(Boolean);
      if (images.length === 0) return `<div class="product-img-box">${productImage(p)}</div>`;
      return `
      <div>
        <div class="product-img-box"><img class="card-img" id="main-img" src="${esc(images[0])}" alt="${esc(p.name)}"></div>
        ${images.length > 1 ? `<div class="gallery-thumbs">
          ${images.map((src, i) => `<img src="${esc(src)}" class="${i === 0 ? 'active' : ''}" data-src="${esc(src)}" alt="">`).join('')}
        </div>` : ''}
      </div>`;
    }

    async function load() {
      if (!id) {
        container.innerHTML = '<div class="empty-state"><span class="icon">❓</span>المنتج غير موجود</div>';
        return;
      }
      try {
        const p = product = await api('/products?id=' + encodeURIComponent(id));
        document.title = p.name + ' | ' + SITE.name;
        pushRecent(p.id);
        const out = p.stock <= 0;
        const wished = inWishlist(p.id);
        container.innerHTML = `
        <div class="product-layout">
          ${galleryHtml(p)}
          <div class="product-info">
            <div class="card-badges">${conditionBadge(p)} <span class="badge badge-brand">${esc(p.brand)}</span>
              ${(p.sold || 0) >= 5 ? '<span class="badge badge-new">🔥 الأكثر مبيعاً</span>' : ''}</div>
            <h1>${esc(p.name)}</h1>
            ${p.ratingCount ? `<div>${starsHtml(p.ratingAvg, p.ratingCount)}</div>` : ''}
            <div>
              ${p.oldPrice > p.price ? `<span class="old-price">${money(p.oldPrice)}</span>` : ''}
              <span class="price">${money(p.price)}</span>
            </div>
            <table class="meta-table">
              <tr><td>رقم القطعة (SKU)</td><td>${esc(p.sku) || '—'}</td></tr>
              <tr><td>رقم OEM</td><td dir="ltr" style="text-align: right;">${esc(p.oem) || '—'}</td></tr>
              <tr><td>الحالة</td><td>${p.condition === 'used' ? 'مستعمل وارد (مفحوص)' : 'جديد'}</td></tr>
              <tr><td>يناسب موديلات</td><td>${p.models.map((m) => `<span class="model-chip">${esc(m)}</span>`).join('')}</td></tr>
              <tr><td>المتوفر</td><td>${out ? '<span style="color: var(--red);">نفذت الكمية</span>' : p.stock <= 2 ? `<span style="color: var(--amber);">باقي ${p.stock} بس — الحق اطلبها!</span>` : p.stock + ' قطعة'}</td></tr>
            </table>
            <p style="color: var(--muted);">${esc(p.description)}</p>
            ${out ? `
              <a class="btn btn-green" style="margin-top: 18px;" target="_blank" rel="noopener"
                 href="${waLink('السلام عليكم، عايز أحجز قطعة "' + p.name + '" (' + p.sku + ') لما تتوفر')}">
                 نفذت الكمية — احجزها واتساب 💬</a>
            ` : `
              <div class="qty-row">
                <label style="margin: 0;">الكمية:</label>
                <input type="number" id="qty" value="1" min="1" max="${p.stock}">
              </div>
              <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn" id="add-cart">🛒 أضف للسلة</button>
                <button class="btn btn-outline" id="wish-btn">${wished ? '❤️ في المفضلة' : '🤍 أضف للمفضلة'}</button>
                <a class="btn btn-green" target="_blank" rel="noopener"
                   href="${waLink('السلام عليكم، عايز أسأل عن "' + p.name + '" (' + p.sku + ')')}">اسأل واتساب 💬</a>
              </div>
            `}
          </div>
        </div>`;

        // معرض الصور
        container.querySelectorAll('.gallery-thumbs img').forEach((thumb) => {
          thumb.addEventListener('click', () => {
            document.getElementById('main-img').src = thumb.dataset.src;
            container.querySelectorAll('.gallery-thumbs img').forEach((t) => t.classList.remove('active'));
            thumb.classList.add('active');
          });
        });

        const addBtn = document.getElementById('add-cart');
        if (addBtn) addBtn.addEventListener('click', () => {
          const qty = Math.max(1, Math.min(p.stock, Number(document.getElementById('qty').value) || 1));
          addToCart(p.id, qty);
        });
        const wishBtn = document.getElementById('wish-btn');
        if (wishBtn) wishBtn.addEventListener('click', () => {
          const nowIn = toggleWishlist(p.id);
          wishBtn.textContent = nowIn ? '❤️ في المفضلة' : '🤍 أضف للمفضلة';
        });

        loadReviews();

        // منتجات مشابهة من نفس الفئة
        const related = (await api('/products?category=' + encodeURIComponent(p.category)))
          .filter((r) => r.id !== p.id).slice(0, 4);
        if (related.length) {
          document.getElementById('related-section').style.display = '';
          document.getElementById('related-grid').innerHTML = related.map(productCard).join('');
        }
      } catch (e) {
        container.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span>${esc(e.message)}</div>`;
      }
    }

    /* ---------- المراجعات ---------- */
    async function loadReviews() {
      document.getElementById('reviews-section').style.display = '';
      const list = document.getElementById('reviews-list');
      try {
        const reviews = await api('/reviews?productId=' + encodeURIComponent(id));
        const avg = product.ratingAvg || 0;
        list.innerHTML = (reviews.length ? `
          <div class="rating-summary">
            <span class="big">${avg}</span>
            <div>${starsHtml(avg, reviews.length)}<br><small style="color: var(--muted);">بناءً على ${reviews.length} تقييم</small></div>
          </div>` : '<p style="color: var(--muted); margin-bottom: 14px;">لسه مفيش تقييمات — كن أول من يقيّم القطعة دي!</p>')
          + reviews.map((r) => `
          <div class="review-item">
            <div class="review-head">
              <b>${esc(r.name)}</b>
              ${r.verified ? '<span class="verified-badge">✓ عميل مسجّل</span>' : ''}
              <span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
              <span class="review-date">${new Date(r.createdAt).toLocaleDateString('ar-EG')}</span>
            </div>
            ${r.comment ? `<p>${esc(r.comment)}</p>` : ''}
          </div>`).join('');
      } catch {
        list.innerHTML = '';
      }
    }

    // نجوم الإدخال
    const starInput = document.getElementById('star-input');
    starInput.querySelectorAll('span').forEach((s) => {
      s.addEventListener('click', () => {
        const val = Number(s.dataset.star);
        starInput.dataset.value = val;
        starInput.querySelectorAll('span').forEach((x) =>
          x.classList.toggle('lit', Number(x.dataset.star) <= val));
      });
    });
    // لو العميل مسجّل، حط اسمه تلقائياً
    if (currentUser()) document.getElementById('rv-name').value = currentUser().name;

    document.getElementById('rv-submit').addEventListener('click', async () => {
      const err = document.getElementById('rv-error');
      err.textContent = '';
      try {
        await api('/reviews', {
          method: 'POST',
          headers: userHeaders(),
          body: JSON.stringify({
            productId: id,
            rating: Number(starInput.dataset.value),
            name: document.getElementById('rv-name').value.trim(),
            comment: document.getElementById('rv-comment').value.trim(),
          }),
        });
        toast('شكراً على تقييمك ⭐');
        document.getElementById('rv-comment').value = '';
        starInput.dataset.value = 0;
        starInput.querySelectorAll('span').forEach((x) => x.classList.remove('lit'));
        product = await api('/products?id=' + encodeURIComponent(id));
        loadReviews();
      } catch (e) { err.textContent = e.message; }
    });

    load();
  </script>
</body>
</html>
