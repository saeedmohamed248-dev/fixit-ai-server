<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>لوحة التحكم | FixIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#101828">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
  <div id="admin-container"></div>

  <!-- نافذة إضافة/تعديل منتج -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal">
      <h3 id="modal-title">إضافة منتج</h3>
      <div class="form-grid">
        <div><label>اسم المنتج (عربي) *</label><input id="m-name"></div>
        <div><label>الاسم بالإنجليزي</label><input id="m-nameEn" dir="ltr"></div>
        <div><label>SKU (رقم القطعة عندك)</label><input id="m-sku" dir="ltr"></div>
        <div><label>رقم OEM</label><input id="m-oem" dir="ltr"></div>
        <div><label>الماركة</label>
          <select id="m-brand"><option>BMW</option><option>MINI</option></select></div>
        <div><label>الحالة</label>
          <select id="m-condition"><option value="new">جديد</option><option value="used">مستعمل وارد</option></select></div>
        <div><label>الفئة</label>
          <select id="m-category">
            <option>فرامل</option><option>فلاتر وصيانة</option><option>عفشة وتعليق</option>
            <option>كهرباء وإشعال</option><option>تبريد</option><option>وقود</option>
            <option>هيكل وإكسسوارات</option><option>أخرى</option>
          </select></div>
        <div><label>الموديلات (مفصولة بفاصلة: F30, F10)</label><input id="m-models" dir="ltr"></div>
        <div><label>السعر (ج.م) *</label><input id="m-price" type="number" min="0"></div>
        <div><label>السعر قبل الخصم (اختياري)</label><input id="m-oldPrice" type="number" min="0"></div>
        <div><label>🇦🇪 سعر الجملة (درهم) — فرع الإمارات</label><input id="m-wholesalePrice" type="number" min="0" step="0.01" placeholder="سعر الجملة بالدرهم"></div>
        <div><label>📦 الطول (سم)</label><input id="m-lengthCm" type="number" min="0" step="0.1" placeholder="بالتغليف"></div>
        <div><label>📦 العرض (سم)</label><input id="m-widthCm" type="number" min="0" step="0.1"></div>
        <div><label>📦 الارتفاع (سم)</label><input id="m-heightCm" type="number" min="0" step="0.1"></div>
        <div><label>⚖️ الوزن (كجم)</label><input id="m-weightKg" type="number" min="0" step="0.1" placeholder="للشحن الدولي"></div>
        <div><label>🛃 نسبة الجمرك (%) — لكل قطعة</label><input id="m-customsPct" type="number" min="0" max="100" step="0.5" placeholder="مثلاً 40"></div>
        <div class="full"><button type="button" class="btn btn-outline btn-sm" id="m-estimate">🤖 قدّر الأبعاد والوزن بالذكاء الاصطناعي</button>
          <button type="button" class="btn btn-outline btn-sm" id="m-describe" style="margin-inline-start:8px;">🤖 اكتب الاسم الإنجليزي والوصف</button>
          <span id="m-estimate-status" class="upload-status"></span></div>
        <div class="full"><label>🚚 ملاحظة التوصيل/الوصول (بتظهر للتاجر)</label><input id="m-deliveryNote" placeholder="مثال: يوصل مصر خلال شهر و10 أيام"></div>
        <div class="full"><label>🚚 ملاحظة التوصيل بالإنجليزي (اختياري)</label><input id="m-deliveryNoteEn" dir="ltr" placeholder="e.g. Arrives to Egypt in ~40 days"></div>
        <div><label>الكمية المتاحة</label><input id="m-stock" type="number" min="0" value="1"></div>
        <div class="full"><label>📷 صورة المنتج الرئيسية</label>
          <div class="upload-row">
            <button type="button" class="btn btn-outline btn-sm" id="m-image-btn">اختر صورة من جهازك</button>
            <input type="file" id="m-image-file" accept="image/*" hidden>
            <span id="m-image-status" class="upload-status"></span>
          </div>
          <input id="m-image" dir="ltr" placeholder="أو الصق رابط صورة https://..." style="margin-top:8px;">
          <div id="m-image-preview" class="upload-preview"></div>
        </div>
        <div class="full"><label>📷 صور إضافية للمنتج</label>
          <div class="upload-row">
            <button type="button" class="btn btn-outline btn-sm" id="m-images-btn">اختر صور (أكتر من واحدة)</button>
            <input type="file" id="m-images-file" accept="image/*" multiple hidden>
            <span id="m-images-status" class="upload-status"></span>
          </div>
          <textarea id="m-images" dir="ltr" rows="2" placeholder="روابط الصور الإضافية — رابط في كل سطر" style="margin-top:8px;"></textarea>
          <div id="m-images-preview" class="upload-preview"></div>
        </div>
        <div class="full"><label>الوصف (عربي)</label><textarea id="m-description" rows="3"></textarea></div>
        <div class="full"><label>الوصف بالإنجليزي</label><textarea id="m-descriptionEn" dir="ltr" rows="3"></textarea></div>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 18px;">
        <button class="btn" id="modal-save">حفظ</button>
        <button class="btn btn-outline" onclick="document.getElementById('product-modal').classList.remove('open')">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة تفاصيل الطلب -->
  <div class="modal-overlay" id="order-modal">
    <div class="modal" id="order-modal-body"></div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script>
    // لوحة التحكم دايماً بالثيم الفاتح النظيف (مش سكين الجملة الداكن)
    document.documentElement.dataset.mode = 'retail';
    const container = document.getElementById('admin-container');

    // 🛍️ خريطة الأقسام: المفتاح ← الأيقونة + الاسم (على طراز Shopify)
    const NAV = [
      { tab: 'dashboard', ic: '🏠', label: 'نظرة عامة' },
      { tab: 'orders', ic: '📦', label: 'الطلبات' },
      { tab: 'products', ic: '🔧', label: 'المنتجات والمخزون' },
      { tab: 'customers', ic: '👥', label: 'العملاء' },
      { tab: 'coupons', ic: '🎟️', label: 'خصومات وهدايا' },
      { tab: 'analytics', ic: '📈', label: 'التحليلات والزيارات' },
      { sep: true },
      { tab: 'requests', ic: '🔎', label: 'طلبات القطع' },
      { tab: 'questions', ic: '❓', label: 'الأسئلة' },
      { tab: 'alerts', ic: '🔔', label: 'تنبيهات الوصول' },
      { tab: 'maintenance', ic: '🛠️', label: 'الصيانة' },
      { tab: 'containers', ic: '🧩', label: 'حاويات الشحن' },
      { sep: true },
      { tab: 'activity', ic: '📝', label: 'سجل العمليات' },
      { tab: 'sync', ic: '🔄', label: 'المزامنة' },
      { tab: 'settings', ic: '⚙️', label: 'إعدادات المتجر' },
    ];
    const NAV_LABEL = Object.fromEntries(NAV.filter((n) => n.tab).map((n) => [n.tab, n.label]));
    const STATUS_AR = { new: '🆕 جديد', confirmed: '✅ مؤكد', shipped: '🚚 تم الشحن', delivered: '📦 تم التسليم', cancelled: '❌ ملغي' };
    const PAY_AR = { cod: '💵 عند الاستلام', instapay: '🏦 انستاباي', wallet: '📱 محفظة', card: '💳 بطاقة' };
    const ACT_ICONS = { order: '🛒', status: '📦', product: '🔧', coupon: '🎟️', gift: '🎁', settings: '⚙️', sync: '🔄', request: '🔎', question: '❓', notify: '🔔', credit: '💳', maintenance: '🔧' };
    let products = [];
    let ordersCache = [];
    let customersCache = [];
    let editingId = null;

    // دخول سريع بالرابط: /admin.html?token=XXX
    const _urlToken = new URLSearchParams(location.search).get('token');
    if (_urlToken) {
      localStorage.setItem('admin_token', _urlToken);
      history.replaceState(null, '', location.pathname + location.hash);
    }

    function token() { return localStorage.getItem('admin_token') || ''; }
    function authHeaders() { return { Authorization: 'Bearer ' + token() }; }

    /* ---------- شاشة الدخول ---------- */
    function showLogin(msg = '') {
      container.innerHTML = `
      <div class="login-box">
        <h2>🔐 لوحة التحكم</h2>
        ${msg ? `<div class="note">${esc(msg)}</div>` : ''}
        <input type="password" id="login-token" placeholder="رمز الدخول (ADMIN_TOKEN)">
        <button class="btn" style="width: 100%;" id="login-btn">دخول</button>
      </div>`;
      document.getElementById('login-btn').addEventListener('click', () => {
        const val = document.getElementById('login-token').value.trim();
        // هيدر HTTP بيقبل حروف Latin-1 فقط — نمنع العربي/الإيموجي برسالة واضحة
        if (!/^[\x20-\x7E]+$/.test(val)) {
          return showLogin('رمز الدخول لازم يكون حروف وأرقام إنجليزية فقط (من غير عربي أو رموز غريبة). عدّل قيمة ADMIN_TOKEN في Vercel لتبقى إنجليزية.');
        }
        localStorage.setItem('admin_token', val);
        init();
      });
    }

    /* ---------- الهيكل الرئيسي ---------- */
    async function init() {
      if (!token()) return showLogin();
      container.innerHTML = '<div class="spinner">جاري التحقق...</div>';
      try {
        ordersCache = await api('/orders', { headers: authHeaders() });
      } catch (e) {
        localStorage.removeItem('admin_token');
        return showLogin(e.message);
      }
      const newOrdersCount = ordersCache.filter((o) => o.status === 'new').length;
      const navHtml = NAV.map((n) => n.sep
        ? '<div class="sh-nav-sep"></div>'
        : `<button class="sh-nav-item" data-tab="${n.tab}"><span class="ic">${n.ic}</span><span>${n.label}</span>${
            n.tab === 'orders' && newOrdersCount ? `<span class="badge" id="nav-orders-badge">${newOrdersCount}</span>` : ''
          }</button>`).join('');
      container.innerHTML = `
      <div class="sh-admin" id="sh-admin">
        <div class="sh-scrim" id="sh-scrim"></div>
        <aside class="sh-sidebar" id="sh-sidebar">
          <div class="sh-brand">
            <img src="/assets/fixit-logo-square.png" alt="FixIt">
            <div><b>FixIt</b><small>لوحة التحكم</small></div>
          </div>
          <nav class="sh-nav" id="sh-nav">${navHtml}</nav>
          <div class="sh-nav-sep"></div>
          <div class="sh-side-foot">
            <a href="/index.html" target="_blank">🛍️ عرض المتجر ↗</a>
            <button id="logout">🚪 تسجيل خروج</button>
          </div>
        </aside>
        <div class="sh-main">
          <header class="sh-topbar">
            <button class="sh-menu-btn" id="sh-menu">☰</button>
            <div class="sh-topbar-title" id="sh-title">نظرة عامة</div>
            <div class="sh-topbar-actions">
              <a class="btn btn-outline btn-sm" href="/index.html" target="_blank">عرض المتجر ↗</a>
            </div>
          </header>
          <main class="sh-content"><div id="tab-content"></div></main>
        </div>
      </div>`;

      const shAdmin = document.getElementById('sh-admin');
      const closeNav = () => shAdmin.classList.remove('nav-open');
      document.getElementById('sh-menu').addEventListener('click', () => shAdmin.classList.toggle('nav-open'));
      document.getElementById('sh-scrim').addEventListener('click', closeNav);
      document.getElementById('logout').addEventListener('click', () => {
        localStorage.removeItem('admin_token');
        showLogin();
      });

      function selectTab(tab) {
        container.querySelectorAll('.sh-nav-item').forEach((x) => x.classList.toggle('active', x.dataset.tab === tab));
        const label = NAV_LABEL[tab] || 'لوحة التحكم';
        document.getElementById('sh-title').textContent = label;
        document.title = label + ' | FixIt';
        if (location.hash.replace('#', '') !== tab) history.replaceState(null, '', '#' + tab);
        closeNav();
        showTab(tab);
      }
      container.querySelectorAll('.sh-nav-item').forEach((b) => {
        b.addEventListener('click', () => selectTab(b.dataset.tab));
      });
      // فتح قسم معين من الرابط: /admin.html#orders أو #settings ...
      const hashTab = location.hash.replace('#', '');
      selectTab(NAV_LABEL[hashTab] ? hashTab : 'dashboard');
    }

    function showTab(tab) {
      const fns = { dashboard: loadDashboard, analytics: loadAnalytics, orders: loadOrders, requests: loadRequests, questions: loadQuestions, products: loadProducts, coupons: loadCoupons, customers: loadCustomers, maintenance: loadMaintenance, containers: loadContainers, alerts: loadAlerts, activity: loadActivity, settings: loadSettings, sync: showSync };
      fns[tab]?.();
    }

    /* ==================== 📊 نظرة عامة ==================== */
    async function loadDashboard() {
      const box = document.getElementById('tab-content');
      box.innerHTML = '<div class="spinner">جاري التحميل...</div>';
      try {
        const [orders, prods, customers] = await Promise.all([
          api('/orders', { headers: authHeaders() }),
          api('/products'),
          api('/auth?action=customers', { headers: authHeaders() }).catch(() => []),
        ]);
        ordersCache = orders;
        const active = orders.filter((o) => o.status !== 'cancelled');
        const sales = active.reduce((s, o) => s + o.total, 0);
        const newOrders = orders.filter((o) => o.status === 'new').length;
        const lowStock = prods.filter((p) => p.stock <= 2);
        const topSold = [...prods].sort((a, b) => (b.sold || 0) - (a.sold || 0)).slice(0, 5).filter((p) => p.sold);

        // مبيعات آخر 7 أيام
        const days = Array.from({ length: 7 }, (_, i) => {
          const d = new Date(); d.setDate(d.getDate() - (6 - i));
          const key = d.toISOString().slice(0, 10);
          const total = active.filter((o) => o.createdAt.slice(0, 10) === key).reduce((s, o) => s + o.total, 0);
          return { label: d.toLocaleDateString('ar-EG', { weekday: 'short' }), total };
        });
        const maxDay = Math.max(...days.map((d) => d.total), 1);

        box.innerHTML = `
        <div class="stats-grid">
          <div class="stat-card"><div class="label">💰 إجمالي المبيعات</div><div class="value">${money(sales)}</div></div>
          <div class="stat-card"><div class="label">📦 عدد الطلبات</div><div class="value">${orders.length}</div></div>
          <div class="stat-card"><div class="label">🆕 طلبات تحتاج تأكيد</div><div class="value" style="color: var(--amber);">${newOrders}</div></div>
          <div class="stat-card"><div class="label">👥 عملاء مسجّلين</div><div class="value">${customers.length}</div></div>
          <div class="stat-card"><div class="label">🔧 المنتجات</div><div class="value">${prods.length}</div></div>
        </div>

        <div class="order-card" style="margin-bottom: 20px;">
          <h3 style="margin-bottom: 14px;">📈 مبيعات آخر ٧ أيام</h3>
          <div class="chart-bars">
            ${days.map((d) => `
              <div class="chart-col" title="${money(d.total)}">
                <div class="chart-val">${d.total ? money(d.total) : ''}</div>
                <div class="chart-bar" style="height: ${Math.max(4, (d.total / maxDay) * 120)}px;"></div>
                <small>${d.label}</small>
              </div>`).join('')}
          </div>
        </div>

        <div class="cart-layout">
          <div>
            <h3 style="margin-bottom: 12px;">🕐 أحدث الطلبات</h3>
            ${orders.slice(0, 5).map((o) => `
              <div class="order-card order-row" data-open-order="${esc(o.id)}" style="cursor: pointer;">
                <div class="head">
                  <b>${esc(o.number)}</b>
                  <span class="status-pill st-${esc(o.status)}">${STATUS_AR[o.status]}</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 14px;">
                  <span>${esc(o.customer.name)}</span><b>${money(o.total)}</b>
                </div>
              </div>`).join('') || '<p style="color: var(--muted);">لسه مفيش طلبات</p>'}
          </div>
          <div>
            <h3 style="margin-bottom: 12px;">⭐ الأكثر مبيعاً</h3>
            ${topSold.length ? `<div class="table-wrap"><table class="table" style="min-width: auto;">
              <tr><th>المنتج</th><th>مبيعات</th><th>المخزون</th></tr>
              ${topSold.map((p) => `<tr><td>${esc(p.name)}</td><td>${p.sold}</td><td>${p.stock}</td></tr>`).join('')}
            </table></div>` : '<p style="color: var(--muted);">لسه مفيش مبيعات كافية</p>'}
            <h3 style="margin: 18px 0 12px;">⚠️ مخزون منخفض</h3>
            ${lowStock.length ? `<div class="table-wrap"><table class="table" style="min-width: auto;">
              <tr><th>المنتج</th><th>المتبقي</th></tr>
              ${lowStock.map((p) => `<tr><td>${esc(p.name)}</td><td style="color: var(--red); font-weight: 700;">${p.stock}</td></tr>`).join('')}
            </table></div>` : '<p style="color: var(--muted);">كل المخزون تمام ✓</p>'}
          </div>
        </div>`;
        bindOrderRows(box);
      } catch (e) {
        box.innerHTML = `<div class="note">${esc(e.message)}</div>`;
      }
    }

    /* ==================== 📦 الطلبات ==================== */
    async function loadOrders() {
      const box = document.getElementById('tab-content');
      box.innerHTML = '<div class="spinner">جاري التحميل...</div>';
      try {
        ordersCache = await api('/orders', { headers: authHeaders() });
        if (ordersCache.length === 0) {
          box.innerHTML = '<div class="empty-state"><span class="icon">📭</span>لا توجد طلبات بعد</div>';
          return;
        }
        const rowHtml = (o) => `<tr class="order-row" data-open-order="${esc(o.id)}" style="cursor: pointer;">
            <td><b>${esc(o.number)}</b>${o.coupon ? `<br><small style="color: var(--green);">🎟️ ${esc(o.coupon)}</small>` : ''}</td>
            <td>${new Date(o.createdAt).toLocaleDateString('ar-EG')}</td>
            <td>${esc(o.customer.name)}<br><small style="color: var(--muted);" dir="ltr">${esc(o.customer.phone)}</small></td>
            <td>${o.items.length} قطعة</td>
            <td>${PAY_AR[o.payment] || '💵'}${o.paid ? '<br><span class="status-pill st-confirmed">✓ مدفوع</span>' : ''}</td>
            <td><b>${money(o.total)}</b></td>
            <td><span class="status-pill st-${esc(o.status)}">${STATUS_AR[o.status]}</span>
              ${o.returnRequest ? '<br><span class="status-pill st-cancelled" style="margin-top: 4px; display: inline-block;">↩️ إرجاع مطلوب</span>' : ''}</td>
          </tr>`;
        box.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;">
          <input id="orders-search" placeholder="🔍 ابحث برقم الطلب أو اسم العميل أو الموبايل..." style="max-width: 340px;">
          <button class="btn btn-outline btn-sm" id="export-csv">⬇️ تصدير Excel (CSV)</button>
        </div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>رقم الطلب</th><th>التاريخ</th><th>العميل</th><th>القطع</th><th>الدفع</th><th>الإجمالي</th><th>الحالة</th></tr></thead>
          <tbody id="orders-tbody">${ordersCache.map(rowHtml).join('')}</tbody>
        </table></div>`;
        bindOrderRows(box);

        document.getElementById('orders-search').addEventListener('input', (e) => {
          const term = e.target.value.trim().toLowerCase();
          const filtered = ordersCache.filter((o) =>
            [o.number, o.customer.name, o.customer.phone].join(' ').toLowerCase().includes(term));
          document.getElementById('orders-tbody').innerHTML = filtered.map(rowHtml).join('');
          bindOrderRows(box);
        });

        // تصدير الطلبات لملف Excel (CSV)
        document.getElementById('export-csv').addEventListener('click', () => {
          const rows = [['رقم الطلب', 'التاريخ', 'الحالة', 'العميل', 'الموبايل', 'المحافظة', 'العنوان', 'القطع', 'الدفع', 'الخصم', 'الإجمالي']];
          ordersCache.forEach((o) => rows.push([
            o.number, new Date(o.createdAt).toLocaleDateString('ar-EG'), STATUS_AR[o.status] || o.status,
            o.customer.name, o.customer.phone, o.customer.city, o.customer.address,
            o.items.map((i) => `${i.name} x${i.qty}`).join(' | '),
            PAY_AR[o.payment] || '', o.discount || 0, o.total,
          ]));
          const csv = '﻿' + rows.map((r) => r.map((c) => `"${String(c).replaceAll('"', '""')}"`).join(',')).join('\n');
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
          a.download = `fixit-orders-${new Date().toISOString().slice(0, 10)}.csv`;
          a.click();
        });
      } catch (e) {
        box.innerHTML = `<div class="note">${esc(e.message)}</div>`;
      }
    }

    /* ==================== 🔎 طلبات القطع ==================== */
    const REQ_STATUS = { open: '🟠 جديد', sourced: '🔵 اتوفّرت', done: '✅ اتقفل' };
    async function loadRequests() {
      const box = document.getElementById('tab-content');
      box.innerHTML = '<div class="spinner">جاري التحميل...</div>';

    /* ---------- 📷 رفع الصور المباشر (Cloudinary) ---------- */
    async function uploadToCloudinary(file) {
      const cfg = (window.SITE && SITE.cloudinary) || {};
      if (!cfg.cloudName || !cfg.uploadPreset) {
        throw new Error('رفع الصور مش مفعّل — اضبط بيانات Cloudinary في js/config.js');
      }
      const form = new FormData();
      form.append('file', file);
      form.append('upload_preset', cfg.uploadPreset);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${cfg.cloudName}/image/upload`, { method: 'POST', body: form });
      const data = await res.json();
      if (!data.secure_url) throw new Error(data.error?.message || 'فشل رفع الصورة');
      return data.secure_url;
    }

    function renderImgPreview(inputId, previewId) {
      const box = document.getElementById(previewId);
      const val = document.getElementById(inputId).value.trim();
      const urls = val.split('\n').map((s) => s.trim()).filter(Boolean);
      box.innerHTML = urls.map((u) => `<img src="${esc(u)}" alt="">`).join('');
    }

      <button class="btn btn-sm btn-danger" id="an-reset" style="margin-top:16px;">🗑️ تصفير كل الإحصائيات</button>`;

      document.getElementById('an-reset').addEventListener('click', async () => {
        if (!confirm('متأكد تصفّر كل بيانات الزيارات؟ مش هترجع.')) return;
        try { await api('/track', { method: 'DELETE', headers: authHeaders() }); toast('تم التصفير ✓'); loadAnalytics(); }
        catch (e) { toast('⚠️ ' + e.message); }
      });
    }

    /* ==================== 🧩 حاويات الشحن (Share a Container) ==================== */
    const CNT_STATUS = { open: 'مفتوحة', filling: 'بتتملّي', full: 'ممتلئة', sealed: 'مقفولة', shipped: 'اتشحنت', delivered: 'اتسلّمت' };
    async function loadContainers() {
      const box = document.getElementById('tab-content');
      box.innerHTML = '<div class="spinner">جاري التحميل...</div>';
      const cts = (typeof containerList === 'function' ? containerList() : []);
      const lanes = (window.SITE && SITE.wholesale && SITE.wholesale.freight && SITE.wholesale.freight.lanes) || {};
      let list = [];
      try { list = await api('/containers', { headers: authHeaders() }); } catch (e) { box.innerHTML = `<div class="note">${esc(e.message)}</div>`; return; }

      box.innerHTML = `
      <div class="card" style="margin-bottom:18px;">
        <h3 style="margin-bottom:10px;">🚢 حاوية جديدة للمشاركة</h3>
        <div class="form-grid">
          <div><label>المرجع</label><input id="c-ref" placeholder="تلقائي لو فاضي"></div>
          <div><label>الوجهة (كود)</label><select id="c-lane">${Object.keys(lanes).map((k) => `<option value="${k}">${k}</option>`).join('') || '<option value="DEFAULT">DEFAULT</option>'}</select></div>
          <div><label>الميناء</label><input id="c-port" placeholder="الإسكندرية..."></div>
          <div><label>نوع الحاوية</label><select id="c-type">${cts.map((c) => `<option value="${c.code}" data-cap="${c.usableCbm}">${c.nameAr} (${c.usableCbm} م³)</option>`).join('') || '<option value="40HC" data-cap="68">40HC (68 م³)</option>'}</select></div>
          <div><label>السعة (م³)</label><input id="c-cap" type="number" step="0.1" value="${cts[0]?.usableCbm || 68}"></div>
          <div><label>سعر الحاوية كاملة ($) — شامل الهامش</label><input id="c-freight" type="number" step="1" placeholder="مثلاً 2500"></div>
          <div><label>تاريخ الإقفال</label><input id="c-cutoff" type="date"></div>
          <div><label>تاريخ الإقلاع (ETD)</label><input id="c-etd" type="date"></div>
        </div>
        <button class="btn btn-sm" id="c-create" style="margin-top:12px;">➕ إنشاء حاوية</button>
      </div>
      ${list.length ? list.map(cntCard).join('') : '<div class="empty-state"><span class="icon">🧩</span>مفيش حاويات لسه — أنشئ واحدة فوق عشان التجار يشاركوا فيها</div>'}`;

      // نوع الحاوية يملأ السعة تلقائياً
      const typeSel = document.getElementById('c-type');
      typeSel?.addEventListener('change', () => {
        const cap = typeSel.selectedOptions[0]?.dataset.cap;
        if (cap) document.getElementById('c-cap').value = cap;
      });

      document.getElementById('c-create').addEventListener('click', async () => {
        const laneCode = document.getElementById('c-lane').value;
        const body = {
          ref: document.getElementById('c-ref').value.trim(),
          laneCode,
          port: document.getElementById('c-port').value.trim() || (lanes[laneCode]?.port || ''),
          containerCode: typeSel.value,
          containerName: typeSel.selectedOptions[0]?.textContent.split(' (')[0] || typeSel.value,
          capacityCbm: Number(document.getElementById('c-cap').value) || 0,
          baseFreightUsd: Number(document.getElementById('c-freight').value) || 0,
          cutoffDate: document.getElementById('c-cutoff').value,
          etd: document.getElementById('c-etd').value,
        };
        if (!body.capacityCbm || !body.baseFreightUsd) return toast('⚠️ السعة وسعر الحاوية مطلوبين');
        try {
          await api('/containers', { method: 'POST', headers: authHeaders(), body: JSON.stringify(body) });
          toast('تم إنشاء الحاوية ✓');
          loadContainers();
        } catch (e) { toast('⚠️ ' + e.message); }
      });

      box.querySelectorAll('[data-cnt-status]').forEach((sel) =>
        sel.addEventListener('change', async () => {
          try { await api('/containers', { method: 'PUT', headers: authHeaders(), body: JSON.stringify({ id: sel.dataset.cntStatus, status: sel.value }) }); toast('تم التحديث ✓'); }
          catch (e) { toast('⚠️ ' + e.message); }
        }));
      box.querySelectorAll('[data-cnt-del]').forEach((b) =>
        b.addEventListener('click', async () => {
          if (!confirm('حذف الحاوية وكل حجوزاتها؟')) return;
          try { await api('/containers?id=' + encodeURIComponent(b.dataset.cntDel), { method: 'DELETE', headers: authHeaders() }); loadContainers(); }
          catch (e) { toast('⚠️ ' + e.message); }
        }));
    }

    function cntCard(s) {
      const pct = Math.min(100, Math.round(s.bookedCbm / s.capacityCbm * 100));
      const bookings = s.bookings || [];
      return `
      <div class="card" style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div><b>${esc(s.ref)}</b> — 🚢 ${esc(s.port || s.laneCode)} · ${esc(s.containerName || s.containerCode)}<br>
            <small class="muted">السعة ${s.capacityCbm} م³ · محجوز ${s.bookedCbm} م³ (${pct}%) · سعر الحاوية $${s.baseFreightUsd}</small></div>
          <div style="display:flex;gap:8px;align-items:center;">
            <select data-cnt-status="${esc(s.id)}">${Object.entries(CNT_STATUS).map(([k, v]) => `<option value="${k}" ${s.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
            <button class="btn btn-sm btn-danger" data-cnt-del="${esc(s.id)}">🗑️</button>
          </div>
        </div>
        <div style="height:20px;border-radius:8px;background:#eee;overflow:hidden;margin:10px 0;">
          <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--accent-dark),var(--accent));"></div>
        </div>
        ${bookings.length ? `<table class="table" style="margin-top:6px;">
          <tr><th>التاجر</th><th>الدولة</th><th>م³</th><th>الحصة ($)</th><th>موبايل</th></tr>
          ${bookings.map((b) => `<tr>
            <td>${esc(b.company || b.name)}</td><td>${esc(b.country) || '—'}</td>
            <td>${b.cbm}</td><td><b>$${b.shareUsd}</b></td>
            <td dir="ltr"><a class="btn btn-sm btn-green" target="_blank" rel="noopener" href="https://wa.me/${esc(String(b.phone).replace(/[^\d]/g,''))}">💬 ${esc(b.phone)}</a></td>
          </tr>`).join('')}
        </table>` : '<small class="muted">مفيش حجوزات لسه</small>'}
      </div>`;
    }

    /* ==================== 🔔 تنبيهات الوصول (مشتركين) ==================== */
    async function loadAlerts() {
      const box = document.getElementById('tab-content');
      box.innerHTML = '<div class="spinner">جاري التحميل...</div>';
      let list = [];
      try { list = await api('/alerts', { headers: authHeaders() }); } catch (e) { box.innerHTML = `<div class="note">${esc(e.message)}</div>`; return; }
      if (!list.length) { box.innerHTML = '<div class="empty-state"><span class="icon">🔔</span>مفيش مشتركين في التنبيهات لسه — التجار بيشتركوا من مكتب التجارة عشان توصلهم الوصولات الجديدة</div>'; return; }
      box.innerHTML = `
        <p style="color:var(--muted);font-size:14px;margin-bottom:12px;">${list.length} تاجر مشترك — ابعتلهم على واتساب أول ما يوصل اللي بيدوّروا عليه 💪</p>
        <div class="table-wrap"><table class="table">
          <tr><th>التاجر</th><th>بيدوّر على</th><th>التاريخ</th><th></th><th></th></tr>
          ${list.map((a) => `<tr>
            <td>${esc(a.name)}<br><small dir="ltr" style="color:var(--muted);">${esc(a.phone)}</small></td>
            <td>${esc(a.interest) || '<span style="color:var(--muted);">كل الوصولات</span>'}</td>
            <td>${new Date(a.createdAt).toLocaleDateString('ar-EG')}</td>
            <td><a class="btn btn-sm btn-green" target="_blank" rel="noopener" href="https://wa.me/${esc(String(a.phone).replace(/[^\d]/g,''))}?text=${encodeURIComponent('أهلاً ' + a.name + ' 👋 وصلنا جديد في FixIt Trade!')}">💬 نبّه</a></td>
            <td><button class="btn btn-sm btn-danger" data-al-del="${esc(a.id)}">🗑️</button></td>
          </tr>`).join('')}
        </table></div>`;
      box.querySelectorAll('[data-al-del]').forEach((b) =>
        b.addEventListener('click', async () => {
          if (!confirm('حذف المشترك؟')) return;
          try { await api('/alerts?id=' + encodeURIComponent(b.dataset.alDel), { method: 'DELETE', headers: authHeaders() }); loadAlerts(); }
          catch (e) { toast('⚠️ ' + e.message); }
        }));
    }

    /* ==================== 📝 سجل العمليات ==================== */
    async function loadActivity() {
      const box = document.getElementById('tab-content');
      box.innerHTML = '<div class="spinner">جاري التحميل...</div>';
      try {
        const activity = await api('/activity', { headers: authHeaders() });
        box.innerHTML = activity.length ? `
        <p style="color: var(--muted); font-size: 14px; margin-bottom: 14px;">كل حاجة بتحصل في المتجر بتتسجل هنا تلقائياً — آخر ٣٠٠ عملية</p>
        ${activity.map((a) => `
          <div class="activity-item">
            <span class="act-icon">${ACT_ICONS[a.type] || '📌'}</span>
            <div style="flex: 1;">
              <div>${esc(a.message)}</div>
              <small style="color: var(--muted);">${new Date(a.at).toLocaleString('ar-EG')}</small>
            </div>
          </div>`).join('')}`
        : '<div class="empty-state"><span class="icon">📝</span>السجل فاضي لسه — أول ما يحصل أي عملية هتتسجل هنا</div>';
      } catch (e) {
        box.innerHTML = `<div class="note">${esc(e.message)}</div>`;
      }
    }

    /* ==================== ⚙️ إعدادات المتجر ==================== */
    const PRESET_COLORS = ['#f97316', '#e11d48', '#2563eb', '#16a34a', '#9333ea', '#0891b2', '#111827'];
    async function loadSettings() {
      const box = document.getElementById('tab-content');
      box.innerHTML = '<div class="spinner">جاري التحميل...</div>';
      try {
        const s = await api('/settings');
        box.innerHTML = `
        <div class="summary" style="max-width: 720px;">
          <h3>⚙️ إعدادات المتجر</h3>
          <p style="color: var(--muted); font-size: 13px;">التغييرات هنا بتنطبق على الموقع كله فوراً — من غير ما تلمس أي كود</p>

          <div class="form-grid">
            <div><label>اسم المتجر</label><input id="s-storeName" value="${esc(s.storeName || 'FixIt')}"></div>
            <div>
              <label>اللون الأساسي للموقع</label>
              <div style="display: flex; gap: 8px; align-items: center;">
                <input type="color" id="s-accent" value="${esc(s.accent || '#f97316')}" style="width: 60px; height: 42px; padding: 3px;">
                <div style="display: flex; gap: 5px;">
                  ${PRESET_COLORS.map((c) => `<span class="swatch" data-color="${c}" style="background: ${c};"></span>`).join('')}
                </div>
              </div>
            </div>
            <div><label>رقم الواتساب (بكود الدولة: 2010...)</label><input id="s-whatsapp" dir="ltr" value="${esc(s.whatsapp || SITE.whatsapp)}"></div>
            <div><label>الرقم المعروض في الموقع</label><input id="s-phoneDisplay" dir="ltr" value="${esc(s.phoneDisplay || SITE.phoneDisplay)}"></div>
            <div><label>رقم انستاباي</label><input id="s-instapay" dir="ltr" value="${esc(s.instapay || SITE.instapay)}"></div>
            <div><label>رقم المحفظة الإلكترونية</label><input id="s-wallet" dir="ltr" value="${esc(s.wallet || SITE.wallet)}"></div>
            <div><label>شحن مجاني فوق (ج.م) — اكتب 0 للإلغاء</label><input id="s-freeShippingOver" type="number" min="0" value="${s.freeShippingOver ?? SITE.freeShippingOver}"></div>
            <div></div>
            <div class="full"><label>رسالة الشريط العلوي (عربي) — سيبها فاضية للافتراضي</label><input id="s-topbarAr" value="${esc(s.topbarAr || '')}" placeholder="🚚 شحن لجميع المحافظات — مجاني فوق ٥٬٠٠٠ ج.م"></div>
            <div class="full"><label>رسالة الشريط العلوي (إنجليزي)</label><input id="s-topbarEn" dir="ltr" value="${esc(s.topbarEn || '')}" placeholder="🚚 Delivery all over Egypt"></div>
          </div>
          <button class="btn" id="s-save">💾 حفظ وتطبيق على الموقع</button>
        </div>`;

        box.querySelectorAll('.swatch').forEach((sw) =>
          sw.addEventListener('click', () => { document.getElementById('s-accent').value = sw.dataset.color; }));

        document.getElementById('s-save').addEventListener('click', async () => {
          try {
            const body = {};
            ['storeName', 'accent', 'whatsapp', 'phoneDisplay', 'instapay', 'wallet', 'freeShippingOver', 'topbarAr', 'topbarEn']
              .forEach((k) => { body[k] = document.getElementById('s-' + k).value.trim(); });
            const saved = await api('/settings', { method: 'PUT', headers: authHeaders(), body: JSON.stringify(body) });
            localStorage.setItem('site_settings', JSON.stringify(saved));
            applySettings(saved);
            toast('✅ الإعدادات اتحفظت واتطبقت على الموقع');
          } catch (e) { toast('⚠️ ' + e.message); }
        });
      } catch (e) {
        box.innerHTML = `<div class="note">${esc(e.message)}</div>`;
      }
    }

    /* ==================== 🔄 المزامنة ==================== */
    function showSync() {
      const base = location.origin;
      document.getElementById('tab-content').innerHTML = `
      <div style="max-width: 760px;">
        <h3 style="margin-bottom: 10px;">🔄 ربط المخزون مع نظام خارجي</h3>
        <p style="color: var(--muted); margin-bottom: 16px;">
          لو بتبيع من مكان تاني، ابعت إشعار للرابط ده لما قطعة تتباع وهيتخصم المخزون هنا تلقائياً.
          لازم الـ SKU يكون نفسه في النظامين. (فعّل متغير SYNC_SECRET في إعدادات Vercel الأول)
        </p>
        <label>خصم مخزون (لما قطعة تتباع برة):</label>
        <div class="code-block">POST ${base}/api/sync?secret=YOUR_SECRET
Content-Type: application/json

{ "sku": "BP-34116850568", "quantity": 1 }</div>
        <br>
        <label>سحب المخزون الحالي كله (للنظام الخارجي):</label>
        <div class="code-block">GET ${base}/api/sync?secret=YOUR_SECRET</div>
      </div>`;
    }

    init();
  </script>
</body>
</html>
