<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>السلة وإتمام الطلب | بافاريا بارتس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container" id="cart-container">
      <div class="spinner">جاري التحميل...</div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script>
    renderLayout('cart');
    const container = document.getElementById('cart-container');
    let products = [];
    let appliedCoupon = null; // { code, discount }

    async function load() {
      const cart = getCart();
      const ids = Object.keys(cart);
      if (ids.length === 0) {
        container.innerHTML = `<div class="empty-state"><span class="icon">🛒</span>
          السلة فارغة<br><br><a class="btn" href="/shop.html">تصفح المنتجات</a></div>`;
        return;
      }
      try {
        const all = await api('/products');
        products = all.filter((p) => ids.includes(p.id));
        render();
      } catch (e) {
        container.innerHTML = `<div class="spinner">${esc(e.message)}</div>`;
      }
    }

    function render() {
      const cart = getCart();
      const items = products.filter((p) => cart[p.id]);
      if (items.length === 0) return load();
      const subtotal = items.reduce((s, p) => s + p.price * cart[p.id], 0);
      const discount = appliedCoupon ? appliedCoupon.discount : 0;
      const total = subtotal - discount;
      const user = currentUser();
      const freeShip = SITE.freeShippingOver && total >= SITE.freeShippingOver;

      container.innerHTML = `
      <h1 style="margin-bottom: 20px;">السلة (${items.length})</h1>
      <div class="cart-layout">
        <div>
          ${items.map((p) => `
          <div class="cart-item">
            <a class="thumb" href="/product.html?id=${esc(p.id)}">${productImage(p, 'thumb-img')}</a>
            <div>
              <h4><a href="/product.html?id=${esc(p.id)}">${esc(p.name)}</a></h4>
              <div class="sub">${conditionBadge(p)} ${esc(p.sku)}</div>
              <div class="price" style="font-size: 15px;">${money(p.price)}</div>
            </div>
            <div class="actions">
              <input type="number" min="1" max="${p.stock}" value="${cart[p.id]}" data-qty="${esc(p.id)}">
              <button class="remove-link" data-remove="${esc(p.id)}">إزالة ✕</button>
            </div>
          </div>`).join('')}
        </div>

        <div class="summary">
          <h3>ملخص الطلب</h3>
          <div class="row"><span>الإجمالي</span><b>${money(subtotal)}</b></div>
          ${discount ? `<div class="row" style="color: var(--green);"><span>خصم (${esc(appliedCoupon.code)})</span><b>- ${money(discount)}</b></div>` : ''}
          <div class="row" style="color: var(--muted); font-size: 13px;">
            <span>الشحن</span><span>${freeShip ? '🎉 شحن مجاني' : 'يُحدد عند التأكيد'}</span>
          </div>
          <div class="row total"><span>المطلوب</span><span>${money(total)}</span></div>

          <div style="display: flex; gap: 8px;">
            <input id="c-coupon" placeholder="كود الخصم" value="${appliedCoupon ? esc(appliedCoupon.code) : ''}" ${appliedCoupon ? 'disabled' : ''}>
            <button class="btn btn-outline btn-sm" id="apply-coupon">${appliedCoupon ? 'إلغاء' : 'تطبيق'}</button>
          </div>

          <hr style="border-color: var(--line);">
          ${!user ? `<div class="note" style="margin: 0;">💡 عندك حساب؟ <a href="/account.html" style="color: var(--blue2);">سجّل دخول</a> عشان تتابع طلباتك</div>` : ''}
          <div><label>الاسم بالكامل *</label><input id="c-name" value="${user ? esc(user.name) : ''}"></div>
          <div><label>رقم الموبايل *</label><input id="c-phone" type="tel" dir="ltr" style="text-align: right;" placeholder="01xxxxxxxxx" value="${user ? esc(user.phone) : ''}"></div>
          <div><label>المحافظة</label><input id="c-city" placeholder="القاهرة"></div>
          <div><label>العنوان بالتفصيل *</label><textarea id="c-address" rows="2"></textarea></div>
          <div><label>ملاحظات (نوع العربية / سنة الموديل / رقم الشاسيه)</label><textarea id="c-notes" rows="2"></textarea></div>

          <div>
            <label>طريقة الدفع</label>
            <div class="pay-options">
              <label class="pay-option"><input type="radio" name="pay" value="cod" checked> 💵 الدفع عند الاستلام</label>
              <label class="pay-option"><input type="radio" name="pay" value="instapay"> 🏦 تحويل انستاباي</label>
              <label class="pay-option"><input type="radio" name="pay" value="wallet"> 📱 فودافون كاش / محفظة</label>
            </div>
          </div>

          <button class="btn" id="submit-order">تأكيد الطلب ✓</button>
          <div id="order-error" style="color: var(--red); font-size: 14px;"></div>
        </div>
      </div>`;

      container.querySelectorAll('[data-qty]').forEach((input) => {
        input.addEventListener('change', () => {
          const c = getCart();
          c[input.dataset.qty] = Math.max(1, Number(input.value) || 1);
          setCart(c);
          appliedCoupon = null;
          render();
        });
      });
      container.querySelectorAll('[data-remove]').forEach((btn) => {
        btn.addEventListener('click', () => { removeFromCart(btn.dataset.remove); appliedCoupon = null; render(); });
      });

      document.getElementById('apply-coupon').addEventListener('click', async () => {
        if (appliedCoupon) { appliedCoupon = null; return render(); }
        const code = document.getElementById('c-coupon').value.trim();
        if (!code) return;
        try {
          const data = await api('/coupons', {
            method: 'POST',
            body: JSON.stringify({ action: 'validate', code, subtotal }),
          });
          appliedCoupon = data;
          toast(`تم تطبيق الخصم: ${money(data.discount)} 🎉`);
          render();
        } catch (e) { toast('⚠️ ' + e.message); }
      });

      document.getElementById('submit-order').addEventListener('click', async (e) => {
        const btn = e.target;
        const errBox = document.getElementById('order-error');
        errBox.textContent = '';
        const customer = {
          name: document.getElementById('c-name').value.trim(),
          phone: document.getElementById('c-phone').value.trim(),
          city: document.getElementById('c-city').value.trim(),
          address: document.getElementById('c-address').value.trim(),
        };
        if (!customer.name || !customer.phone || !customer.address) {
          errBox.textContent = 'من فضلك اكتب الاسم ورقم الموبايل والعنوان';
          return;
        }
        btn.disabled = true;
        btn.textContent = 'جاري إرسال الطلب...';
        try {
          const c = getCart();
          const order = await api('/orders', {
            method: 'POST',
            headers: userHeaders(),
            body: JSON.stringify({
              customer,
              notes: document.getElementById('c-notes').value.trim(),
              payment: document.querySelector('input[name="pay"]:checked').value,
              coupon: appliedCoupon ? appliedCoupon.code : '',
              items: Object.entries(c).map(([id, qty]) => ({ id, qty })),
            }),
          });
          setCart({});
          showSuccess(order);
        } catch (err) {
          errBox.textContent = err.message;
          btn.disabled = false;
          btn.textContent = 'تأكيد الطلب ✓';
        }
      });
    }

    function showSuccess(order) {
      const lines = order.items.map((i) => `• ${i.name} × ${i.qty}`).join('\n');
      const payLabel = { cod: 'دفع عند الاستلام', instapay: 'انستاباي', wallet: 'محفظة إلكترونية' }[order.payment];
      const waText = `طلب جديد من الموقع 🛒\nرقم الطلب: ${order.number}\nالاسم: ${order.customer.name}\nالموبايل: ${order.customer.phone}\n${lines}\nالدفع: ${payLabel}\nالإجمالي: ${order.total} جنيه`;

      let payBox = '';
      if (order.payment === 'instapay') {
        payBox = `<div class="note" style="text-align: right;">🏦 <b>خطوة الدفع:</b> حوّل <b>${money(order.total)}</b> على انستاباي رقم
          <b dir="ltr">${esc(SITE.instapay)}</b> وابعتلنا سكرين التحويل على واتساب ومعاه رقم طلبك.</div>`;
      } else if (order.payment === 'wallet') {
        payBox = `<div class="note" style="text-align: right;">📱 <b>خطوة الدفع:</b> حوّل <b>${money(order.total)}</b> على محفظة رقم
          <b dir="ltr">${esc(SITE.wallet)}</b> وابعتلنا سكرين التحويل على واتساب ومعاه رقم طلبك.</div>`;
      }

      container.innerHTML = `
      <div class="success-box">
        <span class="icon">✅</span>
        <h2>تم استلام طلبك بنجاح!</h2>
        <p>رقم الطلب:</p>
        <div class="order-number">${esc(order.number)}</div>
        ${order.discount ? `<p style="color: var(--green); margin-top: 8px;">وفّرت ${money(order.discount)} بكود الخصم 🎉</p>` : ''}
        ${payBox}
        <p style="color: var(--muted); margin: 14px 0;">هنتواصل معاك على ${esc(order.customer.phone)} لتأكيد الطلب وتحديد الشحن.<br>
        تقدر تتابع حالة طلبك في أي وقت من صفحة <a href="/track.html?number=${esc(order.number)}&phone=${esc(order.customer.phone)}" style="color: var(--blue2);">تتبع الطلب</a>.</p>
        <a class="btn btn-green" target="_blank" rel="noopener" href="${waLink(waText)}">تأكيد عبر واتساب 💬</a>
        <br><br>
        <a href="/shop.html" style="color: var(--blue2);">← الرجوع للمتجر</a>
      </div>`;
      window.scrollTo(0, 0);
    }

    load();
  </script>
</body>
</html>
