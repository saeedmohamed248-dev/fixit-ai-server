<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#101828">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container" id="cart-container">
      <div class="spinner" data-i18n="loading"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script>
    renderLayout('cart');
    document.title = t('title_cart');
    const container = document.getElementById('cart-container');
    let products = [];
    let allProducts = [];
    let appliedCoupon = null; // { code, discount }
    let usePoints = false;
    let myPoints = 0;
    let useCredit = false;
    let myCredit = 0;
    let cardEnabled = false;
    let wsIncoterm = null; // 🚢 شرط التسليم المختار في الجملة
    let wsShipMode = 'sea'; // وسيلة الشحن: بحري/جوي
    let wsLeadText = ''; // آخر مدة توريد محسوبة (للواتساب)

    // هل الدفع بالبطاقة (Paymob) مفعّل؟
    api('/pay').then((d) => { if (d.enabled) { cardEnabled = true; render(); } }).catch(() => {});

    // رصيد نقاط ورصيد استبدال العميل المسجّل
    if (userToken()) {
      api('/auth', { headers: userHeaders() })
        .then((u) => { myPoints = u.points || 0; myCredit = u.credit || 0; if (myPoints || myCredit) render(); })
        .catch(() => {});
    }

    async function load() {
      const cart = getCart();
      const ids = Object.keys(cart);
      if (ids.length === 0) {
        container.innerHTML = `<div class="empty-state"><span class="icon">🛒</span>
          ${t('cart_empty')}<br><br><a class="btn" href="/shop.html">${t('browse')}</a></div>`;
        return;
      }
      try {
        allProducts = await api('/products');
        products = allProducts.filter((p) => ids.includes(p.id));
        render();
      } catch (e) {
        container.innerHTML = `<div class="spinner">${esc(e.message)}</div>`;
      }
    }

    // 🛒 بيتشتروا مع بعض: الأكثر مبيعاً من نفس فئات قطع السلة
    function boughtTogether(items) {
      const cats = [...new Set(items.map((p) => p.category))];
      const inCart = new Set(items.map((p) => p.id));
      const suggestions = allProducts
        .filter((p) => cats.includes(p.category) && !inCart.has(p.id) && p.stock > 0)
        .sort((a, b) => (b.sold || 0) - (a.sold || 0))
        .slice(0, 3);
      if (!suggestions.length) return '';
      return `
      <h3 style="margin: 22px 0 12px;">${t('bought_together')}</h3>
      ${suggestions.map((p) => `
        <div class="cart-item">
          <a class="thumb" href="/product.html?id=${esc(p.id)}">${productImage(p, 'thumb-img')}</a>
          <div>
            <h4><a href="/product.html?id=${esc(p.id)}">${esc(pname(p))}</a></h4>
            <div class="price" style="font-size: 15px;">${money(p.price)}</div>
          </div>
          <button class="btn-icon add-together" data-add="${esc(p.id)}">＋</button>
        </div>`).join('')}`;
    }

    // 🕒 تقدير مدة التوريد من البوت (يخزّن في الجلسة عشان مايتكررش)
    async function loadLead(country, mode) {
      const el = document.getElementById('lead-val');
      if (!el) return;
      const key = `lead_${countryCode(country)}_${mode}`;
      let cached = null;
      try { cached = JSON.parse(sessionStorage.getItem(key) || 'null'); } catch {}
      const apply = (d) => { const txt = fmtLead(d.minDays, d.maxDays); wsLeadText = txt; el.textContent = txt; };
      if (cached) { apply(cached); return; }
      try {
        const d = await api('/leadtime', { method: 'POST', body: JSON.stringify({ country, mode, bufferPct: (SITE.wholesale?.leadBufferPct) || 40 }) });
        try { sessionStorage.setItem(key, JSON.stringify(d)); } catch {}
        // نطبّق فقط لو لسه على نفس الوسيلة
        if (wsShipMode === mode) apply(d);
      } catch { el.textContent = '—'; }
    }

    // 🇦🇪 وضع الجملة: عرض بأسعار الجملة + إتمام الطلب عبر واتساب فرع الإمارات
    function renderWholesale() {
      const cart = getCart();
      const items = products.filter((p) => cart[p.id]);
      if (items.length === 0) return load();
      if (!currentUser()) {
        container.innerHTML = `<div class="empty-state"><span class="icon">🔒</span>
          ${t('ws_login_required')}<br><br><a class="btn" href="/account.html">${t('ws_login_cta')}</a></div>`;
        return;
      }
      let subtotal = 0;
      let anyOnRequest = false;
      items.forEach((p) => {
        const d = tierUnit(p, cart[p.id]);
        if (d === null) anyOnRequest = true;
        else subtotal += d * cart[p.id];
      });
      // 🚢 حساب الحاوية وعرض سعر الشحن الدولي
      const qitems = items.map((p) => ({ p, qty: cart[p.id] }));
      const cc = dealerCountryCode();
      const pol = countryPolicy(cc);
      const allowed = (pol.incoterms || ['FOB', 'CIF']).filter((c) => incotermDef(c).nameAr);
      if (!wsIncoterm || !allowed.includes(wsIncoterm)) wsIncoterm = allowed[0];
      const q = freightQuote(qitems, wsIncoterm, cc);
      const incName = (c) => LANG === 'en' ? incotermDef(c).nameEn : incotermDef(c).nameAr;
      container.innerHTML = `
      <h1 style="margin-bottom: 8px;">${t('cart')} (${items.length}) — 🇦🇪 ${t('branch_wholesale')}</h1>
      <div class="note" style="margin-bottom: 18px;">${t('ws_cart_note')}</div>
      <div class="cart-layout">
        <div>
          ${items.map((p) => {
            const d = tierUnit(p, cart[p.id]);
            const off = wsUnitAED(p, cart[p.id]) !== null ? (tierFor(cart[p.id]).off || 0) : 0;
            const line = d === null ? t('price_request') : money(d * cart[p.id]);
            return `
          <div class="cart-item">
            <a class="thumb" href="/product.html?id=${esc(p.id)}">${productImage(p, 'thumb-img')}</a>
            <div>
              <h4><a href="/product.html?id=${esc(p.id)}">${esc(pname(p))}</a></h4>
              <div class="sub">${conditionBadge(p)} <span class="sku">${esc(p.sku)}</span> ${off > 0 ? `<span class="badge badge-new">−${off}%</span>` : ''}</div>
              <div class="price" style="font-size: 15px;">${d === null ? t('price_request') : money(d)} ${d !== null ? `<small style="color:var(--muted);">× ${cart[p.id]} = <b>${line}</b></small>` : ''}</div>
            </div>
            <div class="actions">
              <div style="display: flex; gap: 4px; align-items: center;">
                <button class="stock-btn" data-step="${esc(p.id)}" data-d="-1">−</button>
                <input type="number" min="1" max="${p.stock}" value="${cart[p.id]}" data-qty="${esc(p.id)}">
                <button class="stock-btn" data-step="${esc(p.id)}" data-d="1">+</button>
              </div>
              <button class="remove-link" data-remove="${esc(p.id)}">${t('remove')}</button>
            </div>
          </div>`;
          }).join('')}
        </div>
        <div class="summary">
          <div class="load-card">
            <div class="load-head">🚢 ${t('load_title')}</div>
            <div class="load-row"><span>${t('load_cbm')}</span><b>${q.cbm.toFixed(2)} ${t('cbm_unit')}</b></div>
            <div class="load-row"><span>${t('load_weight')}</span><b>${new Intl.NumberFormat('en-US').format(Math.round(q.kg))} kg</b></div>
            <div class="load-row"><span>${t('load_recommend')}</span><b style="color:var(--accent);">${loadLabel(q.plan)}</b></div>
            ${q.plan.mode === 'FCL' || q.plan.mode === 'FCL_MULTI' ? `
            <div class="fill-track"><div class="fill-bar" style="width:${Math.min(100, q.plan.fillPct)}%;"></div></div>
            <div class="fill-cap">${q.cbm.toFixed(1)} ${t('load_fill_of')} ${q.plan.container.usableCbm * (q.plan.count || 1)} ${t('cbm_unit')} · ${q.plan.fillPct}%</div>` : ''}
          </div>

          <h3>${t('order_summary')}</h3>
          <div class="row"><span>${t('subtotal')}</span><b>${money(subtotal)}${anyOnRequest ? ' +' : ''}</b></div>
          ${anyOnRequest ? `<div class="row" style="color: var(--muted); font-size: 13px;"><span>${t('price_request')}</span></div>` : ''}

          <div class="ship-quote">
            <div class="ship-head">📦 ${t('ship_title')}</div>
            <div class="row"><span>${t('ship_dest')}</span><b>${esc(currentUser().country || '—')}${q.port ? ` · ${esc(q.port)}` : ''}</b></div>
            <div style="margin:8px 0;">
              <label>${t('ship_mode')}</label>
              <div class="mode-switch">
                <button type="button" class="${wsShipMode === 'sea' ? 'active' : ''}" data-mode="sea">${t('mode_sea')}</button>
                <button type="button" class="${wsShipMode === 'air' ? 'active' : ''}" data-mode="air">${t('mode_air')}</button>
              </div>
            </div>
            <div class="row"><span>🕒 ${t('lead_title')}</span><b id="lead-val" style="color:var(--accent);">${t('lead_loading')}</b></div>
            <div style="margin:8px 0;">
              <label>${t('ship_incoterm')}</label>
              <select id="w-incoterm">
                ${allowed.map((c) => `<option value="${c}" ${c === wsIncoterm ? 'selected' : ''}>${esc(incName(c))}</option>`).join('')}
              </select>
            </div>
            <div class="row"><span>${t('ship_goods')}</span><span>${usdMoney(q.goods)}</span></div>
            ${q.freight ? `<div class="row"><span>${t('ship_freight')}</span><span>${usdMoney(q.freight)}</span></div>` : ''}
            ${q.insurance ? `<div class="row"><span>${t('ship_insurance')}</span><span>${usdMoney(q.insurance)}</span></div>` : ''}
            ${q.customs ? `<div class="row" style="color:var(--amber);"><span>${t('ship_customs')}</span><span>${usdMoney(q.customs)}</span></div>` : ''}
            <div class="row total" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px;"><span>${t('ship_grand')}</span><span>${usdMoney(q.total)}</span></div>
            ${(() => {
              const pay = paymentTerms(cc);
              if (pay.fullUpfront) return `
              <div style="margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;">
                <div class="ship-head" style="font-size:13px;">💵 ${t('pay_terms_title')}</div>
                <div class="row" style="color:var(--green);"><span>${t('pay_full')}</span><b>${usdMoney(q.total)}</b></div>
                <div class="note" style="margin:6px 0 0;font-size:11.5px;">${t('pay_full_note')}</div>
              </div>`;
              const dp = Number(pay.depositPct) || 0, bp = Number(pay.balancePct) || 0;
              return (dp || bp) ? `
              <div style="margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;">
                <div class="ship-head" style="font-size:13px;">💵 ${t('pay_terms_title')}</div>
                <div class="row" style="color:var(--green);"><span>${t('pay_deposit', { p: dp })}</span><b>${usdMoney(q.total * dp / 100)}</b></div>
                <div class="row"><span>${t('pay_balance', { p: bp })}</span><b>${usdMoney(q.total * bp / 100)}</b></div>
              </div>` : '';
            })()}
            <div class="note" style="margin:8px 0 0;font-size:12px;">${t('ship_usd_note')}${q.customs ? '<br>⚠️ ' + t('ship_customs_note') : ''}</div>
          </div>

          <hr style="border-color: var(--line);">
          <div><label>${t('full_name')}</label><input id="w-name" value="${esc(currentUser().name || '')}"></div>
          <div><label>${t('phone')}</label><input id="w-phone" type="tel" dir="ltr" style="text-align: start;" value="${esc(currentUser().phone || '')}"></div>
          <div><label>${t('city')}</label><input id="w-city"></div>
          <div><label>${t('notes')}</label><textarea id="w-notes" rows="2"></textarea></div>
          <button class="btn btn-green" id="w-submit">💬 ${t('ws_checkout')}</button>
        </div>
      </div>`;

      container.querySelectorAll('[data-qty]').forEach((input) => {
        input.addEventListener('change', () => {
          const c = getCart();
          c[input.dataset.qty] = Math.max(1, Number(input.value) || 1);
          setCart(c);
          renderWholesale();
        });
      });
      container.querySelectorAll('[data-remove]').forEach((btn) => {
        btn.addEventListener('click', () => { removeFromCart(btn.dataset.remove); renderWholesale(); });
      });
      document.getElementById('w-incoterm')?.addEventListener('change', (e) => {
        wsIncoterm = e.target.value;
        renderWholesale();
      });
      container.querySelectorAll('.mode-switch [data-mode]').forEach((btn) =>
        btn.addEventListener('click', () => { wsShipMode = btn.dataset.mode; renderWholesale(); }));
      // 🕒 تقدير مدة التوريد بالبوت (مع كاش لكل دولة+وسيلة)
      loadLead(currentUser().country, wsShipMode);
      container.querySelectorAll('[data-step]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const c = getCart();
          const p = products.find((x) => x.id === btn.dataset.step);
          c[btn.dataset.step] = Math.max(1, Math.min(p.stock, (c[btn.dataset.step] || 1) + Number(btn.dataset.d)));
          setCart(c);
          renderWholesale();
        });
      });

      document.getElementById('w-submit').addEventListener('click', () => {
        const name = document.getElementById('w-name').value.trim();
        const phone = document.getElementById('w-phone').value.trim();
        const city = document.getElementById('w-city').value.trim();
        const notes = document.getElementById('w-notes').value.trim();
        const cur = WCUR === 'usd' ? 'USD' : 'AED';
        const lines = items.map((p) => {
          const d = tierUnit(p, cart[p.id]);
          const priceTxt = d === null ? t('price_request') : money(d) + ' × ' + cart[p.id] + ' = ' + money(d * cart[p.id]);
          return `• ${pname(p)} (${p.sku || '-'}) — ${priceTxt}`;
        }).join('\n');
        const head = `${t('ws_order_title')} 🇦🇪 (${cur})`;
        const who = [name && `${t('full_name')}: ${name}`, phone && `${t('phone')}: ${phone}`,
          currentUser().company && `${t('rfq_company')}: ${currentUser().company}`,
          city && `${t('city')}: ${city}`].filter(Boolean).join('\n');
        const totalTxt = `${t('subtotal')}: ${money(subtotal)}${anyOnRequest ? ' +' : ''}`;
        // 🚢 تفاصيل الشحن
        const ship = [
          `— ${t('ship_title')} —`,
          `${t('ship_dest')}: ${currentUser().country || '-'}${q.port ? ' / ' + q.port : ''}`,
          `${t('ship_mode')}: ${wsShipMode === 'air' ? t('mode_air') : t('mode_sea')}`,
          wsLeadText ? `${t('lead_title')}: ${wsLeadText}` : '',
          `${t('load_recommend')}: ${loadLabel(q.plan)} (${q.cbm.toFixed(2)} ${t('cbm_unit')})`,
          `${t('ship_incoterm')}: ${incName(wsIncoterm)}`,
          `${t('ship_goods')}: ${usdMoney(q.goods)}`,
          q.freight ? `${t('ship_freight')}: ${usdMoney(q.freight)}` : '',
          q.insurance ? `${t('ship_insurance')}: ${usdMoney(q.insurance)}` : '',
          q.customs ? `${t('ship_customs')}: ${usdMoney(q.customs)}` : '',
          `${t('ship_grand')}: ${usdMoney(q.total)}`,
        ].filter(Boolean).join('\n');
        const pay = paymentTerms(cc);
        const payTxt = '\n' + (pay.fullUpfront ? [
          `— ${t('pay_terms_title')} —`,
          `${t('pay_full')}: ${usdMoney(q.total)}`,
          t('pay_full_note'),
        ].join('\n') : [
          `— ${t('pay_terms_title')} —`,
          `${t('pay_deposit', { p: pay.depositPct })}: ${usdMoney(q.total * (pay.depositPct || 0) / 100)}`,
          `${t('pay_balance', { p: pay.balancePct })}: ${usdMoney(q.total * (pay.balancePct || 0) / 100)}`,
        ].join('\n'));
        const msg = [head, who, '', lines, '', totalTxt, '', ship, payTxt, notes && (`${t('notes')}: ${notes}`)].filter((x) => x !== undefined && x !== '').join('\n');
        trackEvent('ws_order');
        window.open(waLink(msg), '_blank');
      });
    }

    function render() {
      if (isWholesale()) return renderWholesale();
      const cart = getCart();
      const items = products.filter((p) => cart[p.id]);
      if (items.length === 0) return load();
      const subtotal = items.reduce((s, p) => s + p.price * cart[p.id], 0);
      const discount = appliedCoupon ? appliedCoupon.discount : 0;
      const pointsDiscount = usePoints ? Math.min(myPoints, subtotal - discount) : 0;
      const netBeforeCredit = subtotal - discount - pointsDiscount;
      // رصيد الاستبدال يُستخدم فقط لو الطلب أكبر من الرصيد (شرط الحد الأدنى)
      const creditEligible = myCredit > 0 && netBeforeCredit > myCredit;
      const creditDiscount = (useCredit && creditEligible) ? myCredit : 0;
      const total = netBeforeCredit - creditDiscount;
      const user = currentUser();
      const freeShip = SITE.freeShippingOver && total >= SITE.freeShippingOver;

      container.innerHTML = `
      <h1 style="margin-bottom: 20px;">${t('cart')} (${items.length})</h1>
      <div class="cart-layout">
        <div>
          ${items.map((p) => `
          <div class="cart-item">
            <a class="thumb" href="/product.html?id=${esc(p.id)}">${productImage(p, 'thumb-img')}</a>
            <div>
              <h4><a href="/product.html?id=${esc(p.id)}">${esc(pname(p))}</a></h4>
              <div class="sub">${conditionBadge(p)} ${esc(p.sku)}</div>
              <div class="price" style="font-size: 15px;">${money(p.price)}</div>
            </div>
            <div class="actions">
              <div style="display: flex; gap: 4px; align-items: center;">
                <button class="stock-btn" data-step="${esc(p.id)}" data-d="-1">−</button>
                <input type="number" min="1" max="${p.stock}" value="${cart[p.id]}" data-qty="${esc(p.id)}">
                <button class="stock-btn" data-step="${esc(p.id)}" data-d="1">+</button>
              </div>
              <button class="remove-link" data-remove="${esc(p.id)}">${t('remove')}</button>
            </div>
          </div>`).join('')}
          ${boughtTogether(items)}
        </div>

        <div class="summary">
          <h3>${t('order_summary')}</h3>
          <div class="row"><span>${t('subtotal')}</span><b>${money(subtotal)}</b></div>
          ${discount ? `<div class="row" style="color: var(--green);"><span>${t('discount_row')} (${esc(appliedCoupon.code)})</span><b>- ${money(discount)}</b></div>` : ''}
          ${pointsDiscount ? `<div class="row" style="color: var(--green);"><span>${t('points_row')} ⭐</span><b>- ${money(pointsDiscount)}</b></div>` : ''}
          ${creditDiscount ? `<div class="row" style="color: var(--green);"><span>${t('credit_row')} 💳</span><b>- ${money(creditDiscount)}</b></div>` : ''}
          <div class="row" style="color: var(--muted); font-size: 13px;">
            <span>${t('shipping')}</span><span>${freeShip ? t('ship_free') : t('ship_later')}</span>
          </div>
          ${SITE.freeShippingOver && !freeShip ? `
          <div class="ship-progress">
            <small>${t('ship_progress', { v: money(SITE.freeShippingOver - total) })}</small>
            <div class="progress-track"><div class="progress-fill" style="width: ${Math.min(100, Math.round(total / SITE.freeShippingOver * 100))}%;"></div></div>
          </div>` : ''}
          <div class="row total"><span>${t('total_due')}</span><span>${money(total)}</span></div>

          <div style="display: flex; gap: 8px;">
            <input id="c-coupon" placeholder="${t('coupon_ph')}" value="${appliedCoupon ? esc(appliedCoupon.code) : ''}" ${appliedCoupon ? 'disabled' : ''}>
            <button class="btn btn-outline btn-sm" id="apply-coupon">${appliedCoupon ? t('cancel') : t('apply')}</button>
          </div>
          ${myPoints > 0 ? `
          <label class="pay-option" style="margin: 0;">
            <input type="checkbox" id="use-points" ${usePoints ? 'checked' : ''}>
            ${t('points_use', { n: myPoints, v: money(Math.min(myPoints, subtotal - discount)) })}
          </label>` : ''}
          ${myCredit > 0 ? (creditEligible ? `
          <label class="pay-option" style="margin: 0;">
            <input type="checkbox" id="use-credit" ${useCredit ? 'checked' : ''}>
            ${t('credit_use', { v: money(myCredit) })}
          </label>` : `<div style="font-size: 12px; color: var(--muted);">${t('credit_min', { v: money(myCredit) })}</div>`) : ''}

          <hr style="border-color: var(--line);">
          ${!user ? `<div class="note" style="margin: 0;">${t('have_account')}</div>` : ''}
          <div><label>${t('full_name')}</label><input id="c-name" value="${user ? esc(user.name) : ''}"></div>
          <div><label>${t('phone')}</label><input id="c-phone" type="tel" dir="ltr" style="text-align: start;" placeholder="01xxxxxxxxx" value="${user ? esc(user.phone) : ''}"></div>
          <div><label>${t('city')}</label><input id="c-city" placeholder="${t('city_ph')}"></div>
          <div><label>${t('email_label')}</label><input id="c-email" type="email" dir="ltr" style="text-align: start;" value="${user && user.email ? esc(user.email) : ''}" placeholder="عشان يوصلك تأكيد الطلب"></div>
          <div><label>${t('address')}</label><textarea id="c-address" rows="2"></textarea></div>
          <div><label>${t('notes')}</label><textarea id="c-notes" rows="2"></textarea></div>

          <div>
            <label>${t('pay_method')}</label>
            <div class="pay-options">
              <label class="pay-option"><input type="radio" name="pay" value="cod" checked> ${t('pay_cod')}</label>
              ${cardEnabled ? `<label class="pay-option"><input type="radio" name="pay" value="card"> ${t('pay_card')} 🔒</label>` : ''}
              <label class="pay-option"><input type="radio" name="pay" value="instapay"> ${t('pay_instapay')}</label>
              <label class="pay-option"><input type="radio" name="pay" value="wallet"> ${t('pay_wallet')}</label>
            </div>
          </div>

          <button class="btn" id="submit-order">${t('confirm_order')}</button>
          <div id="order-error" style="color: var(--red); font-size: 14px;"></div>
        </div>
      </div>`;

      container.querySelectorAll('[data-qty]').forEach((input) => {
        input.addEventListener('change', () => {
          const c = getCart();
          c[input.dataset.qty] = Math.max(1, Number(input.value) || 1);
          setCart(c);
          appliedCoupon = null;
          render();
        });
      });
      container.querySelectorAll('[data-remove]').forEach((btn) => {
        btn.addEventListener('click', () => { removeFromCart(btn.dataset.remove); appliedCoupon = null; render(); });
      });
      container.querySelectorAll('[data-step]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const c = getCart();
          const p = products.find((x) => x.id === btn.dataset.step);
          c[btn.dataset.step] = Math.max(1, Math.min(p.stock, (c[btn.dataset.step] || 1) + Number(btn.dataset.d)));
          setCart(c);
          appliedCoupon = null;
          render();
        });
      });

      document.getElementById('use-points')?.addEventListener('change', (e) => {
        usePoints = e.target.checked;
        render();
      });
      document.getElementById('use-credit')?.addEventListener('change', (e) => {
        useCredit = e.target.checked;
        render();
      });
      container.querySelectorAll('[data-add]').forEach((btn) =>
        btn.addEventListener('click', () => {
          addToCart(btn.dataset.add, 1);
          products = allProducts.filter((p) => Object.keys(getCart()).includes(p.id));
          render();
        }));

      document.getElementById('apply-coupon').addEventListener('click', async () => {
        if (appliedCoupon) { appliedCoupon = null; return render(); }
        const code = document.getElementById('c-coupon').value.trim();
        if (!code) return;
        try {
          const data = await api('/coupons', {
            method: 'POST',
            body: JSON.stringify({ action: 'validate', code, subtotal }),
          });
          appliedCoupon = data;
          toast(t('coupon_ok', { v: money(data.discount) }));
          render();
        } catch (e) { toast('⚠️ ' + e.message); }
      });

      document.getElementById('submit-order').addEventListener('click', async (e) => {
        const btn = e.target;
        const errBox = document.getElementById('order-error');
        errBox.textContent = '';
        const customer = {
          name: document.getElementById('c-name').value.trim(),
          phone: document.getElementById('c-phone').value.trim(),
          city: document.getElementById('c-city').value.trim(),
          email: document.getElementById('c-email').value.trim(),
          address: document.getElementById('c-address').value.trim(),
        };
        if (!customer.name || !customer.phone || !customer.address) {
          errBox.textContent = t('fill_required');
          return;
        }
        btn.disabled = true;
        btn.textContent = t('sending');
        try {
          const c = getCart();
          const order = await api('/orders', {
            method: 'POST',
            headers: userHeaders(),
            body: JSON.stringify({
              customer,
              notes: document.getElementById('c-notes').value.trim(),
              payment: document.querySelector('input[name="pay"]:checked').value,
              coupon: appliedCoupon ? appliedCoupon.code : '',
              usePoints: usePoints ? myPoints : 0,
              useCredit: useCredit,
              items: Object.entries(c).map(([id, qty]) => ({ id, qty })),
            }),
          });
          setCart({});
          // 💳 الدفع بالبطاقة: تحويل مباشر لصفحة Paymob الآمنة
          if (order.payment === 'card') {
            btn.textContent = t('pay_redirect');
            try {
              const pay = await api('/pay', {
                method: 'POST',
                body: JSON.stringify({ number: order.number, phone: order.customer.phone }),
              });
              location.href = pay.iframe_url;
              return;
            } catch (payErr) {
              toast('⚠️ ' + payErr.message);
            }
          }
          showSuccess(order);
        } catch (err) {
          errBox.textContent = err.message;
          btn.disabled = false;
          btn.textContent = t('confirm_order');
        }
      });
    }

    function showSuccess(order) {
      const lines = order.items.map((i) => `• ${i.name} × ${i.qty}`).join('\n');
      const payLabel = { cod: t('pay_cod'), instapay: t('pay_instapay'), wallet: t('pay_wallet'), card: t('pay_card') }[order.payment];
      const waText = `${LANG === 'en' ? 'New website order 🛒' : 'طلب جديد من الموقع 🛒'}\n${t('order_no')} ${order.number}\n${order.customer.name} — ${order.customer.phone}\n${lines}\n${payLabel}\n${t('total_due')}: ${order.total} ${LANG === 'en' ? 'EGP' : 'جنيه'}`;

      let payBox = '';
      if (order.payment === 'card' && !order.paid) {
        payBox = `<button class="btn" onclick='payCard("${esc(order.number)}", "${esc(order.customer.phone)}")'>${t('pay_now')}</button>`;
      } else if (order.payment === 'instapay') {
        payBox = `<div class="note" style="text-align: start;">${t('pay_step_instapay', { v: money(order.total), n: esc(SITE.instapay) })}</div>`;
      } else if (order.payment === 'wallet') {
        payBox = `<div class="note" style="text-align: start;">${t('pay_step_wallet', { v: money(order.total), n: esc(SITE.wallet) })}</div>`;
      }

      container.innerHTML = `
      <div class="success-box">
        <span class="icon">✅</span>
        <h2>${t('order_success')}</h2>
        <p>${t('order_no')}</p>
        <div class="order-number">${esc(order.number)}</div>
        ${order.discount ? `<p style="color: var(--green); margin-top: 8px;">${t('saved', { v: money(order.discount) })}</p>` : ''}
        ${order.pointsUsed ? `<p style="color: var(--green); margin-top: 4px;">⭐ ${t('points_row')}: -${money(order.pointsUsed)}</p>` : ''}
        ${order.pointsEarned ? `<p style="color: var(--amber); margin-top: 4px;">${t('points_earned', { n: order.pointsEarned })}</p>` : ''}
        ${payBox}
        <p style="color: var(--muted); margin: 14px 0;">${t('contact_confirm', { p: esc(order.customer.phone) })}<br>
        ${t('track_anytime')} <a href="/track.html?number=${esc(order.number)}&phone=${esc(order.customer.phone)}" style="color: var(--accent-dark);">${t('track_page')}</a>.</p>
        <a class="btn btn-green" target="_blank" rel="noopener" href="${waLink(waText)}">${t('confirm_wa')}</a>
        <br><br>
        <a href="/shop.html" style="color: var(--accent-dark);">${t('back_shop')}</a>
      </div>`;
      window.scrollTo(0, 0);
    }

    async function payCard(number, phone) {
      try {
        const pay = await api('/pay', { method: 'POST', body: JSON.stringify({ number, phone }) });
        location.href = pay.iframe_url;
      } catch (e) { toast('⚠️ ' + e.message); }
    }

    load();
  </script>
</body>
</html>
