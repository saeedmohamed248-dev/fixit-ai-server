<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلة المشتريات | FixIt</title>
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#101828">
  <link rel="stylesheet" href="/css/style.css?v=20261127c">
</head>
<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container" id="cart-container">
      <div class="spinner" data-i18n="loading">جاري التحميل...</div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js?v=20261127c"></script>
  <script src="/js/i18n.js?v=20261127c"></script>
  <script src="/js/app.js?v=20261127c"></script>
  <script>
    renderLayout('cart');
    document.title = t('title_cart');
    const container = document.getElementById('cart-container');
    let products = [];
    let allProducts = [];
    let appliedCoupon = null; // { code, discount }
    let usePoints = false;
    let myPoints = 0;
    let useCredit = false;
    let myCredit = 0;
    // 💰 كاش باك
    let useCashback = false;
    let cbInfo = null; let cbKey = '';
    function refreshCashback(items, cart, net) {
      const key = JSON.stringify([items.map((p) => [p.id, cart[p.id]]), net, Boolean(userToken())]);
      if (key === cbKey) return; cbKey = key;
      api('/cashback', { method: 'POST', headers: userHeaders(), body: JSON.stringify({ action: 'preview', items: items.map((p) => ({ id: p.id, qty: cart[p.id] })), net }) })
        .then((d) => { if (cbKey === key) { cbInfo = d; render(); } }).catch(() => {});
    }
    let cardEnabled = false;
    let wsIncoterm = null; // 🚢 شرط التسليم المختار في الجملة
    let wsShipMode = 'sea'; // وسيلة الشحن: بحري/جوي
    let wsLeadText = ''; // آخر مدة توريد محسوبة (للواتساب)
    let cartNotice = ''; // تنبيه لو شلنا قطع مبقتش متاحة

    // ✍️ نحفظ اللي العميل كتبه في الفورم قبل أي إعادة رسم (تغيير كمية/كوبون/نقاط كان بيمسح الاسم والعنوان)
    const FORM_IDS = ['c-name', 'c-phone', 'c-city', 'c-email', 'c-address', 'c-notes', 'w-name', 'w-phone', 'w-country', 'w-city', 'w-notes'];
    let formDraft = {};
    try { formDraft = JSON.parse(localStorage.getItem('checkout_draft') || '{}'); } catch {}
    function saveDraft() {
      FORM_IDS.forEach((id) => { const el = document.getElementById(id); if (el) formDraft[id] = el.value; });
      const pay = document.querySelector('input[name="pay"]:checked'); if (pay) formDraft.pay = pay.value;
      // نفتكر العنوان والمدينة للمرة الجاية (مش الملاحظات)
      try { localStorage.setItem('checkout_draft', JSON.stringify({ ...formDraft, 'c-notes': '', 'w-notes': '' })); } catch {}
    }
    function restoreDraft() {
      FORM_IDS.forEach((id) => { const el = document.getElementById(id); if (el && formDraft[id]) el.value = formDraft[id]; });
      if (formDraft.pay) { const r = document.querySelector(`input[name="pay"][value="${formDraft.pay}"]`); if (r) r.checked = true; }
      FORM_IDS.forEach((id) => document.getElementById(id)?.addEventListener('input', saveDraft));
      document.querySelectorAll('input[name="pay"]').forEach((r) => r.addEventListener('change', saveDraft));
    }

    // 📊 begin_checkout: أول ما العميل يبدأ يكتب في فورم السلة (مرة واحدة لكل سلة في الجلسة).
    //    مربوط على الـ container عشان يفضل شغال بعد أي إعادة رسم.
    container.addEventListener('input', (e) => {
      if (!e.target.closest('#c-name, #c-phone, #c-email, #c-address, #c-notes, #w-name, #w-phone, #w-country, #w-city, #w-notes')) return;
      const cart = getCart();
      const sig = (isWholesale() ? 'ws:' : 'eg:') + Object.keys(cart).sort().join(',');
      try { if (sessionStorage.getItem('an_bc') === sig) return; sessionStorage.setItem('an_bc', sig); } catch {}
      const val = products.filter((p) => cart[p.id]).reduce((a, p) => a + (isWholesale() ? 0 : p.price * cart[p.id]), 0);
      trackEvent('begin_checkout', { n: Object.keys(cart).length, val, cur: isWholesale() ? 'USD' : 'EGP', br: isWholesale() ? 'ae' : 'eg' });
    });

    // 🛒 السلة المتروكة: أول ما يبقى فيه رقم صحيح في الفورم نحفظ السلة (بعد ثانيتين من آخر كتابة)
    //    عشان المتجر يقدر يكلّم العميل لو مكمّلش — العميل متنبّه تحت خانة الرقم.
    let acTimer = null, acLast = '';
    function saveAbandoned() {
      clearTimeout(acTimer);
      acTimer = setTimeout(() => {
        const ws = isWholesale();
        const phEl = document.getElementById(ws ? 'w-phone' : 'c-phone');
        const phone = (phEl?.value || '').replace(/[\s-]/g, '');
        if (!(ws ? /^\+?\d{7,15}$/.test(phone) : /^01[0125]\d{8}$/.test(phone))) return;
        const cart = getCart();
        const items = products.filter((p) => cart[p.id]).map((p) => ({ id: p.id, name: p.name, qty: cart[p.id], price: ws ? 0 : p.price }));
        if (!items.length) return;
        const body = { br: ws ? 'ae' : 'eg', phone, name: (document.getElementById(ws ? 'w-name' : 'c-name')?.value || '').trim(),
          city: (document.getElementById(ws ? 'w-city' : 'c-city')?.value || '').trim(), items, total: items.reduce((a, i) => a + i.price * i.qty, 0) };
        const sig = JSON.stringify(body);
        if (sig === acLast) return; acLast = sig;
        api('/carts', { method: 'POST', body: sig }).catch(() => {});
      }, 2000);
    }
    container.addEventListener('input', (e) => { if (e.target.closest('#c-phone, #c-name, #w-phone, #w-name')) saveAbandoned(); });
    container.addEventListener('change', (e) => { if (e.target.closest('#c-city, #w-city, [data-qty]')) saveAbandoned(); });

    // هل الدفع بالبطاقة (Paymob) مفعّل؟
    api('/pay').then((d) => { if (d.enabled) { cardEnabled = true; render(); } }).catch(() => {});

    // رصيد نقاط ورصيد استبدال العميل المسجّل
    if (userToken()) {
      api('/auth', { headers: userHeaders() })
        .then((u) => { myPoints = u.points || 0; myCredit = u.credit || 0; if (myPoints || myCredit) render(); })
        .catch(() => {});
    }

    async function load() {
      const cart = getCart();
      const ids = Object.keys(cart);
      if (ids.length === 0) {
        container.innerHTML = `<div class="empty-state"><span class="icon">🛒</span>
          ${t('cart_empty')}<br><br><a class="btn" href="/shop.html">${t('browse')}</a></div>`;
        return;
      }
      try {
        allProducts = await api('/products');
        // 🧹 نشيل من السلة اللي خلص أو اتشال أو سعره عند الطلب، ونظبط الكميات على المخزون —
        //    غير كده السلة كانت بتلف في حلقة تحميل لا نهائية، والطلب بيترفض من غير ما العميل يعرف ليه
        const removed = [], moved = [];
        const c = getCart();
        ids.forEach((id) => {
          const p = allProducts.find((x) => x.id === id);
          // قطعة مش تبع فرع الوضع الحالي (مثلاً قطعة إمارات في السلة القطاعي) بتتنقل لسلة الفرع التاني بدل ما تتمسح
          if (p && Number(p.stock) > 0 && !wsCatalogFilter([p]).length) {
            const other = getCart(!isWholesale()); other[id] = (other[id] || 0) + c[id]; setCart(other, !isWholesale());
            moved.push(pname(p)); delete c[id];
          } else if (!p || !(Number(p.stock) > 0) || (!isWholesale() && !(Number(p.price) > 0))) {
            removed.push(p ? pname(p) : null); delete c[id];
          } else if (c[id] > p.stock) c[id] = p.stock;
        });
        setCart(c);
        cartNotice = removed.length
          ? (LANG === 'en'
            ? `⚠️ ${removed.length} item(s) were removed from your cart because they're no longer available${removed.filter(Boolean).length ? ': ' + removed.filter(Boolean).map(esc).join('، ') : ''}. <a href="/request.html" style="color:var(--accent-dark);">Request them</a>`
            : `⚠️ شلنا ${removed.length} قطعة من السلة لأنها مبقتش متاحة${removed.filter(Boolean).length ? ': ' + removed.filter(Boolean).map(esc).join('، ') : ''}. <a href="/request.html" style="color:var(--accent-dark);">اطلبها نوفّرهالك</a>`)
          : '';
        if (moved.length) cartNotice += (cartNotice ? '<br>' : '') + (LANG === 'en'
          ? `ℹ️ ${moved.length} item(s) belong to the ${isWholesale() ? 'Retail (Egypt)' : 'Wholesale (UAE)'} store and were kept in that cart: ${moved.map(esc).join('، ')}. <a href="#" onclick="setMode('${isWholesale() ? 'retail' : 'wholesale'}');return false;" style="color:var(--accent-dark);">Switch</a>`
          : `ℹ️ ${moved.length} قطعة تبع ${isWholesale() ? 'القطاعي (مصر)' : 'الجملة (الإمارات)'} — اتحفظت في سلة الفرع ده ومتمسحتش: ${moved.map(esc).join('، ')}. <a href="#" onclick="setMode('${isWholesale() ? 'retail' : 'wholesale'}');return false;" style="color:var(--accent-dark);">روح لها</a>`);
        products = allProducts.filter((p) => c[p.id]);
        if (!products.length) {
          container.innerHTML = `${cartNotice ? `<div class="note">${cartNotice}</div>` : ''}<div class="empty-state"><span class="icon">🛒</span>
            ${t('cart_empty')}<br><br><a class="btn" href="/shop.html">${t('browse')}</a></div>`;
          return;
        }
        render();
      } catch (e) {
        container.innerHTML = `<div class="spinner">${esc(e.message)}</div>`;
      }
    }

    // 🛒 بيتشتروا مع بعض: الأكثر مبيعاً من نفس فئات قطع السلة
    function boughtTogether(items) {
      const cats = [...new Set(items.map((p) => p.category))];
      const inCart = new Set(items.map((p) => p.id));
      const suggestions = allProducts
        .filter((p) => cats.includes(p.category) && !inCart.has(p.id) && p.stock > 0)
        .sort((a, b) => (b.sold || 0) - (a.sold || 0))
        .slice(0, 3);
      if (!suggestions.length) return '';
      return `
      <h3 style="margin: 22px 0 12px;">${t('bought_together')}</h3>
      ${suggestions.map((p) => `
        <div class="cart-item">
          <a class="thumb" href="${productUrl(p)}">${productImage(p, 'thumb-img')}</a>
          <div>
            <h4><a href="${productUrl(p)}">${esc(pname(p))}</a></h4>
            <div class="price" style="font-size: 15px;">${money(p.price)}</div>
          </div>
          <button class="btn-icon add-together" data-add="${esc(p.id)}">＋</button>
        </div>`).join('')}`;
    }

    // 🕒 تقدير مدة التوريد: بنعرض تقدير فوري من جدول ثابت، وبعدين نحدّثه من البوت لو رد (بحد أقصى 8 ثواني).
    //    قبل كده الرسم من جديد كان بيفصل العنصر القديم، فالقيمة كانت بتفضل «جاري التقدير…» للأبد.
    const LEAD_FALLBACK = { sea: { EG: [45, 65], RU: [40, 60], DEFAULT: [45, 70] }, air: { EG: [4, 8], RU: [6, 11], DEFAULT: [5, 10] } };
    function leadFallback(country, mode) {
      const tbl = LEAD_FALLBACK[mode] || LEAD_FALLBACK.sea;
      const [a, b] = tbl[countryCode(country)] || tbl.DEFAULT;
      const buf = 1 + ((SITE.wholesale?.leadBufferPct) || 40) / 100;
      return { minDays: Math.round(a * buf), maxDays: Math.round(b * buf) };
    }
    function leadKey(country, mode) { return `lead_${countryCode(country)}_${mode}`; }
    function leadNow(country, mode) {
      let d = null;
      try { d = JSON.parse(sessionStorage.getItem(leadKey(country, mode)) || 'null'); } catch {}
      d = d || leadFallback(country, mode);
      wsLeadText = fmtLead(d.minDays, d.maxDays);
      return wsLeadText;
    }
    async function loadLead(country, mode) {
      const key = leadKey(country, mode);
      try { if (sessionStorage.getItem(key)) return; } catch {}
      try {
        const d = await api('/leadtime', { method: 'POST', signal: AbortSignal.timeout(8000), body: JSON.stringify({ country, mode, bufferPct: (SITE.wholesale?.leadBufferPct) || 40 }) });
        if (!(d && d.minDays > 0)) return;
        try { sessionStorage.setItem(key, JSON.stringify(d)); } catch {}
        if (wsShipMode !== mode) return;
        wsLeadText = fmtLead(d.minDays, d.maxDays);
        const el = document.getElementById('lead-val'); // العنصر الحالي (مش القديم)
        if (el) el.textContent = wsLeadText;
      } catch { /* بنفضل على التقدير الثابت */ }
    }

    // 🇦🇪 وضع الجملة: عرض بأسعار الجملة + إتمام الطلب عبر واتساب فرع الإمارات
    function renderWholesale() {
      saveDraft();
      const cart = getCart();
      const items = products.filter((p) => cart[p.id]);
      if (items.length === 0) return load();
      // 🔓 من غير تسجيل دخول: بنطلب الاسم + الواتساب + الدولة عند الإرسال بس
      const buyer = wsBuyer();
      if (formDraft['w-country'] !== undefined && formDraft['w-country'] !== buyer.country) buyer.country = formDraft['w-country'];
      let subtotal = 0;
      let anyOnRequest = false;
      items.forEach((p) => {
        const d = tierUnit(p, cart[p.id]);
        if (d === null) anyOnRequest = true;
        else subtotal += d * cart[p.id];
      });
      // 🚢 حساب الحاوية وعرض سعر الشحن الدولي
      const qitems = items.map((p) => ({ p, qty: cart[p.id] }));
      const cc = countryCode(buyer.country);
      const pol = countryPolicy(cc);
      const allowed = (pol.incoterms || ['FOB', 'CIF']).filter((c) => incotermDef(c).nameAr);
      if (!wsIncoterm || !allowed.includes(wsIncoterm)) wsIncoterm = allowed[0];
      const q = freightQuote(qitems, wsIncoterm, cc);
      const incName = (c) => LANG === 'en' ? incotermDef(c).nameEn : incotermDef(c).nameAr;
      container.innerHTML = `
      ${cartNotice ? `<div class="note" style="margin-bottom:14px;">${cartNotice}</div>` : ''}
      <h1 style="margin-bottom: 8px;">${t('cart')} (${items.length}) — 🇦🇪 ${t('branch_wholesale')}</h1>
      <div class="note" style="margin-bottom: 18px;">${t('ws_cart_note')}</div>
      <div class="cart-layout">
        <div>
          ${items.map((p) => {
            const d = tierUnit(p, cart[p.id]);
            const off = wsUnitAED(p, cart[p.id]) !== null ? (tierFor(cart[p.id]).off || 0) : 0;
            const line = d === null ? t('price_request') : money(d * cart[p.id]);
            return `
          <div class="cart-item">
            <a class="thumb" href="${productUrl(p)}">${productImage(p, 'thumb-img')}</a>
            <div>
              <h4><a href="${productUrl(p)}">${esc(pname(p))}</a></h4>
              <div class="sub">${conditionBadge(p)} <span class="sku">${esc(p.sku)}</span> ${off > 0 ? `<span class="badge badge-new">−${off}%</span>` : ''}</div>
              ${deliveryBadge(p, 'cart-delivery')}
              <div class="price" style="font-size: 15px;">${d === null ? t('price_request') : money(d)} ${d !== null ? `<small style="color:var(--muted);">× ${cart[p.id]} = <b>${line}</b></small>` : ''}</div>
            </div>
            <div class="actions">
              <div style="display: flex; gap: 4px; align-items: center;">
                <button class="stock-btn" data-step="${esc(p.id)}" data-d="-1">−</button>
                <input type="number" min="1" max="${p.stock}" value="${cart[p.id]}" data-qty="${esc(p.id)}">
                <button class="stock-btn" data-step="${esc(p.id)}" data-d="1">+</button>
              </div>
              <button class="remove-link" data-remove="${esc(p.id)}">${t('remove')}</button>
            </div>
          </div>`;
          }).join('')}
        </div>
        <div class="summary">
          ${q.cbm > 0 ? `
          <div class="load-card">
            <div class="load-head">🚢 ${t('load_title')}</div>
            <div class="load-row"><span>${t('load_cbm')}</span><b>${q.cbm.toFixed(2)} ${t('cbm_unit')}</b></div>
            ${q.kg > 0 ? `<div class="load-row"><span>${t('load_weight')}</span><b>${new Intl.NumberFormat('en-US').format(Math.round(q.kg))} kg</b></div>` : ''}
            <div class="load-row"><span>${t('load_recommend')}</span><b style="color:var(--accent);">${loadLabel(q.plan)}</b></div>
            ${q.plan.mode === 'FCL' || q.plan.mode === 'FCL_MULTI' ? `
            <div class="fill-track"><div class="fill-bar" style="width:${Math.min(100, q.plan.fillPct)}%;"></div></div>
            <div class="fill-cap">${q.cbm.toFixed(1)} ${t('load_fill_of')} ${q.plan.container.usableCbm * (q.plan.count || 1)} ${t('cbm_unit')} · ${q.plan.fillPct}%</div>` : ''}
          </div>` : ''}

          <h3>${t('order_summary')}</h3>
          <div class="row"><span>${t('subtotal')}</span><b>${money(subtotal)}${anyOnRequest ? ' +' : ''}</b></div>
          ${anyOnRequest ? `<div class="row" style="color: var(--muted); font-size: 13px;"><span>${t('price_request')}</span></div>` : ''}

          <div class="ship-quote">
            <div class="ship-head">📦 ${t('ship_title')}</div>
            <div style="margin:8px 0;"><label>${t('ship_dest')}</label>
              <input id="w-country" list="w-country-list" value="${esc(buyer.country || '')}" placeholder="${LANG === 'en' ? 'Egypt, UAE, Russia…' : 'مصر، الإمارات، روسيا…'}">
              <datalist id="w-country-list">${['مصر', 'الإمارات', 'السعودية', 'روسيا', 'الأردن', 'العراق', 'ليبيا', 'الكويت', 'قطر', 'عمان', 'البحرين'].map((c) => `<option value="${c}">`).join('')}</datalist>
              ${q.port ? `<small style="color:var(--muted);">⚓ ${esc(q.port)}</small>` : ''}</div>
            <div style="margin:8px 0;">
              <label>${t('ship_mode')}</label>
              <div class="mode-switch">
                <button type="button" class="${wsShipMode === 'sea' ? 'active' : ''}" data-mode="sea">${t('mode_sea')}</button>
                <button type="button" class="${wsShipMode === 'air' ? 'active' : ''}" data-mode="air">${t('mode_air')}</button>
              </div>
            </div>
            <div class="row"><span>🕒 ${t('lead_title')}</span><b id="lead-val" style="color:var(--accent);">${esc(leadNow(buyer.country, wsShipMode))}</b></div>
            <div style="margin:8px 0;">
              <label>${t('ship_incoterm')}</label>
              <select id="w-incoterm">
                ${allowed.map((c) => `<option value="${c}" ${c === wsIncoterm ? 'selected' : ''}>${esc(incName(c))}</option>`).join('')}
              </select>
            </div>
            <div class="row"><span>${t('ship_goods')}</span><span>${usdMoney(q.goods)}</span></div>
            ${q.freight ? `<div class="row"><span>${t('ship_freight')}</span><span>${usdMoney(q.freight)}</span></div>` : (q.plan.mode === 'EMPTY' && incotermDef(wsIncoterm).freight ? `<div class="row" style="color:var(--muted);"><span>${t('ship_freight')}</span><span>${t('ship_freight_tbd')}</span></div>` : '')}
            ${q.insurance ? `<div class="row"><span>${t('ship_insurance')}</span><span>${usdMoney(q.insurance)}</span></div>` : ''}
            ${q.customs ? `<div class="row" style="color:var(--amber);"><span>${t('ship_customs')}</span><span>${usdMoney(q.customs)}</span></div>` : ''}
            <div class="row total" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px;"><span>${t('ship_grand')}</span><span>${usdMoney(q.total)}</span></div>
            ${(() => {
              const pay = paymentTerms(cc);
              if (pay.fullUpfront) return `
              <div style="margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;">
                <div class="ship-head" style="font-size:13px;">💵 ${t('pay_terms_title')}</div>
                <div class="row" style="color:var(--green);"><span>${t('pay_full')}</span><b>${usdMoney(q.total)}</b></div>
                <div class="note" style="margin:6px 0 0;font-size:11.5px;">${t('pay_full_note')}</div>
              </div>`;
              const dp = Number(pay.depositPct) || 0, bp = Number(pay.balancePct) || 0;
              return (dp || bp) ? `
              <div style="margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;">
                <div class="ship-head" style="font-size:13px;">💵 ${t('pay_terms_title')}</div>
                <div class="row" style="color:var(--green);"><span>${t('ws_pay_deposit', { p: dp })}</span><b>${usdMoney(q.total * dp / 100)}</b></div>
                <div class="row"><span>${t('ws_pay_balance', { p: bp })}</span><b>${usdMoney(q.total * bp / 100)}</b></div>
              </div>` : '';
            })()}
            <div class="note" style="margin:8px 0 0;font-size:12px;">${t('ship_usd_note')}${q.customs ? '<br>⚠️ ' + t('ship_customs_note') : ''}</div>
          </div>

          <hr style="border-color: var(--line);">
          <div class="note" style="margin:0;font-size:12.5px;">${LANG === 'en' ? '✅ No account needed — just your name and WhatsApp number. We reply with the final quote on WhatsApp.' : '✅ من غير حساب ولا باسورد — اسمك ورقم الواتساب بس، وهنرد عليك بعرض السعر النهائي على واتساب.'}</div>

          ${pointsDiscount ? `<div class="row" style="color: var(--green);"><span>${t('points_row')} ⭐</span><b>- ${money(pointsDiscount)}</b></div>` : ''}
          ${creditDiscount ? `<div class="row" style="color: var(--green);"><span>${t('credit_row')} 💳</span><b>- ${money(creditDiscount)}</b></div>` : ''}

            <small>${LANG === 'en' ? `Activated on delivery · next order must be at least ${cbInfo.multiplier}× the cashback used` : `بيتفعّل بعد استلام الطلب · الفاتورة الجاية لازم تكون ${cbInfo.multiplier} أضعاف الكاش باك المستخدم`}</small>

          <div><label>${t('city')}</label><select id="c-city"><option value="">${t('gov_choose')}</option>${(SITE.governorates || Object.keys(SITE.shippingRates || {})).map((g) => { const f = (SITE.shippingRates || {})[g]; return `<option value="${esc(g)}">${esc(g)}${f !== undefined ? ' — ' + money(f) : ''}</option>`; }).join('')}</select></div>

          <button class="btn" id="submit-order">${t('confirm_order')}</button>

        const hint = document.createElement('small'); hint.id = 'c-phone-hint'; hint.style.cssText = 'display:block;font-size:12.5px;margin-top:4px;';
        phoneEl.insertAdjacentElement('afterend', hint);
        const check = () => {
          const v = phoneEl.value.replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[^\d]/g, '');
          if (v !== phoneEl.value) phoneEl.value = v;
          if (!v) { hint.textContent = ''; phoneEl.style.borderColor = ''; return; }
          const ok = /^01[0125]\d{8}$/.test(v);

          hint.textContent = ok ? (LANG === 'en' ? '✓ Valid number' : '✓ رقم صحيح')
            : v.length < 11 ? (LANG === 'en' ? `Mobile number is 11 digits (${v.length}/11)` : `رقم الموبايل ١١ رقم (كتبت ${v.length})`)
            : (LANG === 'en' ? 'Must start with 010, 011, 012 or 015' : 'لازم يبدأ بـ 010 أو 011 أو 012 أو 015');
        };
        phoneEl.addEventListener('input', check); check();

      container.querySelectorAll('[data-qty]').forEach((input) => {

          appliedCoupon = null;

      container.querySelectorAll('[data-step]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const c = getCart();
          const p = products.find((x) => x.id === btn.dataset.step);
          c[btn.dataset.step] = Math.max(1, Math.min(p.stock, (c[btn.dataset.step] || 1) + Number(btn.dataset.d)));
          setCart(c);
          appliedCoupon = null;
          render();
        });
      });

      document.getElementById('use-points')?.addEventListener('change', (e) => {
        usePoints = e.target.checked;
        render();

      document.getElementById('use-cashback')?.addEventListener('change', (e) => { useCashback = e.target.checked; render(); });
      document.getElementById('use-credit')?.addEventListener('change', (e) => {
        useCredit = e.target.checked;
        render();
      });
      container.querySelectorAll('[data-add]').forEach((btn) =>
        btn.addEventListener('click', () => {

        if (appliedCoupon) { appliedCoupon = null; return render(); }
        const code = document.getElementById('c-coupon').value.trim();
        if (!code) return;
        try {
          const data = await api('/coupons', {
            method: 'POST',
            body: JSON.stringify({ action: 'validate', code, subtotal, items: items.map((p) => ({ id: p.id, qty: cart[p.id] })) }),
          });
          appliedCoupon = data;
          toast(t('coupon_ok', { v: money(data.discount) }));
          render();
        } catch (e) { toast('⚠️ ' + e.message); }
      });

      document.getElementById('submit-order').addEventListener('click', async (e) => {
        trackEvent('checkout');
        const btn = e.target;
        const errBox = document.getElementById('order-error');
        errBox.textContent = '';
        const customer = {
          name: document.getElementById('c-name').value.trim(),
          phone: document.getElementById('c-phone').value.trim(),
          city: document.getElementById('c-city').value.trim(),
          email: document.getElementById('c-email').value.trim(),
          address: document.getElementById('c-address').value.trim(),
        };
        if (customer.phone && !/^01[0125]\d{8}$/.test(customer.phone)) {
          errBox.textContent = LANG === 'en' ? 'Please check the mobile number (11 digits starting with 01)' : 'راجع رقم الموبايل — ١١ رقم بيبدأ بـ 01';
          document.getElementById('c-phone').focus();
          return;
        }
        if (!customer.name || !customer.phone || !customer.address || !customer.city) {
          errBox.textContent = t('fill_required');
          return;
        }
        btn.disabled = true;
        btn.textContent = t('sending');
        try {
          const c = getCart();
          const order = await api('/orders', {
            method: 'POST',
            headers: userHeaders(),
            body: JSON.stringify({
              customer,
              notes: document.getElementById('c-notes').value.trim(),
              payment: document.querySelector('input[name="pay"]:checked').value,
              coupon: appliedCoupon ? appliedCoupon.code : '',
              usePoints: usePoints ? myPoints : 0,

              items: Object.entries(c).map(([id, qty]) => ({ id, qty, partNumber: getPartChoices()[id] || '' })),

          });
          setCart({});
          try { localStorage.removeItem('sav_compare'); } catch {}
          // 🧭 لو جاي من حاسبة التوفير: نسجّل إن الرحلة انتهت بطلب
          try {
            const sid = localStorage.getItem('sav_sid'), sc = JSON.parse(localStorage.getItem('sav_customer') || 'null');
            if (sid && sc && sc.phone) fetch(API + '/savings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
              body: JSON.stringify({ action: 'track', sid, stage: 'order', customer: sc, info: { total: order.total, save: order.marketSaving || 0 } }) }).catch(() => {});
          } catch {}
          formDraft['c-notes'] = '';
          // 💳 الدفع بالبطاقة: تحويل مباشر لصفحة Paymob الآمنة
          if (order.payment === 'card') {
            btn.textContent = t('pay_redirect');
            try {
              const pay = await api('/pay', {
                method: 'POST',
                body: JSON.stringify({ number: order.number, phone: order.customer.phone }),
              });
              location.href = pay.iframe_url;
              return;
            } catch (payErr) {
              toast('⚠️ ' + payErr.message);
            }
          }
          if (order.cashbackEarned) toast((LANG === 'en' ? '🎁 You earned cashback: ' : '🎁 كسبت كاش باك: ') + money(order.cashbackEarned));
          showSuccess(order);
        } catch (err) {
          errBox.textContent = err.message;
          btn.disabled = false;
          btn.textContent = t('confirm_order');
        }
      });
    }

    function showSuccess(order) {
      trackEvent('order_placed', { ord: order.number, val: order.total });
      const lines = order.items.map((i) => `• ${i.name} × ${i.qty}`).join('\n');
      const payLabel = { cod: t('pay_cod'), deposit: t('pay_deposit_short'), instapay: t('pay_instapay'), wallet: t('pay_wallet'), card: t('pay_card') }[order.payment];
      const cur = LANG === 'en' ? 'EGP' : 'جنيه';
      const depLine = order.payment === 'deposit' ? `\n${t('deposit_label')}: ${order.deposit} ${cur} — ${t('balance_label')}: ${order.balanceDue} ${cur}` : '';
      const waText = `${LANG === 'en' ? 'New website order 🛒' : 'طلب جديد من الموقع 🛒'}\n${t('order_no')} ${order.number}\n${order.customer.name} — ${order.customer.phone}\n${lines}\n${payLabel}\n${t('total_due')}: ${order.total} ${cur}${depLine}`;

      let payBox = '';
      if (order.payment === 'card' && !order.paid) {
        payBox = `<button class="btn" onclick='payCard("${esc(order.number)}", "${esc(order.customer.phone)}")'>${t('pay_now')}</button>`;
      } else if (order.payment === 'cod') {
        payBox = `<div class="note" style="text-align: start;">${t('pay_step_cod', { v: money(order.total) })}</div>`;
      } else if (order.payment === 'deposit') {
        payBox = `<div class="note" style="text-align: start;">${t('pay_step_deposit', { d: money(order.deposit), b: money(order.balanceDue), n: esc(SITE.instapay) })}</div>`;
      } else if (order.payment === 'instapay') {
        payBox = `<div class="note" style="text-align: start;">${t('pay_step_instapay', { v: money(order.total), n: esc(SITE.instapay) })}</div>`;
      } else if (order.payment === 'wallet') {
        payBox = `<div class="note" style="text-align: start;">${t('pay_step_wallet', { v: money(order.total), n: esc(SITE.wallet) })}</div>`;
      }

      container.innerHTML = `
      <div class="success-box">
        <span class="icon">✅</span>
        <h2>${t('order_success')}</h2>
        <p>${t('order_no')}</p>
        <div class="order-number">${esc(order.number)}</div>
        ${order.discount ? `<p style="color: var(--green); margin-top: 8px;">${t('saved', { v: money(order.discount) })}</p>` : ''}
        ${order.pointsUsed ? `<p style="color: var(--green); margin-top: 4px;">⭐ ${t('points_row')}: -${money(order.pointsUsed)}</p>` : ''}
        ${order.pointsEarned ? `<p style="color: var(--amber); margin-top: 4px;">${t('points_earned', { n: order.pointsEarned })}</p>` : ''}
        ${payBox}
        <p style="color: var(--muted); margin: 14px 0;">${t('contact_confirm', { p: esc(order.customer.phone) })}<br>
        ${t('track_anytime')} <a href="/track.html?number=${esc(order.number)}&phone=${esc(order.customer.phone)}" style="color: var(--accent-dark);">${t('track_page')}</a>.</p>
        <a class="btn btn-green" target="_blank" rel="noopener" href="${waLink(waText)}">${t('confirm_wa')}</a>
        <br><br>
        <a href="/shop.html" style="color: var(--accent-dark);">${t('back_shop')}</a>
      </div>`;
      window.scrollTo(0, 0);
    }

    async function payCard(number, phone) {
      try {
        const pay = await api('/pay', { method: 'POST', body: JSON.stringify({ number, phone }) });
        location.href = pay.iframe_url;
      } catch (e) { toast('⚠️ ' + e.message); }
    }

    load();
  </script>
</body>
</html>
